<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#102a34"
>

<title>
  พกสุข Camera
</title>


<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>


<style>

:root{
  --primary:#188596;
  --primary2:#19b59e;
  --green:#15a875;
  --bg:#091d24;
  --panel:#123945;
  --text:#fff;
  --muted:#bdd0d7;
}


*{
  box-sizing:border-box;
}


html,
body{
  margin:0;
  min-height:100%;
  color:var(--text);
  background:
    linear-gradient(
      180deg,
      #102d37,
      #091c23
    );
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Thai",
    Tahoma,
    sans-serif;
}


.hidden{
  display:none!important;
}


main{
  width:min(720px,100%);
  margin:auto;
  padding:
    18px
    15px
    calc(
      20px
      +
      env(safe-area-inset-bottom)
    );
}


.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:25px;
  font-weight:900;
}


.logo{
  width:47px;
  height:47px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );
}


.subtitle{
  margin-top:9px;
  text-align:center;
  color:var(--muted);
}


.card{
  margin-top:17px;
  padding:14px;
  background:var(--panel);
  border-radius:24px;
}


.camera{
  position:relative;
  overflow:hidden;
  width:100%;
  aspect-ratio:3/4;
  background:black;
  border-radius:20px;
}


.camera video,
.camera img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}


.scan-frame{
  position:absolute;
  left:50%;
  top:50%;
  width:78%;
  aspect-ratio:1;
  transform:
    translate(-50%,-50%);
  pointer-events:none;
}


.corner{
  position:absolute;
  width:55px;
  height:55px;
}


.tl{
  top:0;
  left:0;
  border-top:6px solid white;
  border-left:6px solid white;
}


.tr{
  top:0;
  right:0;
  border-top:6px solid white;
  border-right:6px solid white;
}


.bl{
  bottom:0;
  left:0;
  border-bottom:6px solid white;
  border-left:6px solid white;
}


.br{
  bottom:0;
  right:0;
  border-bottom:6px solid white;
  border-right:6px solid white;
}


.face{
  position:absolute;
  left:50%;
  top:50%;
  width:62%;
  height:68%;
  transform:
    translate(-50%,-50%);
  border:3px solid white;
  border-radius:45%;
}


.status{
  margin-top:10px;
  padding:12px;
  text-align:center;
  color:var(--muted);
  background:
    rgba(255,255,255,.06);
  border-radius:14px;
}


.status.success{
  color:#dffff3;
  background:
    rgba(21,168,117,.2);
}


.btn{
  width:100%;
  min-height:57px;
  margin-top:9px;
  border:0;
  border-radius:16px;
  font:inherit;
  font-size:18px;
  font-weight:900;
}


.primary{
  color:white;
  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );
}


.success{
  color:white;
  background:var(--green);
}


.secondary{
  color:#17313c;
  background:#e7f0f3;
}


.tip{
  margin-top:9px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}


canvas{
  display:none;
}

</style>

</head>


<body>

<main>


<div class="brand">

  <div class="logo">

    <svg
      width="25"
      height="25"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
    </svg>

  </div>

  พกสุข Camera

</div>


<div
  id="subtitle"
  class="subtitle"
></div>


<section
  id="scannerPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="scanVideo"
      autoplay
      muted
      playsinline
    ></video>


    <div class="scan-frame">

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

    </div>

  </div>


  <canvas id="scanCanvas"></canvas>


  <div
    id="scanStatus"
    class="status"
  >
    กำลังเปิดกล้อง...
  </div>


  <div class="tip">
    นำ QR เข้าในกรอบและถือให้นิ่ง
  </div>


  <button
    class="btn primary"
    onclick="restartScanner()"
  >
    เปิดกล้อง / สแกนใหม่
  </button>


  <button
    class="btn secondary"
    onclick="returnHome()"
  >
    กลับ
  </button>

</section>


<section
  id="photoPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="photoVideo"
      autoplay
      muted
      playsinline
    ></video>

    <img
      id="photoPreview"
      class="hidden"
    >

    <div class="face"></div>

  </div>


  <button
    id="captureBtn"
    class="btn primary"
    onclick="capturePhoto()"
  >
    ถ่ายภาพ
  </button>


  <button
    id="useBtn"
    class="btn success hidden"
    onclick="sendPhoto()"
  >
    ใช้ภาพนี้
  </button>


  <button
    id="retakeBtn"
    class="btn secondary hidden"
    onclick="retakePhoto()"
  >
    ถ่ายใหม่
  </button>


  <button
    class="btn secondary"
    onclick="returnHome()"
  >
    กลับ
  </button>

</section>


</main>


<script>

const PARAMS =
  new URLSearchParams(
    location.search
  );


const MODE =
  PARAMS.get('mode')
  || 'scan';


const FACING =
  PARAMS.get('facing')
  || 'environment';


const SESSION =
  PARAMS.get('session')
  || '';


const RETURN_URL =
  PARAMS.get('returnUrl')
  || '';


let scanStream =
  null;

let photoStream =
  null;

let scanning =
  false;

let qrFound =
  false;

let loopId =
  null;

let lastScan =
  0;

let capturedPhoto =
  '';


window.addEventListener(
  'load',
  init
);


async function init(){

  if (
    !SESSION ||
    !RETURN_URL
  ){

    alert(
      'ข้อมูล Camera Session ไม่ครบ กรุณาเปิดกล้องจากระบบพกสุข'
    );

    return;

  }


  if (
    typeof jsQR
    !== 'function'
  ){

    alert(
      'โหลดตัวอ่าน QR ไม่สำเร็จ'
    );

    return;

  }


  if (
    MODE === 'photo'
  ){

    document
      .getElementById(
        'photoPage'
      )
      .classList
      .remove(
        'hidden'
      );


    document
      .getElementById(
        'subtitle'
      )
      .textContent =
      'ถ่ายภาพยืนยันสมาชิก';


    await startPhoto();

    return;

  }


  document
    .getElementById(
      'scannerPage'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'subtitle'
    )
    .textContent =
    'สแกน QR ประจำตัวสมาชิก';


  await startScanner();

}


/* ======================================================
 POST BACK TO APPS SCRIPT
====================================================== */

function postBack(fields){

  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';


  form.action =
    RETURN_URL;


  form.style.display =
    'none';


  Object.keys(fields)
    .forEach(key => {

      const input =
        document.createElement(
          'input'
        );


      input.type =
        'hidden';


      input.name =
        key;


      input.value =
        fields[key];


      form.appendChild(
        input
      );

    });


  document.body.appendChild(
    form
  );


  form.submit();

}


/* ======================================================
 QR SCANNER
====================================================== */

async function startScanner(){

  await stopScanner();


  qrFound =
    false;


  const status =
    document.getElementById(
      'scanStatus'
    );


  const video =
    document.getElementById(
      'scanVideo'
    );


  status.className =
    'status';


  status.textContent =
    'กำลังเปิดกล้องหลัง...';


  try{

    scanStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            facingMode:{
              ideal:'environment'
            },

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            }

          }

        });


    video.srcObject =
      scanStream;


    await video.play();


    await waitVideo(
      video
    );


    scanning =
      true;


    status.textContent =
      'นำ QR เข้าในกรอบ';


    scanLoop();


  }catch(error){

    alert(
      'เปิดกล้องไม่ได้\n\n'
      +
      (
        error.message
        ||
        error
      )
    );

  }

}


function waitVideo(video){

  return new Promise(
    resolve => {

      const check =
        () => {

          if (
            video.videoWidth > 0
            &&
            video.videoHeight > 0
          ){

            resolve();

          } else {

            requestAnimationFrame(
              check
            );

          }

        };


      check();

    }
  );

}


function scanLoop(time=0){

  if (
    !scanning ||
    qrFound
  ){

    return;

  }


  loopId =
    requestAnimationFrame(
      scanLoop
    );


  if (
    time - lastScan
    < 120
  ){

    return;

  }


  lastScan =
    time;


  const video =
    document.getElementById(
      'scanVideo'
    );


  if (
    !video.videoWidth
  ){

    return;

  }


  decodeFrame(
    video
  );

}


function decodeFrame(video){

  const canvas =
    document.getElementById(
      'scanCanvas'
    );


  const ctx =
    canvas.getContext(
      '2d',
      {
        willReadFrequently:true
      }
    );


  const ratio =
    Math.min(
      1,
      900 /
      video.videoWidth
    );


  const width =
    Math.round(
      video.videoWidth
      *
      ratio
    );


  const height =
    Math.round(
      video.videoHeight
      *
      ratio
    );


  canvas.width =
    width;


  canvas.height =
    height;


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  const image =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  const result =
    jsQR(
      image.data,
      width,
      height,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );


  if (
    result &&
    result.data
  ){

    qrSuccess(
      result.data
    );

  }

}


async function qrSuccess(value){

  if (
    qrFound
  ){

    return;

  }


  value =
    String(
      value || ''
    ).trim();


  if (!value){

    return;

  }


  qrFound =
    true;

  scanning =
    false;


  document
    .getElementById(
      'scanStatus'
    )
    .className =
    'status success';


  document
    .getElementById(
      'scanStatus'
    )
    .textContent =
    'อ่าน QR สำเร็จ กำลังกลับระบบพกสุข...';


  await stopScanner();


  /*
    ส่งกลับด้วย POST
    ไม่ใช้ window.opener
  */
  postBack({

    cameraAction:
      'qr',

    cameraSession:
      SESSION,

    cameraValue:
      value

  });

}


async function stopScanner(){

  scanning =
    false;


  if (loopId){

    cancelAnimationFrame(
      loopId
    );

    loopId =
      null;

  }


  if (scanStream){

    scanStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    scanStream =
      null;

  }

}


async function restartScanner(){

  await startScanner();

}


/* ======================================================
 PHOTO CAMERA
====================================================== */

async function startPhoto(){

  await stopPhoto();


  try{

    photoStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            facingMode:{
              ideal:FACING
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          }

        });


    const video =
      document.getElementById(
        'photoVideo'
      );


    video.srcObject =
      photoStream;


    video.classList.remove(
      'hidden'
    );


    await video.play();


  }catch(error){

    alert(
      'เปิดกล้องไม่ได้\n\n'
      +
      (
        error.message
        ||
        error
      )
    );

  }

}


async function stopPhoto(){

  if (photoStream){

    photoStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    photoStream =
      null;

  }

}


/* ======================================================
 CAPTURE
====================================================== */

async function capturePhoto(){

  const video =
    document.getElementById(
      'photoVideo'
    );


  if (
    !video.videoWidth
  ){

    alert(
      'กล้องยังไม่พร้อม'
    );

    return;

  }


  const MAX_SIDE =
    560;


  const QUALITY =
    .32;


  const scale =
    Math.min(
      1,
      MAX_SIDE /
      Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    Math.round(
      video.videoWidth
      *
      scale
    );


  canvas.height =
    Math.round(
      video.videoHeight
      *
      scale
    );


  canvas
    .getContext(
      '2d',
      {
        alpha:false
      }
    )
    .drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


  capturedPhoto =
    canvas.toDataURL(
      'image/webp',
      QUALITY
    );


  if (
    !capturedPhoto.startsWith(
      'data:image/webp'
    )
  ){

    capturedPhoto =
      canvas.toDataURL(
        'image/jpeg',
        QUALITY
      );

  }


  await stopPhoto();


  document
    .getElementById(
      'photoPreview'
    )
    .src =
    capturedPhoto;


  document
    .getElementById(
      'photoPreview'
    )
    .classList.remove(
      'hidden'
    );


  video.classList.add(
    'hidden'
  );


  document
    .getElementById(
      'captureBtn'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'useBtn'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'retakeBtn'
    )
    .classList.remove(
      'hidden'
    );

}


async function retakePhoto(){

  capturedPhoto =
    '';


  document
    .getElementById(
      'photoPreview'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'captureBtn'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'useBtn'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'retakeBtn'
    )
    .classList.add(
      'hidden'
    );


  await startPhoto();

}


/* ======================================================
 SEND PHOTO VIA POST
====================================================== */

async function sendPhoto(){

  if (
    !capturedPhoto
  ){

    alert(
      'ยังไม่ได้ถ่ายภาพ'
    );

    return;

  }


  await stopPhoto();


  /*
    รูปส่งกลับเป็น POST body
    ไม่ใช่ URL
  */
  postBack({

    cameraAction:
      'photo',

    cameraSession:
      SESSION,

    cameraData:
      capturedPhoto

  });

}


/* ======================================================
 BACK
====================================================== */

async function returnHome(){

  await stopScanner();

  await stopPhoto();


  window.location.replace(
    RETURN_URL
  );

}


window.addEventListener(
  'pagehide',
  () => {

    stopScanner();
    stopPhoto();

  }
);

</script>

</body>
</html>
