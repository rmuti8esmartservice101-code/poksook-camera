<!doctype html>

<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta
  name="theme-color"
  content="#087f7b">

<title>
  พกสุข Camera
</title>


<script
  src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
</script>


<style>

:root {

  --primary:#087f7b;
  --primary2:#22aaa0;

  --mint:#e4f7f4;

  --bg:#f4f8f9;

  --text:#17383c;

  --muted:#718589;

  --border:#dde9eb;

  --shadow:
    0 16px 45px
    rgba(18,73,80,.10);
}


* {
  box-sizing:border-box;
}


body {

  margin:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;

  background:
    var(--bg);

  color:
    var(--text);
}


.page {

  width:
    min(620px,100%);

  margin:auto;

  padding:
    calc(
      25px +
      env(safe-area-inset-top)
    )
    16px
    calc(
      28px +
      env(safe-area-inset-bottom)
    );
}


/* BRAND */

.brand {

  display:flex;

  align-items:center;

  gap:12px;

  margin-bottom:25px;
}


.brand-icon {

  width:46px;

  height:46px;

  display:grid;

  place-items:center;

  color:white;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  box-shadow:
    0 10px 25px
    rgba(8,127,123,.2);
}


.brand-icon svg {

  width:24px;
  height:24px;
}


.brand h1 {

  margin:0;

  font-size:21px;
}


.brand p {

  margin:2px 0 0;

  color:
    var(--muted);

  font-size:13px;
}


/* HERO */

.hero {

  text-align:center;

  margin-bottom:18px;
}


.icon {

  width:62px;

  height:62px;

  margin:
    0 auto 12px;

  display:grid;

  place-items:center;

  color:
    var(--primary);

  background:
    var(--mint);

  border-radius:21px;
}


.icon svg {

  width:30px;
  height:30px;
}


.hero h2 {

  margin:
    0 0 7px;

  font-size:23px;
}


.status {

  margin:0;

  min-height:21px;

  color:
    var(--muted);

  font-size:14px;
}


/* CAMERA */

.camera-card {

  padding:10px;

  background:white;

  border:
    1px solid
    var(--border);

  border-radius:26px;

  box-shadow:
    var(--shadow);
}


.video-wrap {

  position:relative;

  width:100%;

  aspect-ratio:4/3;

  overflow:hidden;

  border-radius:20px;

  background:#101415;
}


video {

  display:block;

  width:100%;
  height:100%;

  object-fit:cover;
}


.qr-guide {

  position:absolute;

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%);

  width:58%;

  aspect-ratio:1;

  border:
    3px solid
    rgba(255,255,255,.85);

  border-radius:20px;

  box-shadow:
    0 0 0 999px
    rgba(0,0,0,.25);

  pointer-events:none;
}


.face-guide {

  position:absolute;

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%);

  width:52%;

  height:72%;

  border:
    3px solid
    rgba(255,255,255,.9);

  border-radius:48%;

  pointer-events:none;
}


.preview {

  display:block;

  width:100%;

  max-height:65vh;

  object-fit:contain;

  border-radius:20px;

  background:#101415;
}


/* BUTTON */

.controls {

  display:grid;

  gap:10px;

  margin-top:15px;
}


button {

  width:100%;

  min-height:53px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:9px;

  border:0;

  border-radius:16px;

  padding:12px;

  font-size:16px;

  font-weight:700;

  cursor:pointer;
}


button svg {

  width:20px;
  height:20px;
}


.primary {

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      #18a097
    );

  box-shadow:
    0 9px 24px
    rgba(8,127,123,.20);
}


.secondary {

  color:
    #086b67;

  background:
    var(--mint);
}


.white {

  color:
    var(--text);

  background:white;

  border:
    1px solid
    var(--border);
}


/* FALLBACK */

.fallback {

  margin-top:15px;

  padding:17px;

  text-align:center;

  border:
    1px dashed
    #bad9d6;

  border-radius:18px;

  background:
    #f9fcfc;
}


.file-label {

  display:block;

  margin-top:12px;

  padding:14px;

  color:
    #086b67;

  background:
    var(--mint);

  border-radius:14px;

  font-weight:700;

  cursor:pointer;
}


input[type=file] {

  display:none;
}


.help {

  margin-top:14px;

  padding:14px 16px;

  border-radius:16px;

  color:#60777b;

  background:#edf4f5;

  font-size:13px;

  line-height:1.55;
}


.hidden {

  display:none !important;
}


.toast {

  position:fixed;

  left:50%;

  bottom:
    calc(
      22px +
      env(safe-area-inset-bottom)
    );

  transform:
    translateX(-50%);

  z-index:9999;

  max-width:90vw;

  padding:
    13px 18px;

  color:white;

  background:#17383c;

  border-radius:15px;
}

</style>

</head>


<body>


<div class="page">


  <div class="brand">


    <div class="brand-icon">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8">

        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.9-8.6a5.5 5.5 0 0 0-.1-7.8z"/>

      </svg>

    </div>


    <div>

      <h1>
        พกสุข
      </h1>

      <p>
        กล้องสำหรับระบบสุขภาพชุมชน
      </p>

    </div>

  </div>


  <section class="hero">


    <div
      id="modeIcon"
      class="icon">
    </div>


    <h2 id="title">
      Camera
    </h2>


    <p
      id="status"
      class="status">

      กดปุ่มเปิดกล้อง

    </p>


  </section>


  <section class="camera-card">


    <div
      id="videoWrap"
      class="video-wrap">


      <video
        id="video"
        playsinline
        autoplay
        muted>
      </video>


      <div
        id="qrGuide"
        class="qr-guide hidden">
      </div>


      <div
        id="faceGuide"
        class="face-guide hidden">
      </div>


    </div>


    <img
      id="preview"
      class="preview hidden">


    <canvas
      id="canvas"
      hidden>
    </canvas>


    <div class="controls">


      <button
        id="openButton"
        class="primary">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8">

          <path d="M14.5 4 16 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3l1.5-3z"/>

          <circle
            cx="12"
            cy="13"
            r="3"/>

        </svg>

        เปิดกล้อง

      </button>


      <button
        id="captureButton"
        class="primary hidden">

        ถ่ายภาพ

      </button>


      <button
        id="switchButton"
        class="secondary hidden">

        สลับกล้อง

      </button>


      <button
        id="retakeButton"
        class="white hidden">

        ถ่ายใหม่

      </button>


      <button
        id="useButton"
        class="primary hidden">

        ใช้ภาพนี้

      </button>


    </div>


    <div
      id="fallback"
      class="fallback hidden">

      <strong>
        ใช้กล้องของอุปกรณ์แทน
      </strong>

      <p class="status">
        หากกล้องสดเปิดไม่ได้
        สามารถถ่ายหรือเลือกรูปจากเครื่อง
      </p>


      <label
        class="file-label"
        for="fileInput">

        เปิดกล้อง / เลือกรูป

      </label>


      <input
        id="fileInput"
        type="file"
        accept="image/*">


    </div>


  </section>


  <div
    id="permissionHelp"
    class="help hidden">

    <strong>
      กล้องถูก Browser ปฏิเสธ
    </strong>

    <br>

    กรุณาอนุญาต Camera
    สำหรับเว็บไซต์
    rmuti8esmartservice101-code.github.io
    แล้วกดเปิดกล้องอีกครั้ง

  </div>


</div>


<div
  id="toast"
  class="toast hidden">
</div>


<form
  id="returnForm"
  method="post"
  hidden>

  <input
    id="formMode"
    name="mode">

  <input
    id="formAction"
    name="cameraAction">

  <input
    id="formSession"
    name="cameraSession">

  <input
    id="formValue"
    name="cameraValue">

  <input
    id="formData"
    name="cameraData">

</form>


<script>

function el(id) {

  return document
    .getElementById(id);
}


const params =
  new URLSearchParams(
    location.search
  );


const session =
  params.get(
    'cameraSession'
  ) || '';


const mode =
  params.get('mode') ||
  'kiosk';


const action =
  params.get('action') ||
  'qr';


const returnUrl =
  params.get('returnUrl') ||
  '';


const video =
  el('video');


const canvas =
  el('canvas');


const ctx =
  canvas.getContext(
    '2d',
    {
      willReadFrequently:true
    }
  );


let stream = null;

let cameras = [];

let currentCamera = 0;

let scanTimer = null;

let photoData = '';


/* =====================================================
   UI
===================================================== */

if (
  action === 'qr'
) {

  el('title').textContent =
    'สแกน QR สมาชิก';


  el('qrGuide')
    .classList
    .remove('hidden');


  el('modeIcon')
    .innerHTML = `

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8">

        <rect x="3" y="3" width="6" height="6"/>
        <rect x="15" y="3" width="6" height="6"/>
        <rect x="3" y="15" width="6" height="6"/>

        <path d="M15 15h2v2h-2zM19 15h2v6h-6v-2M15 19h2"/>

      </svg>
    `;

}

else {

  el('title').textContent =
    'ถ่ายภาพยืนยัน';


  el('faceGuide')
    .classList
    .remove('hidden');


  el('modeIcon')
    .innerHTML = `

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8">

        <path d="M14.5 4 16 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3l1.5-3z"/>

        <circle
          cx="12"
          cy="13"
          r="3"/>

      </svg>
    `;
}


el('fileInput')
  .setAttribute(
    'capture',
    action === 'photo'
      ? 'user'
      : 'environment'
  );


el('openButton')
  .onclick =
  openCamera;


el('captureButton')
  .onclick =
  takePhoto;


el('switchButton')
  .onclick =
  switchCamera;


el('retakeButton')
  .onclick =
  retake;


el('useButton')
  .onclick =
  function() {

    sendResult({
      data:
        photoData
    });
  };


el('fileInput')
  .onchange =
  nativeFile;


/* =====================================================
   CAMERA
===================================================== */

async function openCamera() {

  el('permissionHelp')
    .classList
    .add('hidden');


  /*
   ต้องเป็น top-level page
  */
  if (
    window.self !==
    window.top
  ) {

    setStatus(
      'กรุณาเปิดหน้ากล้องใน Browser โดยตรง'
    );

    return;
  }


  if (
    !window.isSecureContext
  ) {

    fallback(
      'เว็บไซต์ต้องเปิดผ่าน HTTPS'
    );

    return;
  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices
      .getUserMedia
  ) {

    fallback(
      'Browser นี้ไม่รองรับกล้องสด'
    );

    return;
  }


  setStatus(
    'กำลังขออนุญาตใช้กล้อง...'
  );


  stopCamera();


  const facing =
    action === 'photo'
      ? 'user'
      : 'environment';


  const attempts = [

    {

      audio:false,

      video:{

        facingMode:{
          ideal:facing
        },

        width:{
          ideal:1280
        },

        height:{
          ideal:720
        }
      }
    },

    {

      audio:false,

      video:{

        facingMode:{
          ideal:facing
        }
      }
    },

    {

      audio:false,
      video:true
    }
  ];


  let lastError = null;


  for (
    const constraints
    of attempts
  ) {

    try {

      stream =
        await navigator
          .mediaDevices
          .getUserMedia(
            constraints
          );


      break;

    }

    catch(error) {

      lastError =
        error;
    }
  }


  if (!stream) {

    handleCameraError(
      lastError
    );

    return;
  }


  video.srcObject =
    stream;


  await video.play();


  await loadCameras();


  el('openButton')
    .classList
    .add('hidden');


  el('fallback')
    .classList
    .add('hidden');


  el('switchButton')
    .classList
    .toggle(
      'hidden',
      cameras.length < 2
    );


  if (
    action === 'photo'
  ) {

    el('captureButton')
      .classList
      .remove('hidden');


    setStatus(
      'จัดใบหน้าให้อยู่กลางกรอบ'
    );

  }

  else {

    setStatus(
      'นำ QR มาไว้ภายในกรอบ'
    );


    startScanner();
  }
}


async function loadCameras() {

  try {

    cameras =
      (
        await navigator
          .mediaDevices
          .enumerateDevices()
      )
      .filter(
        function(device) {

          return (
            device.kind ===
            'videoinput'
          );
        }
      );

  }

  catch(_) {

    cameras = [];
  }
}


async function switchCamera() {

  if (
    cameras.length < 2
  ) {

    return;
  }


  currentCamera =
    (
      currentCamera + 1
    )
    %
    cameras.length;


  stopScanner();

  stopCamera();


  try {

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            deviceId:{

              exact:
                cameras[
                  currentCamera
                ].deviceId
            }
          }
        });


    video.srcObject =
      stream;


    await video.play();


    if (
      action === 'qr'
    ) {

      startScanner();
    }

  }

  catch(error) {

    handleCameraError(
      error
    );
  }
}


/* =====================================================
   QR
===================================================== */

function startScanner() {

  stopScanner();


  scanTimer =
    setInterval(
      scanFrame,
      180
    );
}


function scanFrame() {

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return;
  }


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const image =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const qr =
    jsQR(
      image.data,
      image.width,
      image.height,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );


  if (!qr) {

    return;
  }


  stopScanner();

  stopCamera();


  setStatus(
    'พบ QR แล้ว'
  );


  sendResult({
    value:
      qr.data
  });
}


/* =====================================================
   PHOTO
===================================================== */

function takePhoto() {

  if (
    !video.videoWidth
  ) {

    toast(
      'กล้องยังไม่พร้อม'
    );

    return;
  }


  photoData =
    compress(
      video,
      video.videoWidth,
      video.videoHeight
    );


  stopCamera();


  el('preview').src =
    photoData;


  el('preview')
    .classList
    .remove('hidden');


  el('videoWrap')
    .classList
    .add('hidden');


  el('captureButton')
    .classList
    .add('hidden');


  el('switchButton')
    .classList
    .add('hidden');


  el('retakeButton')
    .classList
    .remove('hidden');


  el('useButton')
    .classList
    .remove('hidden');


  setStatus(
    'ตรวจสอบภาพก่อนยืนยัน'
  );
}


function retake() {

  photoData = '';


  el('preview')
    .classList
    .add('hidden');


  el('videoWrap')
    .classList
    .remove('hidden');


  el('retakeButton')
    .classList
    .add('hidden');


  el('useButton')
    .classList
    .add('hidden');


  el('openButton')
    .classList
    .remove('hidden');


  setStatus(
    'กดเปิดกล้องเพื่อถ่ายใหม่'
  );
}


/* =====================================================
   FALLBACK FILE / NATIVE CAMERA
===================================================== */

function fallback(message) {

  stopScanner();

  stopCamera();


  setStatus(
    message
  );


  el('fallback')
    .classList
    .remove('hidden');
}


function nativeFile(event) {

  const file =
    event.target.files &&
    event.target.files[0];


  if (!file) {

    return;
  }


  const image =
    new Image();


  const url =
    URL.createObjectURL(
      file
    );


  image.onload =
    function() {

      if (
        action === 'qr'
      ) {

        canvas.width =
          image.width;


        canvas.height =
          image.height;


        ctx.drawImage(
          image,
          0,
          0
        );


        const pixels =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const qr =
          jsQR(
            pixels.data,
            pixels.width,
            pixels.height,
            {
              inversionAttempts:
                'attemptBoth'
            }
          );


        URL.revokeObjectURL(
          url
        );


        if (!qr) {

          toast(
            'ไม่พบ QR ในภาพ'
          );

          return;
        }


        sendResult({
          value:
            qr.data
        });


        return;
      }


      photoData =
        compress(
          image,
          image.width,
          image.height
        );


      URL.revokeObjectURL(
        url
      );


      el('fallback')
        .classList
        .add('hidden');


      el('preview').src =
        photoData;


      el('preview')
        .classList
        .remove('hidden');


      el('videoWrap')
        .classList
        .add('hidden');


      el('retakeButton')
        .classList
        .remove('hidden');


      el('useButton')
        .classList
        .remove('hidden');


      setStatus(
        'ตรวจสอบภาพก่อนยืนยัน'
      );
    };


  image.src =
    url;
}


/* =====================================================
   COMPRESS
===================================================== */

function compress(
  source,
  originalWidth,
  originalHeight
) {

  const maxSide =
    520;


  let width =
    originalWidth;


  let height =
    originalHeight;


  if (
    Math.max(
      width,
      height
    ) >
    maxSide
  ) {

    const ratio =
      maxSide /
      Math.max(
        width,
        height
      );


    width =
      Math.round(
        width * ratio
      );


    height =
      Math.round(
        height * ratio
      );
  }


  canvas.width =
    width;


  canvas.height =
    height;


  ctx.drawImage(
    source,
    0,
    0,
    width,
    height
  );


  let data =
    canvas.toDataURL(
      'image/webp',
      .30
    );


  if (
    !data.startsWith(
      'data:image/webp'
    )
  ) {

    data =
      canvas.toDataURL(
        'image/jpeg',
        .30
      );
  }


  return data;
}


/* =====================================================
   SEND RESULT
===================================================== */

function sendResult(result) {

  if (!returnUrl) {

    setStatus(
      'ไม่พบ Return URL'
    );

    return;
  }


  stopScanner();

  stopCamera();


  el('returnForm').action =
    returnUrl;


  el('formMode').value =
    mode;


  el('formAction').value =
    action;


  el('formSession').value =
    session;


  if (
    action === 'qr'
  ) {

    el('formValue').value =
      result.value ||
      '';

  }

  else {

    el('formData').value =
      result.data ||
      '';
  }


  setStatus(
    'กำลังส่งข้อมูลกลับพกสุข...'
  );


  el('returnForm')
    .submit();
}


/* =====================================================
   ERROR
===================================================== */

function handleCameraError(
  error
) {

  console.error(
    error
  );


  let message =
    'เปิดกล้องไม่ได้';


  if (
    error &&
    (
      error.name ===
      'NotAllowedError'
      ||
      error.name ===
      'SecurityError'
    )
  ) {

    message =
      'ไม่ได้รับอนุญาตให้ใช้กล้อง';


    el('permissionHelp')
      .classList
      .remove('hidden');
  }


  else if (
    error &&
    error.name ===
    'NotFoundError'
  ) {

    message =
      'ไม่พบกล้อง';
  }


  else if (
    error &&
    error.name ===
    'NotReadableError'
  ) {

    message =
      'กล้องกำลังถูกโปรแกรมอื่นใช้งาน';
  }


  else if (
    error &&
    error.message
  ) {

    message =
      error.message;
  }


  fallback(
    message
  );
}


/* =====================================================
   HELPERS
===================================================== */

function setStatus(text) {

  el('status')
    .textContent =
    text;
}


function toast(text) {

  el('toast')
    .textContent =
    text;


  el('toast')
    .classList
    .remove('hidden');


  setTimeout(
    function() {

      el('toast')
        .classList
        .add('hidden');

    },
    2600
  );
}


function stopCamera() {

  if (!stream) {

    return;
  }


  stream
    .getTracks()
    .forEach(
      function(track) {

        track.stop();
      }
    );


  stream = null;


  video.srcObject =
    null;
}


function stopScanner() {

  if (scanTimer) {

    clearInterval(
      scanTimer
    );


    scanTimer = null;
  }
}


window.addEventListener(
  'beforeunload',
  function() {

    stopScanner();

    stopCamera();
  }
);

</script>
