<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#0b2630"
>

<title>
  พกสุข Camera
</title>


<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>


<style>

:root{
  --primary:#148a9a;
  --primary2:#19b39c;
  --green:#12a876;
  --red:#e15f67;

  --bg:#071c23;
  --panel:#113844;

  --text:#fff;
  --muted:#b9ced5;
}


*{
  box-sizing:border-box;
}


html,
body{
  margin:0;
  min-height:100%;

  color:var(--text);

  background:
    linear-gradient(
      180deg,
      #102d37,
      #071b22
    );

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Thai",
    Tahoma,
    sans-serif;
}


.hidden{
  display:none!important;
}


main{
  width:min(720px,100%);
  margin:auto;

  padding:
    18px
    15px
    calc(
      22px
      +
      env(safe-area-inset-bottom)
    );
}


.brand{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;

  font-size:25px;
  font-weight:900;
}


.logo{
  width:50px;
  height:50px;

  display:grid;
  place-items:center;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );
}


.subtitle{
  margin-top:10px;

  color:var(--muted);

  text-align:center;
}


.card{
  margin-top:18px;
  padding:15px;

  background:
    rgba(17,56,68,.97);

  border-radius:24px;
}


.camera{
  position:relative;

  width:100%;

  overflow:hidden;

  aspect-ratio:3/4;

  background:#000;

  border-radius:21px;
}


.camera video,
.camera img{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;
}


.placeholder{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:13px;

  padding:25px;

  text-align:center;

  background:
    linear-gradient(
      180deg,
      #081d24,
      #0b2730
    );
}


.placeholder-icon{
  width:82px;
  height:82px;

  display:grid;
  place-items:center;

  color:#d8f7f2;

  background:
    rgba(25,179,156,.12);

  border-radius:27px;
}


.placeholder strong{
  font-size:21px;
}


.placeholder p{
  max-width:360px;

  margin:0;

  color:var(--muted);

  line-height:1.55;
}


.scan-frame{
  position:absolute;
  z-index:5;

  left:50%;
  top:50%;

  width:78%;
  aspect-ratio:1;

  transform:
    translate(-50%,-50%);

  pointer-events:none;
}


.corner{
  position:absolute;

  width:56px;
  height:56px;
}


.tl{
  top:0;
  left:0;

  border-top:6px solid white;
  border-left:6px solid white;
}


.tr{
  top:0;
  right:0;

  border-top:6px solid white;
  border-right:6px solid white;
}


.bl{
  bottom:0;
  left:0;

  border-bottom:6px solid white;
  border-left:6px solid white;
}


.br{
  right:0;
  bottom:0;

  border-right:6px solid white;
  border-bottom:6px solid white;
}


.face-guide{
  position:absolute;
  z-index:5;

  left:50%;
  top:50%;

  width:62%;
  height:68%;

  transform:
    translate(-50%,-50%);

  border:
    3px solid white;

  border-radius:45%;

  pointer-events:none;
}


.status{
  margin-top:11px;

  padding:12px;

  color:var(--muted);

  text-align:center;

  background:
    rgba(255,255,255,.06);

  border-radius:14px;
}


.status.success{
  color:#dbfff3;

  background:
    rgba(18,168,118,.20);
}


.status.error{
  color:#ffdadd;

  background:
    rgba(225,95,103,.20);
}


.tip{
  margin-top:10px;

  color:var(--muted);

  text-align:center;

  font-size:13px;

  line-height:1.5;
}


.btn{
  width:100%;
  min-height:59px;

  margin-top:10px;

  padding:12px 17px;

  border:0;
  border-radius:17px;

  font:inherit;
  font-size:18px;
  font-weight:900;
}


.btn:disabled{
  opacity:.5;
}


.primary{
  color:white;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );
}


.success{
  color:white;
  background:var(--green);
}


.secondary{
  color:#17313c;
  background:#e8f1f3;
}


.info{
  margin-top:9px;

  color:#8dafb8;

  text-align:center;

  font-size:11px;
}


canvas{
  display:none;
}

</style>

</head>


<body>

<main>


<div class="brand">

  <div class="logo">

    <svg
      width="27"
      height="27"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
    </svg>

  </div>

  พกสุข Camera

</div>


<div
  id="subtitle"
  class="subtitle"
></div>


<!-- QR -->

<section
  id="scannerPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="scanVideo"
      autoplay
      muted
      playsinline
    ></video>


    <div
      id="scanPlaceholder"
      class="placeholder"
    >

      <div class="placeholder-icon">

        <svg
          width="38"
          height="38"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path d="M14.5 4 16 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3l1.5-3Z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>

      </div>

      <strong>
        พร้อมสแกน QR
      </strong>

      <p>
        แตะปุ่มด้านล่างเพื่อเปิดกล้องหลัง
      </p>

    </div>


    <div
      id="scanFrame"
      class="scan-frame hidden"
    >

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

    </div>

  </div>


  <canvas id="scanCanvas"></canvas>


  <div
    id="scanStatus"
    class="status"
  >
    แตะ “เปิดกล้องสแกน QR”
  </div>


  <div class="tip">
    นำ QR ให้อยู่กลางกรอบและถือให้นิ่ง
  </div>


  <button
    id="scanButton"
    class="btn primary"
    onclick="startScanner()"
  >
    เปิดกล้องสแกน QR
  </button>


  <button
    class="btn secondary"
    onclick="returnHome()"
  >
    กลับระบบพกสุข
  </button>


  <div
    id="scanInfo"
    class="info"
  ></div>

</section>


<!-- PHOTO -->

<section
  id="photoPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="photoVideo"
      autoplay
      muted
      playsinline
    ></video>


    <img
      id="photoPreview"
      class="hidden"
    >


    <div
      id="photoPlaceholder"
      class="placeholder"
    >

      <div class="placeholder-icon">

        <svg
          width="38"
          height="38"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path d="M14.5 4 16 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3l1.5-3Z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>

      </div>

      <strong>
        ถ่ายภาพยืนยัน
      </strong>

      <p>
        แตะปุ่มด้านล่างเพื่อเปิดกล้องหน้า
      </p>

    </div>


    <div
      id="faceGuide"
      class="face-guide hidden"
    ></div>

  </div>


  <button
    id="openPhotoButton"
    class="btn primary"
    onclick="startPhotoCamera()"
  >
    เปิดกล้องหน้า
  </button>


  <button
    id="captureButton"
    class="btn primary hidden"
    onclick="capturePhoto()"
  >
    ถ่ายภาพ
  </button>


  <button
    id="useButton"
    class="btn success hidden"
    onclick="sendPhoto()"
  >
    ใช้ภาพนี้
  </button>


  <button
    id="retakeButton"
    class="btn secondary hidden"
    onclick="retakePhoto()"
  >
    ถ่ายใหม่
  </button>


  <button
    class="btn secondary"
    onclick="returnHome()"
  >
    กลับระบบพกสุข
  </button>


  <div
    id="photoInfo"
    class="info"
  ></div>

</section>


</main>


<script>

/* ======================================================
 PARAMS
====================================================== */

const PARAMS =
  new URLSearchParams(
    location.search
  );


const MODE =
  PARAMS.get(
    'mode'
  )
  || 'scan';


const FACING =
  PARAMS.get(
    'facing'
  )
  || 'environment';


const SESSION =
  PARAMS.get(
    'session'
  )
  || '';


const APP_MODE =
  PARAMS.get(
    'appMode'
  )
  || 'kiosk';


const RETURN_URL =
  PARAMS.get(
    'returnUrl'
  )
  || '';


/* ======================================================
 STATE
====================================================== */

let scanStream =
  null;


let photoStream =
  null;


let scanning =
  false;


let qrFound =
  false;


let scanLoopId =
  null;


let lastScan =
  0;


let capturedPhoto =
  '';


/* ======================================================
 INIT
====================================================== */

window.addEventListener(
  'load',
  init
);


async function init(){

  if (
    !SESSION
    ||
    !RETURN_URL
  ){

    alert(
      'ข้อมูล Camera Session ไม่ครบ กรุณาเปิดกล้องจากระบบพกสุข'
    );

    return;

  }


  if (
    MODE === 'scan'
    &&
    typeof jsQR
    !== 'function'
  ){

    alert(
      'โหลดระบบอ่าน QR ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต'
    );

    return;

  }


  if (
    MODE === 'photo'
  ){

    document
      .getElementById(
        'photoPage'
      )
      .classList.remove(
        'hidden'
      );


    document
      .getElementById(
        'subtitle'
      )
      .textContent =
      'ถ่ายภาพยืนยันสมาชิก';


    return;

  }


  document
    .getElementById(
      'scannerPage'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'subtitle'
    )
    .textContent =
    'สแกน QR ประจำตัวสมาชิก';

}


/* ======================================================
 CAMERA UTIL
====================================================== */

function sleep(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


function waitVideo(
  video,
  timeout=6000
){

  return new Promise(
    resolve => {

      const started =
        Date.now();


      const check =
        () => {

          if (
            video.videoWidth > 0
            &&
            video.videoHeight > 0
          ){

            resolve(
              true
            );

            return;

          }


          if (
            Date.now()
            -
            started
            >
            timeout
          ){

            resolve(
              false
            );

            return;

          }


          requestAnimationFrame(
            check
          );

        };


      check();

    }
  );

}


function cameraWithTimeout(
  constraints,
  timeout=12000
){

  return Promise.race([

    navigator.mediaDevices
      .getUserMedia(
        constraints
      ),

    new Promise(
      (_,reject) => {

        setTimeout(
          () => {

            reject(
              new Error(
                'เปิดกล้องนานเกินไป'
              )
            );

          },
          timeout
        );

      }
    )

  ]);

}


/* ======================================================
 SCANNER
====================================================== */

async function startScanner(){

  const button =
    document.getElementById(
      'scanButton'
    );


  const status =
    document.getElementById(
      'scanStatus'
    );


  button.disabled =
    true;


  status.className =
    'status';


  status.textContent =
    'กำลังเปิดกล้องหลัง...';


  await stopScanner();


  qrFound =
    false;


  const video =
    document.getElementById(
      'scanVideo'
    );


  try{

    if (
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices
        .getUserMedia
    ){

      throw new Error(
        'Browser นี้ไม่รองรับ Camera API'
      );

    }


    /*
      เปิดกล้องหลังแบบ simple constraint
    */
    try{

      scanStream =
        await cameraWithTimeout({

          audio:false,

          video:{
            facingMode:
              'environment'
          }

        });


    }catch(firstError){

      console.warn(
        firstError
      );


      /*
        fallback แบบ video:true
      */
      scanStream =
        await cameraWithTimeout({

          audio:false,

          video:true

        });

    }


    video.srcObject =
      scanStream;


    video.muted =
      true;


    video.playsInline =
      true;


    await video.play();


    let ready =
      await waitVideo(
        video,
        5000
      );


    /*
      iPhone black preview workaround
    */
    if (!ready){

      const keepStream =
        scanStream;


      video.pause();

      video.srcObject =
        null;


      await sleep(
        350
      );


      video.srcObject =
        keepStream;


      await video.play();


      ready =
        await waitVideo(
          video,
          5000
        );

    }


    if (!ready){

      throw new Error(
        'กล้องเปิดแล้วแต่ไม่มีภาพ กรุณาลองใหม่'
      );

    }


    document
      .getElementById(
        'scanPlaceholder'
      )
      .classList.add(
        'hidden'
      );


    document
      .getElementById(
        'scanFrame'
      )
      .classList.remove(
        'hidden'
      );


    status.textContent =
      'นำ QR เข้าในกรอบ';


    document
      .getElementById(
        'scanInfo'
      )
      .textContent =
      'Camera ready • '
      +
      video.videoWidth
      +
      ' × '
      +
      video.videoHeight;


    button.textContent =
      'สแกนใหม่';


    button.disabled =
      false;


    scanning =
      true;


    lastScan =
      0;


    scanLoop();


  }catch(error){

    console.error(
      error
    );


    await stopScanner();


    status.className =
      'status error';


    status.textContent =
      'เปิดกล้องไม่สำเร็จ';


    button.disabled =
      false;


    button.textContent =
      'ลองเปิดกล้องใหม่';


    alert(
      'เปิดกล้องไม่ได้\n\n'
      +
      (
        error.message
        ||
        error
      )
      +
      '\n\nกรุณาตรวจสอบสิทธิ์ Camera แล้วลองใหม่'
    );

  }

}


function scanLoop(
  timestamp=0
){

  if (
    !scanning
    ||
    qrFound
  ){

    return;

  }


  scanLoopId =
    requestAnimationFrame(
      scanLoop
    );


  if (
    timestamp
    -
    lastScan
    <
    120
  ){

    return;

  }


  lastScan =
    timestamp;


  const video =
    document.getElementById(
      'scanVideo'
    );


  if (
    !video
    ||
    video.readyState < 2
    ||
    !video.videoWidth
  ){

    return;

  }


  decodeFrame(
    video
  );

}


function decodeFrame(
  video
){

  const canvas =
    document.getElementById(
      'scanCanvas'
    );


  const ctx =
    canvas.getContext(
      '2d',
      {
        willReadFrequently:true
      }
    );


  const ratio =
    Math.min(
      1,
      900 /
      video.videoWidth
    );


  const width =
    Math.max(
      1,
      Math.round(
        video.videoWidth
        *
        ratio
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        video.videoHeight
        *
        ratio
      )
    );


  canvas.width =
    width;


  canvas.height =
    height;


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  const image =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  let result =
    jsQR(
      image.data,
      width,
      height,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );


  if (
    result
    &&
    result.data
  ){

    qrSuccess(
      result.data
    );

    return;

  }


  /*
    crop กลางภาพ
  */
  const size =
    Math.floor(
      Math.min(
        width,
        height
      )
      *
      .84
    );


  const x =
    Math.max(
      0,
      Math.floor(
        (
          width - size
        )
        /
        2
      )
    );


  const y =
    Math.max(
      0,
      Math.floor(
        (
          height - size
        )
        /
        2
      )
    );


  const crop =
    ctx.getImageData(
      x,
      y,
      size,
      size
    );


  result =
    jsQR(
      crop.data,
      size,
      size,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );


  if (
    result
    &&
    result.data
  ){

    qrSuccess(
      result.data
    );

  }

}


async function qrSuccess(
  value
){

  if (
    qrFound
  ){

    return;

  }


  value =
    String(
      value || ''
    ).trim();


  if (!value){

    return;

  }


  qrFound =
    true;


  scanning =
    false;


  const status =
    document.getElementById(
      'scanStatus'
    );


  status.className =
    'status success';


  status.textContent =
    'อ่าน QR สำเร็จ กำลังกลับระบบพกสุข...';


  await stopScanner();


  postBack({

    mode:
      APP_MODE,

    cameraAction:
      'qr',

    cameraSession:
      SESSION,

    cameraValue:
      value

  });

}


async function stopScanner(){

  scanning =
    false;


  if (
    scanLoopId
  ){

    cancelAnimationFrame(
      scanLoopId
    );


    scanLoopId =
      null;

  }


  if (
    scanStream
  ){

    scanStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    scanStream =
      null;

  }


  const video =
    document.getElementById(
      'scanVideo'
    );


  if (video){

    try{
      video.pause();
    }catch(_){}


    video.srcObject =
      null;

  }

}


/* ======================================================
 PHOTO CAMERA
====================================================== */

async function startPhotoCamera(){

  const button =
    document.getElementById(
      'openPhotoButton'
    );


  button.disabled =
    true;


  document
    .getElementById(
      'photoInfo'
    )
    .textContent =
    'กำลังเปิดกล้องหน้า...';


  await stopPhotoCamera();


  const video =
    document.getElementById(
      'photoVideo'
    );


  try{

    try{

      photoStream =
        await cameraWithTimeout({

          audio:false,

          video:{
            facingMode:
              'user'
          }

        });


    }catch(firstError){

      console.warn(
        firstError
      );


      photoStream =
        await cameraWithTimeout({

          audio:false,

          video:true

        });

    }


    video.srcObject =
      photoStream;


    video.muted =
      true;


    video.playsInline =
      true;


    await video.play();


    let ready =
      await waitVideo(
        video,
        5000
      );


    if (!ready){

      const keepStream =
        photoStream;


      video.pause();

      video.srcObject =
        null;


      await sleep(
        350
      );


      video.srcObject =
        keepStream;


      await video.play();


      ready =
        await waitVideo(
          video,
          5000
        );

    }


    if (!ready){

      throw new Error(
        'กล้องเปิดแล้วแต่ไม่มีภาพ'
      );

    }


    document
      .getElementById(
        'photoPlaceholder'
      )
      .classList.add(
        'hidden'
      );


    document
      .getElementById(
        'faceGuide'
      )
      .classList.remove(
        'hidden'
      );


    button.classList.add(
      'hidden'
    );


    document
      .getElementById(
        'captureButton'
      )
      .classList.remove(
        'hidden'
      );


    document
      .getElementById(
        'photoInfo'
      )
      .textContent =
      'Camera ready • '
      +
      video.videoWidth
      +
      ' × '
      +
      video.videoHeight;


  }catch(error){

    await stopPhotoCamera();


    button.disabled =
      false;


    document
      .getElementById(
        'photoInfo'
      )
      .textContent =
      'เปิดกล้องไม่สำเร็จ';


    alert(
      'เปิดกล้องไม่ได้\n\n'
      +
      (
        error.message
        ||
        error
      )
    );

  }

}


async function stopPhotoCamera(){

  if (
    photoStream
  ){

    photoStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    photoStream =
      null;

  }


  const video =
    document.getElementById(
      'photoVideo'
    );


  if (video){

    try{
      video.pause();
    }catch(_){}


    video.srcObject =
      null;

  }

}


async function capturePhoto(){

  const video =
    document.getElementById(
      'photoVideo'
    );


  if (
    !video
    ||
    !video.videoWidth
  ){

    alert(
      'กล้องยังไม่พร้อม'
    );

    return;

  }


  const MAX_SIDE =
    560;


  const QUALITY =
    .32;


  const scale =
    Math.min(
      1,
      MAX_SIDE /
      Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        video.videoWidth
        *
        scale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        video.videoHeight
        *
        scale
      )
    );


  canvas
    .getContext(
      '2d',
      {
        alpha:false
      }
    )
    .drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


  capturedPhoto =
    canvas.toDataURL(
      'image/webp',
      QUALITY
    );


  if (
    !capturedPhoto.startsWith(
      'data:image/webp'
    )
  ){

    capturedPhoto =
      canvas.toDataURL(
        'image/jpeg',
        QUALITY
      );

  }


  await stopPhotoCamera();


  const preview =
    document.getElementById(
      'photoPreview'
    );


  preview.src =
    capturedPhoto;


  preview.classList.remove(
    'hidden'
  );


  video.classList.add(
    'hidden'
  );


  document
    .getElementById(
      'faceGuide'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'captureButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'useButton'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'retakeButton'
    )
    .classList.remove(
      'hidden'
    );

}


async function retakePhoto(){

  capturedPhoto =
    '';


  document
    .getElementById(
      'photoPreview'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'useButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'retakeButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'openPhotoButton'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'openPhotoButton'
    )
    .disabled =
    false;


  document
    .getElementById(
      'photoPlaceholder'
    )
    .classList.remove(
      'hidden'
    );

}


async function sendPhoto(){

  if (
    !capturedPhoto
  ){

    alert(
      'ยังไม่ได้ถ่ายภาพ'
    );

    return;

  }


  await stopPhotoCamera();


  postBack({

    mode:
      APP_MODE,

    cameraAction:
      'photo',

    cameraSession:
      SESSION,

    cameraData:
      capturedPhoto

  });

}


/* ======================================================
 POST BACK
====================================================== */

function postBack(fields){

  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';


  form.action =
    RETURN_URL;


  form.target =
    '_self';


  form.style.display =
    'none';


  Object.keys(
    fields
  )
  .forEach(key => {

    const input =
      document.createElement(
        'input'
      );


    input.type =
      'hidden';


    input.name =
      key;


    input.value =
      fields[key];


    form.appendChild(
      input
    );

  });


  document.body.appendChild(
    form
  );


  form.submit();

}


/* ======================================================
 RETURN
====================================================== */

async function returnHome(){

  await stopScanner();

  await stopPhotoCamera();


  const separator =
    RETURN_URL.includes('?')
      ? '&'
      : '?';


  window.location.href =
    RETURN_URL
    +
    separator
    +
    'mode='
    +
    encodeURIComponent(
      APP_MODE
    );

}


/* ======================================================
 CLEANUP
====================================================== */

window.addEventListener(
  'pagehide',
  () => {

    stopScanner();

    stopPhotoCamera();

  }
);

</script>
