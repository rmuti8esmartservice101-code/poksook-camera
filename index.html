<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#08242d"
>

<title>
  พกสุข Camera
</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;

  background:
    linear-gradient(
      180deg,
      #123943,
      #061b22
    );

  color:white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Thai",
    sans-serif;
}

.hidden{
  display:none!important;
}

main{
  width:min(700px,100%);
  margin:auto;

  padding:
    18px 14px
    calc(
      30px
      +
      env(safe-area-inset-bottom)
    );
}

.brand{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:11px;

  font-size:28px;
  font-weight:900;
}

.logo{
  width:58px;
  height:58px;

  display:grid;
  place-items:center;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      #168b9b,
      #1bb69e
    );

  font-size:31px;
}

.subtitle{
  margin:
    8px 0 17px;

  text-align:center;

  color:#bed2d8;

  font-size:17px;
}

.card{
  padding:14px;

  border-radius:25px;

  background:#123b47;
}

.camera{
  position:relative;

  width:100%;

  aspect-ratio:3/4;

  overflow:hidden;

  border-radius:21px;

  background:black;
}

.camera video,
.camera img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

.placeholder{
  position:absolute;
  inset:0;
  z-index:2;

  display:grid;
  place-items:center;

  padding:30px;

  text-align:center;

  background:#092630;
}

.placeholderIcon{
  width:90px;
  height:90px;

  display:grid;
  place-items:center;

  margin:auto auto 15px;

  border-radius:29px;

  background:
    rgba(
      24,
      180,
      157,
      .14
    );

  font-size:44px;
}

.frame{
  position:absolute;
  z-index:5;

  left:50%;
  top:50%;

  width:72%;

  aspect-ratio:1;

  transform:
    translate(
      -50%,
      -50%
    );

  pointer-events:none;
}

.corner{
  position:absolute;

  width:58px;
  height:58px;
}

.tl{
  top:0;
  left:0;

  border-top:
    6px solid white;

  border-left:
    6px solid white;
}

.tr{
  top:0;
  right:0;

  border-top:
    6px solid white;

  border-right:
    6px solid white;
}

.bl{
  left:0;
  bottom:0;

  border-left:
    6px solid white;

  border-bottom:
    6px solid white;
}

.br{
  right:0;
  bottom:0;

  border-right:
    6px solid white;

  border-bottom:
    6px solid white;
}

.face{
  position:absolute;
  z-index:5;

  left:50%;
  top:50%;

  width:62%;
  height:68%;

  transform:
    translate(
      -50%,
      -50%
    );

  border:
    3px solid white;

  border-radius:45%;

  pointer-events:none;
}

.status{
  margin-top:10px;
  padding:12px;

  text-align:center;

  color:#c1d4da;

  background:
    rgba(
      255,
      255,
      255,
      .06
    );

  border-radius:15px;
}

.status.ok{
  color:#dbfff3;

  background:
    rgba(
      19,
      168,
      119,
      .20
    );
}

.status.warn{
  color:#fff0c8;

  background:
    rgba(
      213,
      153,
      47,
      .18
    );
}

.status.error{
  color:#ffd9dd;

  background:
    rgba(
      220,
      90,
      104,
      .20
    );
}

.btn{
  width:100%;

  min-height:60px;

  margin-top:9px;
  padding:11px 16px;

  border:0;
  border-radius:17px;

  font:inherit;

  font-size:18px;
  font-weight:900;
}

.primary{
  color:white;

  background:
    linear-gradient(
      135deg,
      #168c9d,
      #19b49e
    );
}

.green{
  color:white;
  background:#12a777;
}

.light{
  color:#17323d;
  background:#e9f2f4;
}

.secondary{
  color:white;

  background:
    rgba(
      255,
      255,
      255,
      .12
    );
}

.row{
  display:flex;
  gap:8px;
}

.row .btn{
  flex:1;
}

.nativeBox{
  margin-top:10px;
  padding:14px;

  text-align:center;

  border-radius:17px;

  background:
    rgba(
      255,
      255,
      255,
      .06
    );
}

.fileButton{
  width:100%;

  display:block;

  min-height:59px;

  margin-top:9px;
  padding:17px;

  border-radius:17px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #168c9d,
      #19b49e
    );

  font-size:18px;
  font-weight:900;

  text-align:center;
}

.fileButton input{
  display:none;
}

.info{
  margin-top:8px;

  color:#9fb9c0;

  font-size:13px;

  text-align:center;
}

.badge{
  display:inline-block;

  margin-top:7px;
  padding:6px 10px;

  border-radius:999px;

  background:
    rgba(
      255,
      255,
      255,
      .08
    );

  color:#c7d9de;

  font-size:12px;
}

canvas{
  display:none;
}

</style>

</head>

<body>

<main>


<div class="brand">

  <div class="logo">
    ♡
  </div>

  พกสุข Camera

</div>


<div
  id="subtitle"
  class="subtitle"
></div>


<!-- ================================================
 QR SCANNER
================================================ -->

<section
  id="scanPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="scanVideo"
      autoplay
      muted
      playsinline
      webkit-playsinline
    ></video>


    <img
      id="qrPreview"
      class="hidden"
      alt=""
    >


    <div
      id="scanPlaceholder"
      class="placeholder"
    >

      <div>

        <div class="placeholderIcon">
          ▣
        </div>

        <h2>
          พร้อมสแกน QR
        </h2>

        <p>
          เปิดกล้องสดและนำ QR เข้าในกรอบ
        </p>

      </div>

    </div>


    <div
      id="scanFrame"
      class="frame hidden"
    >

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

    </div>

  </div>


  <canvas id="scanCanvas"></canvas>


  <div
    id="scanStatus"
    class="status"
  >
    พร้อมใช้งาน
  </div>


  <button
    id="startScanBtn"
    class="btn primary"
    onclick="startLiveScan()"
  >
    เปิดกล้องสแกนสด
  </button>


  <div
    id="scanLiveActions"
    class="hidden"
  >

    <div class="row">

      <button
        class="btn secondary"
        onclick="switchCamera('scan')"
      >
        ↺ สลับกล้อง
      </button>

      <button
        class="btn secondary"
        onclick="restartScan()"
      >
        ↻ เริ่มใหม่
      </button>

    </div>

  </div>


  <div
    id="scanFallback"
    class="nativeBox hidden"
  >

    <strong>
      กล้องสดไม่พร้อม
    </strong>

    <div class="info">
      สามารถใช้การถ่ายรูป QR แทนได้
    </div>


    <label class="fileButton">

      ถ่ายรูป QR

      <input
        id="qrFileInput"
        type="file"
        accept="image/*"
        capture="environment"
      >

    </label>

  </div>


  <button
    class="btn light"
    onclick="returnHome()"
  >
    กลับระบบพกสุข
  </button>


  <div class="info">

    <span id="browserInfo"></span>

  </div>

</section>


<!-- ================================================
 PHOTO
================================================ -->

<section
  id="photoPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="photoVideo"
      autoplay
      muted
      playsinline
      webkit-playsinline
    ></video>


    <img
      id="photoPreview"
      class="hidden"
      alt=""
    >


    <div
      id="photoPlaceholder"
      class="placeholder"
    >

      <div>

        <div class="placeholderIcon">
          ◉
        </div>

        <h2>
          ถ่ายภาพเช็กอิน
        </h2>

        <p>
          เปิดกล้องหน้าแล้วจัดใบหน้าให้อยู่กลางภาพ
        </p>

      </div>

    </div>


    <div
      id="faceGuide"
      class="face hidden"
    ></div>

  </div>


  <div
    id="photoStatus"
    class="status"
  >
    พร้อมใช้งาน
  </div>


  <button
    id="startPhotoBtn"
    class="btn primary"
    onclick="startLivePhoto()"
  >
    เปิดกล้องหน้าสด
  </button>


  <div
    id="photoLiveActions"
    class="hidden"
  >

    <button
      id="capturePhotoBtn"
      class="btn primary"
      onclick="captureLivePhoto()"
    >
      ◉ ถ่ายภาพ
    </button>


    <button
      class="btn secondary"
      onclick="switchCamera('photo')"
    >
      ↺ สลับกล้อง
    </button>

  </div>


  <div
    id="photoFallback"
    class="nativeBox hidden"
  >

    <strong>
      กล้องสดไม่พร้อม
    </strong>

    <div class="info">
      สามารถใช้กล้องของเครื่องแทนได้
    </div>


    <label class="fileButton">

      ถ่ายภาพเช็กอิน

      <input
        id="photoFileInput"
        type="file"
        accept="image/*"
        capture="user"
      >

    </label>

  </div>


  <button
    id="usePhotoBtn"
    class="btn green hidden"
    onclick="sendPhoto()"
  >
    ใช้ภาพนี้
  </button>


  <button
    id="retakePhotoBtn"
    class="btn secondary hidden"
    onclick="retakePhoto()"
  >
    ถ่ายใหม่
  </button>


  <button
    class="btn light"
    onclick="returnHome()"
  >
    กลับระบบพกสุข
  </button>

</section>


</main>


<script>

/* =========================================================
 URL PARAMETERS
========================================================= */

const PARAMS =
  new URLSearchParams(
    location.search
  );

const MODE =
  PARAMS.get(
    'mode'
  )
  || 'scan';

const APP_MODE =
  PARAMS.get(
    'appMode'
  )
  || 'kiosk';

const SESSION =
  PARAMS.get(
    'session'
  )
  || '';

const RETURN_URL =
  PARAMS.get(
    'returnUrl'
  )
  || '';

const REQUESTED_FACING =
  PARAMS.get(
    'facing'
  )
  || (
    MODE === 'photo'
      ? 'user'
      : 'environment'
  );


/* =========================================================
 STATE
========================================================= */

let activeStream =
  null;

let activeMode =
  '';

let videoDevices =
  [];

let currentDeviceIndex =
  -1;

let scanning =
  false;

let scanLoop =
  null;

let lastScan =
  0;

let qrFound =
  false;

let photoData =
  '';

const PERMISSION_KEY =
  'poksook_live_camera_granted_v4';


/* =========================================================
 INIT
========================================================= */

window.addEventListener(
  'load',
  init
);


async function init(){

  if (
    !SESSION
    ||
    !RETURN_URL
  ){

    alert(
      'Camera Session ไม่ครบ กรุณากลับไปเปิดจากระบบพกสุข'
    );

    return;
  }


  setupFileInputs();

  showBrowserInfo();


  if (
    MODE === 'photo'
  ){

    document
      .getElementById(
        'photoPage'
      )
      .classList
      .remove(
        'hidden'
      );


    document
      .getElementById(
        'subtitle'
      )
      .textContent =
      'ถ่ายภาพยืนยันสมาชิก';


    /*
     * ถ้าเครื่องนี้เคยเปิด Live Camera สำเร็จแล้ว
     * ลองเปิดให้อัตโนมัติ
     */
    if (
      wasCameraGranted()
    ){

      setTimeout(
        () => {
          startLivePhoto(
            true
          );
        },
        250
      );

    }

    return;
  }


  document
    .getElementById(
      'scanPage'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'subtitle'
    )
    .textContent =
    'สแกน QR ประจำตัวสมาชิก';


  if (
    wasCameraGranted()
  ){

    setTimeout(
      () => {
        startLiveScan(
          true
        );
      },
      250
    );

  }
}


/* =========================================================
 DEVICE / BROWSER INFO
========================================================= */

function showBrowserInfo(){

  const ua =
    navigator.userAgent
    || '';

  let name =
    'Browser';


  if (
    /CriOS/i.test(ua)
  ){

    name =
      'Chrome iOS';

  }else if (
    /Chrome/i.test(ua)
  ){

    name =
      'Chrome';

  }else if (
    /Safari/i.test(ua)
  ){

    name =
      'Safari';

  }


  const element =
    document.getElementById(
      'browserInfo'
    );


  if (element){

    element.textContent =
      name
      +
      ' • HTTPS '
      +
      (
        window.isSecureContext
          ? '✓'
          : '✕'
      );

  }
}


function wasCameraGranted(){

  try{

    return (
      localStorage.getItem(
        PERMISSION_KEY
      )
      === '1'
    );

  }catch(error){

    return false;

  }
}


function rememberCameraGranted(){

  try{

    localStorage.setItem(
      PERMISSION_KEY,
      '1'
    );

  }catch(error){}

}


/* =========================================================
 CAMERA ENGINE
========================================================= */

async function requestCamera(
  preferredFacing,
  preferredDeviceId=''
){

  if (
    !window.isSecureContext
  ){

    throw new Error(
      'Live Camera ต้องเปิดผ่าน HTTPS'
    );

  }


  if (
    !navigator.mediaDevices
    ||
    !navigator.mediaDevices.getUserMedia
  ){

    throw new Error(
      'Browser นี้ไม่รองรับ Live Camera'
    );

  }


  await stopLiveCamera();


  const attempts =
    [];


  /*
   * ถ้ามี deviceId จากปุ่มสลับกล้อง
   */
  if (preferredDeviceId){

    attempts.push({

      audio:false,

      video:{
        deviceId:{
          exact:
            preferredDeviceId
        }
      }

    });

  }


  /*
   * สำคัญ:
   * ใช้ facingMode แบบ STRING ก่อน
   * ไม่ใช้ { ideal: ... } เป็นตัวแรก
   */
  attempts.push({

    audio:false,

    video:{
      facingMode:
        preferredFacing,
      width:{
        ideal:1280
      },
      height:{
        ideal:720
      }
    }

  });


  attempts.push({

    audio:false,

    video:{
      facingMode:
        preferredFacing
    }

  });


  /*
   * fallback กว้างที่สุด
   */
  attempts.push({

    audio:false,

    video:true

  });


  let lastError =
    null;


  for (
    const constraints
    of attempts
  ){

    try{

      const stream =
        await navigator
          .mediaDevices
          .getUserMedia(
            constraints
          );


      activeStream =
        stream;


      rememberCameraGranted();


      await refreshDevices();


      return stream;


    }catch(error){

      lastError =
        error;

    }

  }


  throw (
    lastError
    ||
    new Error(
      'เปิดกล้องไม่ได้'
    )
  );
}


async function refreshDevices(){

  if (
    !navigator.mediaDevices
    ||
    !navigator.mediaDevices.enumerateDevices
  ){

    videoDevices =
      [];

    return;
  }


  try{

    const devices =
      await navigator
        .mediaDevices
        .enumerateDevices();


    videoDevices =
      devices.filter(
        item =>
          item.kind
          === 'videoinput'
      );


    const activeTrack =
      activeStream
      &&
      activeStream
        .getVideoTracks()[0];


    const activeId =
      activeTrack
      &&
      activeTrack.getSettings
      ? activeTrack
          .getSettings()
          .deviceId
      : '';


    currentDeviceIndex =
      videoDevices.findIndex(
        item =>
          item.deviceId
          === activeId
      );


  }catch(error){

    videoDevices =
      [];

  }
}


async function switchCamera(mode){

  try{

    if (
      videoDevices.length < 2
    ){

      await refreshDevices();

    }


    if (
      videoDevices.length < 2
    ){

      setStatus(
        mode,
        'ไม่พบกล้องอื่นสำหรับสลับ',
        'warn'
      );

      return;
    }


    currentDeviceIndex =
      (
        currentDeviceIndex
        +
        1
      )
      %
      videoDevices.length;


    const device =
      videoDevices[
        currentDeviceIndex
      ];


    setStatus(
      mode,
      'กำลังสลับกล้อง...',
      ''
    );


    const stream =
      await requestCamera(
        mode === 'photo'
          ? 'user'
          : 'environment',
        device.deviceId
      );


    if (
      mode === 'scan'
    ){

      attachScanStream(
        stream
      );

    }else{

      attachPhotoStream(
        stream
      );

    }


  }catch(error){

    setStatus(
      mode,
      'สลับกล้องไม่สำเร็จ',
      'error'
    );

  }
}


async function stopLiveCamera(){

  scanning =
    false;


  if (
    scanLoop
  ){

    cancelAnimationFrame(
      scanLoop
    );

    scanLoop =
      null;

  }


  if (
    activeStream
  ){

    activeStream
      .getTracks()
      .forEach(
        track => {

          try{
            track.stop();
          }catch(error){}

        }
      );


    activeStream =
      null;

  }


  [
    'scanVideo',
    'photoVideo'
  ]
  .forEach(id => {

    const video =
      document.getElementById(
        id
      );


    if (!video){
      return;
    }


    try{
      video.pause();
    }catch(error){}


    video.srcObject =
      null;

  });
}


/* =========================================================
 VIDEO ATTACH
========================================================= */

async function prepareVideo(
  video,
  stream
){

  video.setAttribute(
    'playsinline',
    ''
  );

  video.setAttribute(
    'webkit-playsinline',
    ''
  );

  video.playsInline =
    true;

  video.autoplay =
    true;

  video.muted =
    true;

  video.srcObject =
    stream;


  await video.play();


  await waitForVideo(
    video
  );
}


function waitForVideo(
  video,
  timeout=7000
){

  return new Promise(
    (resolve,reject) => {

      const started =
        Date.now();


      function check(){

        if (
          video.videoWidth > 0
          &&
          video.videoHeight > 0
          &&
          video.readyState >= 2
        ){

          resolve(
            true
          );

          return;
        }


        if (
          Date.now()
          -
          started
          >
          timeout
        ){

          reject(
            new Error(
              'กล้องเปิดแล้วแต่ยังไม่มีภาพ'
            )
          );

          return;
        }


        requestAnimationFrame(
          check
        );

      }


      check();

    }
  );
}


/* =========================================================
 STATUS
========================================================= */

function setStatus(
  mode,
  text,
  type=''
){

  const id =
    mode === 'scan'
      ? 'scanStatus'
      : 'photoStatus';


  const element =
    document.getElementById(
      id
    );


  if (!element){
    return;
  }


  element.className =
    'status'
    +
    (
      type
        ? ' ' + type
        : ''
    );


  element.textContent =
    text;
}


/* =========================================================
 LIVE QR
========================================================= */

async function startLiveScan(
  silent=false
){

  const button =
    document.getElementById(
      'startScanBtn'
    );


  button.disabled =
    true;


  setStatus(
    'scan',
    'กำลังเปิดกล้องหลัง...',
    ''
  );


  try{

    const stream =
      await requestCamera(
        'environment'
      );


    await attachScanStream(
      stream
    );


  }catch(error){

    button.disabled =
      false;


    document
      .getElementById(
        'scanFallback'
      )
      .classList
      .remove(
        'hidden'
      );


    setStatus(
      'scan',
      cameraErrorText(
        error
      ),
      'error'
    );


    if (!silent){

      console.error(
        error
      );

    }

  }
}


async function attachScanStream(
  stream
){

  activeMode =
    'scan';


  const video =
    document.getElementById(
      'scanVideo'
    );


  await prepareVideo(
    video,
    stream
  );


  document
    .getElementById(
      'scanPlaceholder'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'scanFrame'

    );

    );

    .getElementById(
      'scanFallback'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'scanLiveActions'
    )
    .classList
    .remove(
      'hidden'
    );


  setStatus(
    'scan',
    'กล้องพร้อม • นำ QR เข้าในกรอบ',
    'ok'
  );


  qrFound =
    false;

  scanning =
    true;

  lastScan =
    0;


  scanFrameLoop();
}


async function restartScan(){

  qrFound =
    false;


  await startLiveScan();
}


function scanFrameLoop(
  timestamp=0
){

  if (
    !scanning
    ||
    qrFound
  ){

    return;
  }


  scanLoop =
    requestAnimationFrame(
      scanFrameLoop
    );


  /*
   * ไม่อ่านทุก frame
   * ลด CPU บน iPhone/iPad
   */
  if (
    timestamp
    -
    lastScan
    <
    160
  ){

    return;
  }


  lastScan =
    timestamp;


  const video =
    document.getElementById(
      'scanVideo'
    );


  if (
    !video.videoWidth
    ||
    video.readyState < 2
  ){

    return;
  }


  decodeLiveQr(
    video
  );
}


function decodeLiveQr(video){

  if (
    typeof jsQR
    !== 'function'
  ){

    setStatus(
      'scan',
      'โหลดระบบอ่าน QR ไม่สำเร็จ',
      'error'
    );

    scanning =
      false;

    return;
  }


  const canvas =
    document.getElementById(
      'scanCanvas'
    );


  const maxSide =
    600;


  const scale =
    Math.min(
      1,
      maxSide
      /
      Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );


  const width =
    Math.max(
      1,
      Math.round(
        video.videoWidth
        *
        scale
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        video.videoHeight
        *
        scale
      )
    );


  canvas.width =
    width;

  canvas.height =
    height;


  const context =
    canvas.getContext(
      '2d',
      {
        willReadFrequently:true
      }
    );


  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  try{

    const image =
      context.getImageData(
        0,
        0,
        width,
        height
      );


    const result =
      jsQR(
        image.data,
        width,
        height,
        {
          inversionAttempts:
            'attemptBoth'
        }
      );


    if (
      result
      &&
      result.data
    ){

      handleQr(
        result.data
      );

    }


  }catch(error){}

}

function decodeQrImage(file){

  setStatus(
    'scan',
    'กำลังอ่าน QR จากภาพ...',
    ''
  );


  const reader =
    new FileReader();


  reader.onload =
    () => {

      const image =
        new Image();


      image.onload =
        () => {

          const preview =
            document.getElementById(
              'qrPreview'
            );


          preview.src =
            reader.result;


          preview.classList
            .remove(
              'hidden'
            );


          document
            .getElementById(
              'scanPlaceholder'
            )
            .classList
            .add(
              'hidden'
            );


          const canvas =
            document.getElementById(
              'scanCanvas'
            );


          const maxSide =
            1400;


          const scale =
            Math.min(
              1,
              maxSide
              /
              Math.max(
                image.naturalWidth,
                image.naturalHeight
              )
            );


          const width =
            Math.round(
              image.naturalWidth
              *
              scale
            );


          const height =
            Math.round(
              image.naturalHeight
              *
              scale
            );


          canvas.width =
            width;

          canvas.height =
            height;


          const context =
            canvas.getContext(
              '2d',
              {
                willReadFrequently:true
              }
            );


          context.drawImage(
            image,
            0,
            0,
            width,
            height
          );


          const data =
            context.getImageData(
              0,
              0,
              width,
              height
            );


          const result =
            jsQR(
              data.data,
              width,
              height,
              {
                inversionAttempts:
                  'attemptBoth'
              }
            );


          if (
            result
            &&
            result.data
          ){

            handleQr(
              result.data
            );

          }else{

            setStatus(
              'scan',
              'อ่าน QR ไม่สำเร็จ กรุณาถ่ายใหม่ให้ QR ชัดขึ้น',
              'error'
            );

          }

        };


      image.src =
        reader.result;

    };


  reader.readAsDataURL(
    file
  );
}


async function handleQr(value){

  if (qrFound){
    return;
  }


  value =
    String(
      value || ''
    )
    .trim();


  if (!value){
    return;
  }


  qrFound =
    true;

  scanning =
    false;


  setStatus(
    'scan',
    'อ่าน QR สำเร็จ • กำลังกลับระบบพกสุข...',
    'ok'
  );


  await stopLiveCamera();


  postBack({

    mode:
      APP_MODE,

    cameraAction:
      'qr',

    cameraSession:
      SESSION,

    cameraValue:
      value

  });
}

function processPhotoFile(file){

  setStatus(
    'photo',
    'กำลังประมวลผลภาพ...',
    ''
  );


  const reader =
    new FileReader();


  reader.onload =
    () => {

      const image =
        new Image();


      image.onload =
        () => {

          photoData =
            compressSource(
              image,
              image.naturalWidth,
              image.naturalHeight
            );


          showPhotoResult();

        };


      image.src =
        reader.result;

    };


  reader.readAsDataURL(
    file
  );
}


function compressSource(
  source,
  sourceWidth,
  sourceHeight
){

  const MAX_SIDE =
    480;

  const QUALITY =
    .30;


  const scale =
    Math.min(
      1,
      MAX_SIDE
      /
      Math.max(
        sourceWidth,
        sourceHeight
      )
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        sourceWidth
        *
        scale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        sourceHeight
        *
        scale
      )
    );


  canvas
    .getContext(
      '2d',
      {
        alpha:false
      }
    )
    .drawImage(
      source,
      0,
      0,
      canvas.width,
      canvas.height
    );


  let output =
    canvas.toDataURL(
      'image/webp',
      QUALITY
    );


  if (
    !output.startsWith(
      'data:image/webp'
    )
  ){

    output =
      canvas.toDataURL(
        'image/jpeg',
        QUALITY
      );

  }


  return output;
}

/* =========================================================
 CAMERA ERRORS
========================================================= */

function cameraErrorText(error){

  const name =
    error
    &&
    error.name
      ? error.name
      : '';


  if (
    name === 'NotAllowedError'
    ||
    name === 'SecurityError'
  ){

    return 'Browser ไม่อนุญาตใช้กล้อง กรุณาอนุญาต Camera ในการตั้งค่าเว็บไซต์';

  }


  if (
    name === 'NotFoundError'
  ){

    return 'ไม่พบกล้องในอุปกรณ์นี้';

  }


  if (
    name === 'NotReadableError'
  ){

    return 'กล้องกำลังถูกแอปอื่นใช้งาน กรุณาปิดแอปกล้องอื่นแล้วลองใหม่';

  }


  if (
    name === 'OverconstrainedError'
  ){

    return 'ไม่พบกล้องตามเงื่อนไข ระบบมีโหมดสำรองให้ใช้งาน';

  }


  return (
    error
    &&
    error.message
  )
    ? error.message
    : 'เปิด Live Camera ไม่สำเร็จ';
}


/* =========================================================
 RETURN
========================================================= */

function postBack(fields){

  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';

  form.action =
    RETURN_URL;

  form.target =
    '_self';


  Object
    .keys(fields)
    .forEach(key => {

      const input =
        document.createElement(
          'input'
        );

      input.type =
        'hidden';

      input.name =
        key;

      input.value =
        fields[key];

      form.appendChild(
        input
      );

    });


  document.body
    .appendChild(
      form
    );


  form.submit();
}
