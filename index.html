<!doctype html>

<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta
  name="theme-color"
  content="#073b70">


<title>
  พกสุข Camera
</title>


<script
  src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
</script>


<style>

:root{
  --navy:#073b70;
  --blue:#087eb8;
  --teal:#07948e;
  --mint:#e5f7f5;
  --bg:#eef7fa;
  --text:#173a46;
  --muted:#71858c;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;

  color:var(--text);
  background:var(--bg);
}

main{
  width:min(640px,100%);

  margin:auto;

  padding:
    calc(22px + env(safe-area-inset-top))
    15px
    28px;

  text-align:center;
}

.logo{
  width:60px;
  height:60px;

  margin:
    0 auto 10px;

  display:grid;
  place-items:center;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #073b70,
      #079b9b
    );

  border-radius:20px;

  font-size:26px;
}

h1{
  margin:5px 0;
}

.status{
  color:var(--muted);
}

.camera{
  position:relative;

  overflow:hidden;

  margin-top:16px;

  border-radius:24px;

  background:#0c1721;

  box-shadow:
    0 15px 35px
    rgba(5,50,80,.14);
}

video{
  display:block;

  width:100%;

  aspect-ratio:3/4;

  object-fit:cover;
}

.qr-guide{
  position:absolute;

  top:50%;
  left:50%;

  width:65%;
  aspect-ratio:1;

  transform:
    translate(-50%,-50%);

  border:
    3px solid #fff;

  border-radius:20px;

  box-shadow:
    0 0 0 999px
    rgba(0,0,0,.28);
}

.face-guide{
  position:absolute;

  top:50%;
  left:50%;

  width:58%;
  height:72%;

  transform:
    translate(-50%,-50%);

  border:
    3px solid #fff;

  border-radius:50%;

  box-shadow:
    0 0 0 999px
    rgba(0,0,0,.18);
}

button,
.file-button{
  width:100%;

  min-height:52px;

  margin-top:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  border-radius:16px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #073b70,
      #088f97
    );

  font-size:16px;
  font-weight:750;

  cursor:pointer;
}

.secondary{
  color:#087069;
  background:var(--mint);
}

.preview{
  width:100%;

  max-height:65vh;

  object-fit:contain;

  border-radius:22px;
}

.fallback{
  margin-top:15px;

  padding:16px;

  background:#fff;

  border-radius:18px;
}

.hidden{
  display:none!important;
}

input[type=file]{
  display:none;
}

</style>

</head>


<body>


<main>


<div class="logo">
  📷
</div>


<h1 id="title">
  พกสุข Camera
</h1>


<p
  id="status"
  class="status">

  กดเปิดกล้อง

</p>


<div
  id="cameraBox"
  class="camera">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <div
    id="qrGuide"
    class="qr-guide hidden">
  </div>


  <div
    id="faceGuide"
    class="face-guide hidden">
  </div>

</div>


<img
  id="preview"
  class="preview hidden">


<canvas
  id="canvas"
  hidden>
</canvas>


<button id="openButton">
  📷 เปิดกล้อง
</button>


<button
  id="captureButton"
  class="hidden">

  📷 ถ่ายภาพ

</button>


<button
  id="switchButton"
  class="secondary hidden">

  🔄 สลับกล้อง

</button>


<button
  id="retakeButton"
  class="secondary hidden">

  ถ่ายใหม่

</button>


<button
  id="useButton"
  class="hidden">

  ✓ ใช้ภาพนี้

</button>


<div
  id="fallback"
  class="fallback hidden">

  <p>
    ถ้ากล้องสดใช้งานไม่ได้
    สามารถใช้กล้องของอุปกรณ์แทน
  </p>


  <label
    for="fileInput"
    class="file-button">

    📷 เปิดกล้อง / เลือกรูป

  </label>


  <input
    id="fileInput"
    type="file"
    accept="image/*">

</div>


<form
  id="resultForm"
  method="post"
  hidden>

  <input
    id="formMode"
    name="mode">

  <input
    id="formAction"
    name="cameraAction">

  <input
    id="formSession"
    name="cameraSession">

  <input
    id="formValue"
    name="cameraValue">

  <input
    id="formData"
    name="cameraData">

</form>


</main>


<script>

function el(id){
  return document.getElementById(id);
}


const params =
  new URLSearchParams(
    location.search
  );


const cameraSession =
  params.get(
    'cameraSession'
  ) || '';


const mode =
  params.get(
    'mode'
  ) || 'kiosk';


const action =
  params.get(
    'action'
  ) || 'qr';


const returnUrl =
  params.get(
    'returnUrl'
  ) || '';


const video =
  el('video');


const canvas =
  el('canvas');


const ctx =
  canvas.getContext(
    '2d',
    {
      willReadFrequently:true
    }
  );


let stream = null;

let cameras = [];

let cameraIndex = 0;

let scanTimer = null;

let photoData = '';


/* INITIAL */

if(action === 'qr'){

  el('title')
    .textContent =
    'สแกน QR สมาชิก';


  el('qrGuide')
    .classList
    .remove('hidden');


  el('fileInput')
    .setAttribute(
      'capture',
      'environment'
    );

}else{

  el('title')
    .textContent =
    'ถ่ายภาพยืนยันกิจกรรม';


  el('faceGuide')
    .classList
    .remove('hidden');


  el('fileInput')
    .setAttribute(
      'capture',
      'user'
    );
}


el('openButton')
  .onclick =
  openCamera;


el('captureButton')
  .onclick =
  takePhoto;


el('switchButton')
  .onclick =
  switchCamera;


el('retakeButton')
  .onclick =
  retake;


el('useButton')
  .onclick =
  function(){

    sendResult({
      data:photoData
    });
  };


el('fileInput')
  .onchange =
  handleFile;


/* CAMERA */

async function openCamera(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    showFallback(
      'Browser นี้ไม่รองรับกล้องสด'
    );

    return;
  }


  try{

    stopCamera();


    stream =
      await navigator.mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            facingMode:{
              ideal:
                action === 'qr'
                  ?
                  'environment'
                  :
                  'user'
            },

            width:{
              ideal:960
            },

            height:{
              ideal:1280
            }
          }
        });


    video.srcObject =
      stream;


    await video.play();


    cameras =
      (
        await navigator.mediaDevices
          .enumerateDevices()
      )
      .filter(
        function(device){

          return (
            device.kind ===
            'videoinput'
          );
        }
      );


    el('openButton')
      .classList
      .add('hidden');


    el('fallback')
      .classList
      .add('hidden');


    el('switchButton')
      .classList
      .toggle(
        'hidden',
        cameras.length < 2
      );


    if(action === 'qr'){

      setStatus(
        'นำ QR ให้อยู่กลางกรอบ'
      );

      startScanner();

    }else{

      el('captureButton')
        .classList
        .remove('hidden');


      setStatus(
        'จัดใบหน้าให้อยู่กลางกรอบ'
      );
    }


  }catch(error){

    console.error(error);


    showFallback(
      error.name === 'NotAllowedError'
        ?
        'ไม่ได้รับอนุญาตให้ใช้กล้อง'
        :
        'เปิดกล้องไม่ได้'
    );
  }
}


/* SWITCH */

async function switchCamera(){

  if(cameras.length < 2){
    return;
  }


  cameraIndex =
    (
      cameraIndex + 1
    )
    %
    cameras.length;


  stopScanner();

  stopCamera();


  try{

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            deviceId:{
              exact:
                cameras[
                  cameraIndex
                ].deviceId
            }
          }
        });


    video.srcObject =
      stream;


    await video.play();


    if(action === 'qr'){
      startScanner();
    }


  }catch(error){

    showFallback(
      'สลับกล้องไม่ได้'
    );
  }
}


/* QR SCANNER */

function startScanner(){

  stopScanner();


  scanTimer =
    setInterval(
      scanFrame,
      180
    );
}


function scanFrame(){

  if(
    !video.videoWidth ||
    !video.videoHeight
  ){
    return;
  }


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const image =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const qr =
    jsQR(
      image.data,
      image.width,
      image.height,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );


  if(!qr){
    return;
  }


  stopScanner();

  stopCamera();


  setStatus(
    'พบ QR แล้ว'
  );


  sendResult({
    value:qr.data
  });
}


/* PHOTO */

function takePhoto(){

  if(!video.videoWidth){
    return;
  }


  photoData =
    makeSmallPhoto(
      video,
      video.videoWidth,
      video.videoHeight
    );


  stopCamera();


  el('preview').src =
    photoData;


  el('preview')
    .classList
    .remove('hidden');


  el('cameraBox')
    .classList
    .add('hidden');


  el('captureButton')
    .classList
    .add('hidden');


  el('switchButton')
    .classList
    .add('hidden');


  el('retakeButton')
    .classList
    .remove('hidden');


  el('useButton')
    .classList
    .remove('hidden');


  setStatus(
    'ตรวจสอบรูปก่อนยืนยัน'
  );
}


function retake(){

  photoData = '';


  el('preview')
    .classList
    .add('hidden');


  el('cameraBox')
    .classList
    .remove('hidden');


  el('retakeButton')
    .classList
    .add('hidden');


  el('useButton')
    .classList
    .add('hidden');


  el('openButton')
    .classList
    .remove('hidden');


  setStatus(
    'กดเปิดกล้องเพื่อถ่ายใหม่'
  );
}


/*
 ขนาดเล็กมากเพื่อใช้ยืนยัน
 240px ด้านยาว
 JPEG quality 0.22
*/
function makeSmallPhoto(
  source,
  originalWidth,
  originalHeight
){

  const MAX_SIDE =
    240;


  let width =
    originalWidth;


  let height =
    originalHeight;


  const ratio =
    Math.min(
      1,
      MAX_SIDE /
      Math.max(
        width,
        height
      )
    );


  width =
    Math.max(
      1,
      Math.round(
        width * ratio
      )
    );


  height =
    Math.max(
      1,
      Math.round(
        height * ratio
      )
    );


  canvas.width =
    width;


  canvas.height =
    height;


  ctx.fillStyle =
    '#ffffff';


  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  ctx.drawImage(
    source,
    0,
    0,
    width,
    height
  );


  return canvas.toDataURL(
    'image/jpeg',
    0.22
  );
}


/* FILE FALLBACK */

function showFallback(message){

  stopScanner();

  stopCamera();


  setStatus(message);


  el('fallback')
    .classList
    .remove('hidden');
}


function handleFile(event){

  const file =
    event.target.files &&
    event.target.files[0];


  if(!file){
    return;
  }


  const image =
    new Image();


  const url =
    URL.createObjectURL(
      file
    );


  image.onload =
    function(){

      if(action === 'qr'){

        canvas.width =
          image.width;


        canvas.height =
          image.height;


        ctx.drawImage(
          image,
          0,
          0
        );


        const data =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const qr =
          jsQR(
            data.data,
            data.width,
            data.height,
            {
              inversionAttempts:
                'attemptBoth'
            }
          );


        URL.revokeObjectURL(
          url
        );


        if(!qr){

          setStatus(
            'ไม่พบ QR ในภาพ'
          );

          return;
        }


        sendResult({
          value:qr.data
        });


        return;
      }


      photoData =
        makeSmallPhoto(
          image,
          image.width,
          image.height
        );


      URL.revokeObjectURL(
        url
      );


      el('cameraBox')
        .classList
        .add('hidden');


      el('fallback')
        .classList
        .add('hidden');


      el('preview').src =
        photoData;


      el('preview')
        .classList
        .remove('hidden');


      el('retakeButton')
        .classList
        .remove('hidden');


      el('useButton')
        .classList
        .remove('hidden');


      setStatus(
        'ตรวจสอบรูปก่อนยืนยัน'
      );
    };


  image.src =
    url;
}


/* RETURN */

function sendResult(result){

  if(!returnUrl){

    setStatus(
      'ไม่พบ Return URL'
    );

    return;
  }


  stopScanner();

  stopCamera();


  el('resultForm').action =
    returnUrl;


  el('formMode').value =
    mode;


  el('formAction').value =
    action;


  el('formSession').value =
    cameraSession;


  if(action === 'qr'){

    el('formValue').value =
      result.value ||
      '';

  }else{

    el('formData').value =
      result.data ||
      '';
  }


  setStatus(
    'กำลังส่งข้อมูลกลับพกสุข...'
  );


  el('resultForm')
    .submit();
}


/* UTILS */

function setStatus(text){

  el('status')
    .textContent =
    text;
}


function stopCamera(){

  if(!stream){
    return;
  }


  stream.getTracks()
    .forEach(
      function(track){
        track.stop();
      }
    );


  stream = null;

  video.srcObject = null;
}


function stopScanner(){

  if(scanTimer){

    clearInterval(
      scanTimer
    );

    scanTimer = null;
  }
}


window.addEventListener(
  'beforeunload',
  function(){

    stopScanner();
    stopCamera();
  }
);

</script>

</body>

</html>
