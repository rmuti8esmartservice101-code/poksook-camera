<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#102a34"
>

<title>
  พกสุข Camera
</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

:root{
  --primary:#1c8190;
  --green:#16a575;
  --bg:#102a34;
  --panel:#163b47;
  --text:#fff;
  --muted:#bdd2d9;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  color:var(--text);
  background:
    linear-gradient(
      180deg,
      #102a34,
      #0d222b
    );
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Thai",
    Tahoma,
    sans-serif;
}

main{
  width:min(720px,100%);
  margin:auto;
  padding:
    18px
    15px
    calc(
      20px
      +
      env(safe-area-inset-bottom)
    );
}

.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-size:23px;
  font-weight:900;
}

.logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  color:white;
  border-radius:14px;
  background:
    linear-gradient(
      135deg,
      #1d7184,
      #1bb39d
    );
}

.subtitle{
  margin-top:8px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.card{
  margin-top:16px;
  padding:14px;
  border:1px solid
    rgba(255,255,255,.08);
  border-radius:22px;
  background:
    rgba(22,59,71,.92);
  box-shadow:
    0 15px 35px
    rgba(0,0,0,.18);
}

.btn{
  width:100%;
  min-height:56px;
  margin-top:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:0;
  border-radius:16px;
  font-size:17px;
  font-weight:900;
}

.primary{
  color:white;
  background:var(--primary);
}

.success{
  color:white;
  background:var(--green);
}

.secondary{
  color:#18323c;
  background:#e6f0f3;
}

.hidden{
  display:none!important;
}

#reader{
  min-height:350px;
  overflow:hidden;
  background:#07171d;
  border-radius:18px;
}

.status{
  margin-top:10px;
  padding:11px;
  text-align:center;
  color:var(--muted);
  background:
    rgba(255,255,255,.05);
  border-radius:13px;
}

.camera{
  position:relative;
  width:100%;
  max-height:70vh;
  overflow:hidden;
  aspect-ratio:3/4;
  background:black;
  border-radius:20px;
}

.camera video,
.camera img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.guide{
  position:absolute;
  left:50%;
  top:50%;
  width:61%;
  height:66%;
  transform:
    translate(-50%,-50%);
  border:
    3px solid
    rgba(255,255,255,.75);
  border-radius:42%;
  box-shadow:
    0 0 0 999px
    rgba(0,0,0,.1);
  pointer-events:none;
}

svg{
  display:block;
}

</style>

</head>


<body>

<main>


<div class="brand">

  <div class="logo">

    <svg
      width="23"
      height="23"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
    </svg>

  </div>

  พกสุข Camera

</div>


<div
  id="subtitle"
  class="subtitle"
></div>


<section
  id="scannerPage"
  class="card hidden"
>

  <div id="reader"></div>

  <div
    id="scanStatus"
    class="status"
  >
    กำลังเตรียมกล้อง...
  </div>

  <button
    class="btn primary"
    onclick="startScanner()"
  >
    เปิดกล้องสแกน QR
  </button>

  <button
    class="btn secondary"
    onclick="closeCameraPage()"
  >
    ปิด
  </button>

</section>


<section
  id="photoPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

    <img
      id="photoPreview"
      class="hidden"
    >

    <div class="guide"></div>

  </div>


  <button
    id="captureButton"
    class="btn primary"
    onclick="capturePhoto()"
  >
    ถ่ายภาพ
  </button>

  <button
    id="useButton"
    class="btn success hidden"
    onclick="sendPhoto()"
  >
    ใช้ภาพนี้
  </button>

  <button
    id="retakeButton"
    class="btn secondary hidden"
    onclick="retakePhoto()"
  >
    ถ่ายใหม่
  </button>

  <button
    class="btn secondary"
    onclick="closeCameraPage()"
  >
    ปิด
  </button>

</section>


</main>


<script>

const params =
  new URLSearchParams(
    location.search
  );


const MODE =
  params.get('mode')
  || 'scan';


const FACING =
  params.get('facing')
  || 'environment';


const SESSION =
  params.get('session')
  || '';


const RAW_PARENT_ORIGIN =
  params.get('parentOrigin')
  || '';


let PARENT_ORIGIN =
  '';


let scanner =
  null;


let stream =
  null;


let capturedPhoto =
  '';


try{

  const parsed =
    new URL(
      RAW_PARENT_ORIGIN
    );


  if (
    parsed.protocol
    === 'https:'
  ){

    PARENT_ORIGIN =
      parsed.origin;

  }

}catch(_){}


window.addEventListener(
  'load',
  init
);


async function init(){

  if (!SESSION){

    alert(
      'กรุณาเปิดหน้ากล้องจากระบบพกสุข'
    );

    return;

  }


  if (!PARENT_ORIGIN){

    alert(
      'ไม่พบ Parent Origin'
    );

    return;

  }


  if (
    MODE === 'photo'
  ){

    document
      .getElementById(
        'photoPage'
      )
      .classList.remove(
        'hidden'
      );


    document
      .getElementById(
        'subtitle'
      )
      .textContent =
      'ถ่ายภาพยืนยันสมาชิก';


    await startPhotoCamera();

    return;

  }


  document
    .getElementById(
      'scannerPage'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'subtitle'
    )
    .textContent =
    'สแกน QR ประจำตัวสมาชิก';


  await startScanner();

}


function postBack(
  type,
  payload
){

  if (!window.opener){

    alert(
      'ไม่พบหน้าระบบพกสุข'
    );

    return;

  }


  window.opener.postMessage(

    Object.assign(
      {

        source:
          'POKSOOK_GITHUB_CAMERA',

        session:
          SESSION,

        type:
          type

      },
      payload
    ),

    PARENT_ORIGIN

  );

}


/* ==================================================
 QR SCANNER WITH FALLBACK
================================================== */

async function clearScanner(){

  if (!scanner){

    return;

  }


  try{

    if (
      scanner.isScanning
    ){

      await scanner.stop();

    }

  }catch(_){}


  try{

    await scanner.clear();

  }catch(_){}


  scanner =
    null;

}


async function startScanner(){

  const status =
    document.getElementById(
      'scanStatus'
    );


  status.textContent =
    'กำลังเปิดกล้อง...';


  await clearScanner();


  scanner =
    new Html5Qrcode(
      'reader'
    );


  const config = {

    fps:
      10,

    qrbox:{
      width:270,
      height:270
    }

  };


  const onSuccess =
    async decodedText => {

      status.textContent =
        'อ่าน QR สำเร็จ';


      try{

        await scanner.stop();

      }catch(_){}


      postBack(
        'QR_RESULT',
        {
          value:
            decodedText
        }
      );


      setTimeout(
        () =>
          window.close(),
        250
      );

    };


  try{

    /*
      วิธีหลัก:
      ขอใช้กล้องหลัง
    */
    await scanner.start(

      {
        facingMode:
          'environment'
      },

      config,

      onSuccess,

      () => {}

    );


    status.textContent =
      'นำ QR เข้าในกรอบ';


  }catch(firstError){

    console.warn(
      firstError
    );


    /*
      Fallback:
      อ่านรายชื่อกล้อง
    */
    try{

      await clearScanner();


      const cameras =
        await Html5Qrcode
          .getCameras();


      if (
        !cameras
        ||
        !cameras.length
      ){

        throw new Error(
          'ไม่พบกล้องในอุปกรณ์'
        );

      }


      let selected =
        cameras[
          cameras.length - 1
        ];


      const rear =
        cameras.find(camera =>
          /back|rear|environment/i
            .test(
              camera.label
              || ''
            )
        );


      if (rear){

        selected =
          rear;

      }


      scanner =
        new Html5Qrcode(
          'reader'
        );


      await scanner.start(

        selected.id,

        config,

        onSuccess,

        () => {}

      );


      status.textContent =
        'นำ QR เข้าในกรอบ';


    }catch(error){

      console.error(
        error
      );


      status.textContent =
        'เปิดกล้องไม่สำเร็จ';


      alert(
        'เปิดกล้องไม่ได้\n\n'
        +
        (
          error.message
          ||
          error
        )
        +
        '\n\nกรุณาตรวจสอบสิทธิ์ Camera ของ Browser'
      );

    }

  }

}


/* ==================================================
 PHOTO
================================================== */

async function startPhotoCamera(){

  await stopPhotoCamera();


  try{

    if (
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices
        .getUserMedia
    ){

      throw new Error(
        'Browser นี้ไม่รองรับ Camera API'
      );

    }


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            facingMode:{
              ideal:FACING
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          }

        });


    const video =
      document.getElementById(
        'video'
      );


    video.srcObject =
      stream;


    video.classList.remove(
      'hidden'
    );


    document
      .getElementById(
        'photoPreview'
      )
      .classList.add(
        'hidden'
      );


    await video.play();


  }catch(error){

    alert(
      'เปิดกล้องไม่ได้\n\n'
      +
      (
        error.message
        ||
        error
      )
      +
      '\n\nกรุณาอนุญาต Camera'
    );

  }

}


async function stopPhotoCamera(){

  if (stream){

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    stream =
      null;

  }


  const video =
    document.getElementById(
      'video'
    );


  if (video){

    video.srcObject =
      null;

  }

}


/*
  Check-in photo:
  max 560px
  quality .32
*/
async function capturePhoto(){

  const video =
    document.getElementById(
      'video'
    );


  if (
    !video
    ||
    !video.videoWidth
  ){

    alert(
      'กล้องยังไม่พร้อม'
    );

    return;

  }


  const MAX_SIDE =
    560;


  const QUALITY =
    .32;


  const scale =
    Math.min(
      1,
      MAX_SIDE /
      Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        video.videoWidth
        *
        scale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        video.videoHeight
        *
        scale
      )
    );


  canvas
    .getContext(
      '2d',
      {
        alpha:false
      }
    )
    .drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


  capturedPhoto =
    canvas.toDataURL(
      'image/webp',
      QUALITY
    );


  if (
    !capturedPhoto.startsWith(
      'data:image/webp'
    )
  ){

    capturedPhoto =
      canvas.toDataURL(
        'image/jpeg',
        QUALITY
      );

  }


  await stopPhotoCamera();


  const preview =
    document.getElementById(
      'photoPreview'
    );


  preview.src =
    capturedPhoto;


  preview.classList.remove(
    'hidden'
  );


  video.classList.add(
    'hidden'
  );


  document
    .getElementById(
      'captureButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'useButton'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'retakeButton'
    )
    .classList.remove(
      'hidden'
    );

}


async function retakePhoto(){

  capturedPhoto =
    '';


  document
    .getElementById(
      'useButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'retakeButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'captureButton'
    )
    .classList.remove(
      'hidden'
    );


  await startPhotoCamera();

}


function sendPhoto(){

  if (!capturedPhoto){

    alert(
      'ยังไม่ได้ถ่ายภาพ'
    );

    return;

  }


  postBack(
    'PHOTO_RESULT',
    {
      dataUrl:
        capturedPhoto
    }
  );


  setTimeout(
    () =>
      window.close(),
    250
  );

}


async function closeCameraPage(){

  await clearScanner();

  await stopPhotoCamera();

  window.close();

}


window.addEventListener(
  'pagehide',
  () => {

    stopPhotoCamera();

  }
);

</script>

</body>
</html>
