<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#102a34"
>

<title>พกสุข Camera</title>

<!-- QR decoder -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>

:root{
  --primary:#188596;
  --primary2:#19b59e;
  --success:#15a875;
  --danger:#e25d64;
  --bg:#0b2028;
  --panel:#123945;
  --panel2:#194a58;
  --text:#ffffff;
  --muted:#bfd2d8;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:
    linear-gradient(
      180deg,
      #102d37,
      #091c23
    );
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Thai",
    Tahoma,
    sans-serif;
}

body{
  min-height:100vh;
}

.hidden{
  display:none!important;
}

main{
  width:min(720px,100%);
  margin:auto;
  padding:
    18px
    15px
    calc(
      20px
      +
      env(safe-area-inset-bottom)
    );
}

.brand{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:5px;
  font-size:25px;
  font-weight:900;
}

.logo{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:16px;
  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );
}

.subtitle{
  margin-top:10px;
  text-align:center;
  color:var(--muted);
  font-size:15px;
}

.card{
  margin-top:18px;
  padding:15px;
  background:
    rgba(18,57,69,.96);
  border:1px solid
    rgba(255,255,255,.09);
  border-radius:25px;
  box-shadow:
    0 18px 45px
    rgba(0,0,0,.22);
}

.scanner-box{
  position:relative;
  overflow:hidden;
  width:100%;
  background:#000;
  border-radius:22px;
  aspect-ratio:3/4;
}

.scanner-box video{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.scan-overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.scan-frame{
  position:absolute;
  left:50%;
  top:50%;
  width:78%;
  aspect-ratio:1/1;
  transform:
    translate(-50%,-50%);
}

.corner{
  position:absolute;
  width:58px;
  height:58px;
}

.corner.tl{
  left:0;
  top:0;
  border-left:6px solid white;
  border-top:6px solid white;
}

.corner.tr{
  right:0;
  top:0;
  border-right:6px solid white;
  border-top:6px solid white;
}

.corner.bl{
  left:0;
  bottom:0;
  border-left:6px solid white;
  border-bottom:6px solid white;
}

.corner.br{
  right:0;
  bottom:0;
  border-right:6px solid white;
  border-bottom:6px solid white;
}

.scan-line{
  position:absolute;
  left:6%;
  right:6%;
  top:50%;
  height:2px;
  background:
    linear-gradient(
      90deg,
      transparent,
      #6fffe0,
      transparent
    );
  box-shadow:
    0 0 13px
    rgba(111,255,224,.9);
  animation:
    scan 2s ease-in-out infinite;
}

@keyframes scan{

  0%{
    transform:
      translateY(-115px);
  }

  50%{
    transform:
      translateY(115px);
  }

  100%{
    transform:
      translateY(-115px);
  }

}

.status{
  margin-top:12px;
  padding:13px;
  text-align:center;
  color:var(--muted);
  background:
    rgba(255,255,255,.06);
  border-radius:15px;
}

.status.success{
  color:#dffff4;
  background:
    rgba(21,168,117,.22);
}

.status.error{
  color:#ffd8db;
  background:
    rgba(226,93,100,.2);
}

.tip{
  margin:11px 5px 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  text-align:center;
}

.btn{
  width:100%;
  min-height:58px;
  margin-top:10px;
  border:0;
  border-radius:17px;
  font:inherit;
  font-size:18px;
  font-weight:900;
}

.primary{
  color:white;
  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );
}

.success{
  color:white;
  background:var(--success);
}

.secondary{
  color:#17313c;
  background:#e8f1f3;
}


/* PHOTO */

.photo-camera{
  position:relative;
  width:100%;
  overflow:hidden;
  aspect-ratio:3/4;
  background:#000;
  border-radius:22px;
}

.photo-camera video,
.photo-camera img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.face-guide{
  position:absolute;
  left:50%;
  top:50%;
  width:62%;
  height:68%;
  transform:
    translate(-50%,-50%);
  border:
    3px solid
    rgba(255,255,255,.85);
  border-radius:44%;
  pointer-events:none;
}


/* DEBUG */

.debug{
  margin-top:8px;
  color:#94b7c1;
  font-size:11px;
  text-align:center;
}

canvas{
  display:none;
}

</style>

</head>


<body>

<main>


<div class="brand">

  <div class="logo">

    <svg
      width="26"
      height="26"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
    </svg>

  </div>

  พกสุข Camera

</div>


<div
  id="subtitle"
  class="subtitle"
></div>


<!-- ========================================
     QR SCANNER
======================================== -->

<section
  id="scannerPage"
  class="card hidden"
>

  <div class="scanner-box">

    <video
      id="scanVideo"
      autoplay
      muted
      playsinline
    ></video>


    <div class="scan-overlay">

      <div class="scan-frame">

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="scan-line"></div>

      </div>

    </div>

  </div>


  <canvas id="scanCanvas"></canvas>


  <div
    id="scanStatus"
    class="status"
  >
    กำลังเตรียมกล้อง...
  </div>


  <div class="tip">
    ให้ QR อยู่กลางกรอบ • ถือโทรศัพท์ให้นิ่ง •
    หากสแกนจากหน้าจออื่นให้เพิ่มความสว่างของหน้าจอ
  </div>


  <button
    class="btn primary"
    onclick="restartScanner()"
  >
    เปิดกล้อง / สแกนใหม่
  </button>


  <button
    class="btn secondary"
    onclick="closeCameraPage()"
  >
    ปิด
  </button>


  <div
    id="debugInfo"
    class="debug"
  ></div>

</section>



<!-- ========================================
     PHOTO
======================================== -->

<section
  id="photoPage"
  class="card hidden"
>

  <div class="photo-camera">

    <video
      id="photoVideo"
      autoplay
      muted
      playsinline
    ></video>

    <img
      id="photoPreview"
      class="hidden"
    >

    <div class="face-guide"></div>

  </div>


  <button
    id="captureButton"
    class="btn primary"
    onclick="capturePhoto()"
  >
    ถ่ายภาพ
  </button>


  <button
    id="useButton"
    class="btn success hidden"
    onclick="sendPhoto()"
  >
    ใช้ภาพนี้
  </button>


  <button
    id="retakeButton"
    class="btn secondary hidden"
    onclick="retakePhoto()"
  >
    ถ่ายใหม่
  </button>


  <button
    class="btn secondary"
    onclick="closeCameraPage()"
  >
    ปิด
  </button>

</section>


</main>


<script>

/* ======================================================
 PARAMETER
====================================================== */

const params =
  new URLSearchParams(
    location.search
  );


const MODE =
  params.get('mode')
  || 'scan';


const FACING =
  params.get('facing')
  || 'environment';


const SESSION =
  params.get('session')
  || '';


const RAW_PARENT_ORIGIN =
  params.get('parentOrigin')
  || '';


let PARENT_ORIGIN =
  '';


try{

  const parsed =
    new URL(
      RAW_PARENT_ORIGIN
    );


  if (
    parsed.protocol
    === 'https:'
  ){

    PARENT_ORIGIN =
      parsed.origin;

  }

}catch(_){}


/* ======================================================
 STATE
====================================================== */

let scanStream =
  null;


let photoStream =
  null;


let capturedPhoto =
  '';


let scanning =
  false;


let scanLoopId =
  null;


let qrFound =
  false;


let lastScanAt =
  0;


/* ======================================================
 INIT
====================================================== */

window.addEventListener(
  'load',
  init
);


async function init(){

  if (!SESSION){

    alert(
      'ไม่พบ Camera Session กรุณาเปิดกล้องจากระบบพกสุข'
    );

    return;

  }


  if (!PARENT_ORIGIN){

    alert(
      'ไม่พบ Parent Origin'
    );

    return;

  }


  if (
    typeof jsQR
    !== 'function'
  ){

    alert(
      'โหลดระบบอ่าน QR ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วเปิดใหม่'
    );

    return;

  }


  if (
    MODE === 'photo'
  ){

    document
      .getElementById(
        'photoPage'
      )
      .classList.remove(
        'hidden'
      );


    document
      .getElementById(
        'subtitle'
      )
      .textContent =
      'ถ่ายภาพยืนยันสมาชิก';


    await startPhotoCamera();

    return;

  }


  document
    .getElementById(
      'scannerPage'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'subtitle'
    )
    .textContent =
    'สแกน QR ประจำตัวสมาชิก';


  await startScanner();

}


/* ======================================================
 POST MESSAGE
====================================================== */

function postBack(
  type,
  payload
){

  if (!window.opener){

    throw new Error(
      'ไม่พบหน้าระบบพกสุขต้นทาง'
    );

  }


  if (!PARENT_ORIGIN){

    throw new Error(
      'ไม่พบ Parent Origin'
    );

  }


  window.opener.postMessage(

    Object.assign(
      {

        source:
          'POKSOOK_GITHUB_CAMERA',

        session:
          SESSION,

        type:
          type

      },

      payload || {}

    ),

    PARENT_ORIGIN

  );

}


/* ======================================================
 QR CAMERA
====================================================== */

async function startScanner(){

  await stopScanner();


  const status =
    document.getElementById(
      'scanStatus'
    );


  const video =
    document.getElementById(
      'scanVideo'
    );


  status.className =
    'status';


  status.textContent =
    'กำลังเปิดกล้องหลัง...';


  qrFound =
    false;


  try{

    if (
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        'Browser นี้ไม่รองรับ Camera API'
      );

    }


    /*
      ใช้ browser camera API ตรง
      ไม่ผ่าน html5-qrcode
    */
    scanStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            facingMode:
              {
                ideal:
                  'environment'
              },

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            },

            frameRate:{
              ideal:30,
              max:30
            }

          }

        });


    video.srcObject =
      scanStream;


    await video.play();


    await waitForVideo(
      video
    );


    scanning =
      true;


    status.textContent =
      'นำ QR เข้าในกรอบ';


    document
      .getElementById(
        'debugInfo'
      )
      .textContent =
      'Scanner ready • '
      +
      video.videoWidth
      +
      ' × '
      +
      video.videoHeight;


    scanLoop();


  }catch(error){

    console.error(
      error
    );


    status.className =
      'status error';


    status.textContent =
      'เปิดกล้องไม่สำเร็จ';


    alert(
      'เปิดกล้องไม่ได้\n\n'
      +
      (
        error.message
        ||
        error
      )
      +
      '\n\nกรุณาอนุญาต Camera ใน Browser'
    );

  }

}


function waitForVideo(video){

  return new Promise(
    resolve => {

      if (
        video.readyState >= 2
        &&
        video.videoWidth > 0
      ){

        resolve();

        return;

      }


      const check =
        () => {

          if (
            video.videoWidth > 0
            &&
            video.videoHeight > 0
          ){

            resolve();

            return;

          }


          requestAnimationFrame(
            check
          );

        };


      check();

    }
  );

}


/* ======================================================
 QR SCAN LOOP
====================================================== */

function scanLoop(timestamp=0){

  if (
    !scanning
    ||
    qrFound
  ){

    return;

  }


  scanLoopId =
    requestAnimationFrame(
      scanLoop
    );


  /*
    อ่านประมาณ 8 ครั้ง / วินาที
  */
  if (
    timestamp - lastScanAt
    <
    120
  ){

    return;

  }


  lastScanAt =
    timestamp;


  const video =
    document.getElementById(
      'scanVideo'
    );


  if (
    !video
    ||
    video.readyState < 2
    ||
    !video.videoWidth
  ){

    return;

  }


  try{

    decodeVideoFrame(
      video
    );

  }catch(error){

    console.warn(
      'decode:',
      error
    );

  }

}


/* ======================================================
 DECODE FRAME
====================================================== */

function decodeVideoFrame(
  video
){

  const canvas =
    document.getElementById(
      'scanCanvas'
    );


  const context =
    canvas.getContext(
      '2d',
      {
        willReadFrequently:true
      }
    );


  /*
    จำกัดขนาดภาพสำหรับ performance
  */
  const MAX_WIDTH =
    900;


  const ratio =
    Math.min(
      1,
      MAX_WIDTH /
      video.videoWidth
    );


  const width =
    Math.max(
      1,
      Math.round(
        video.videoWidth
        *
        ratio
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        video.videoHeight
        *
        ratio
      )
    );


  canvas.width =
    width;


  canvas.height =
    height;


  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  /*
    รอบแรก:
    อ่านทั้งภาพ
  */
  const image =
    context.getImageData(
      0,
      0,
      width,
      height
    );


  let result =
    jsQR(
      image.data,
      width,
      height,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );


  if (
    result &&
    result.data
  ){

    handleQrFound(
      result.data
    );

    return;

  }


  /*
    รอบสอง:
    crop กลางภาพ
    ช่วยกรณี QR อยู่กลางกรอบ
  */
  const cropSize =
    Math.floor(
      Math.min(
        width,
        height
      )
      *
      .82
    );


  const sx =
    Math.max(
      0,
      Math.floor(
        (
          width
          -
          cropSize
        )
        /
        2
      )
    );


  const sy =
    Math.max(
      0,
      Math.floor(
        (
          height
          -
          cropSize
        )
        /
        2
      )
    );


  const crop =
    context.getImageData(
      sx,
      sy,
      cropSize,
      cropSize
    );


  result =
    jsQR(
      crop.data,
      cropSize,
      cropSize,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );


  if (
    result &&
    result.data
  ){

    handleQrFound(
      result.data
    );

  }

}


/* ======================================================
 QR FOUND
====================================================== */

async function handleQrFound(
  value
){

  if (
    qrFound
  ){

    return;

  }


  value =
    String(
      value || ''
    )
    .trim();


  if (!value){

    return;

  }


  qrFound =
    true;


  scanning =
    false;


  const status =
    document.getElementById(
      'scanStatus'
    );


  status.className =
    'status success';


  status.textContent =
    'อ่าน QR สำเร็จ กำลังเปิดข้อมูลสมาชิก...';


  if (
    navigator.vibrate
  ){

    navigator.vibrate(
      120
    );

  }


  try{

    /*
      ส่งกลับ Apps Script
    */
    postBack(
      'QR_RESULT',
      {
        value:
          value
      }
    );


  }catch(error){

    qrFound =
      false;


    scanning =
      true;


    status.className =
      'status error';


    status.textContent =
      'อ่าน QR ได้ แต่ส่งกลับระบบไม่สำเร็จ';


    alert(
      'อ่าน QR สำเร็จแล้ว แต่ส่งข้อมูลกลับระบบพกสุขไม่ได้\n\n'
      +
      (
        error.message
        ||
        error
      )
    );


    scanLoop();

    return;

  }


  /*
    ปิดกล้อง
  */
  await stopScanner();


  /*
    ให้ postMessage มีเวลาส่งก่อน window.close()
  */
  setTimeout(
    () => {

      try{

        window.close();

      }catch(_){}

    },
    1100
  );

}


/* ======================================================
 STOP / RESTART SCANNER
====================================================== */

async function stopScanner(){

  scanning =
    false;


  if (
    scanLoopId
  ){

    cancelAnimationFrame(
      scanLoopId
    );


    scanLoopId =
      null;

  }


  if (
    scanStream
  ){

    scanStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    scanStream =
      null;

  }


  const video =
    document.getElementById(
      'scanVideo'
    );


  if (video){

    video.srcObject =
      null;

  }

}


async function restartScanner(){

  qrFound =
    false;


  await startScanner();

}


/* ======================================================
 PHOTO CAMERA
====================================================== */

async function startPhotoCamera(){

  await stopPhotoCamera();


  try{

    if (
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices
        .getUserMedia
    ){

      throw new Error(
        'Browser นี้ไม่รองรับ Camera API'
      );

    }


    photoStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            facingMode:{
              ideal:FACING
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            },

            frameRate:{
              ideal:24,
              max:30
            }

          }

        });


    const video =
      document.getElementById(
        'photoVideo'
      );


    video.srcObject =
      photoStream;


    video.classList.remove(
      'hidden'
    );


    document
      .getElementById(
        'photoPreview'
      )
      .classList
      .add(
        'hidden'
      );


    await video.play();


  }catch(error){

    console.error(
      error
    );


    alert(
      'เปิดกล้องไม่ได้\n\n'
      +
      (
        error.message
        ||
        error
      )
      +
      '\n\nกรุณาอนุญาต Camera ใน Browser'
    );

  }

}


/* ======================================================
 STOP PHOTO
====================================================== */

async function stopPhotoCamera(){

  if (
    photoStream
  ){

    photoStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    photoStream =
      null;

  }


  const video =
    document.getElementById(
      'photoVideo'
    );


  if (video){

    video.srcObject =
      null;

  }

}


/* ======================================================
 CAPTURE PHOTO
====================================================== */

async function capturePhoto(){

  const video =
    document.getElementById(
      'photoVideo'
    );


  if (
    !video
    ||
    !video.videoWidth
  ){

    alert(
      'กล้องยังไม่พร้อม กรุณารอสักครู่'
    );

    return;

  }


  const MAX_SIDE =
    560;


  const QUALITY =
    .32;


  const scale =
    Math.min(
      1,
      MAX_SIDE /
      Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        video.videoWidth
        *
        scale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        video.videoHeight
        *
        scale
      )
    );


  const context =
    canvas.getContext(
      '2d',
      {
        alpha:false
      }
    );


  context.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  capturedPhoto =
    canvas.toDataURL(
      'image/webp',
      QUALITY
    );


  if (
    !capturedPhoto.startsWith(
      'data:image/webp'
    )
  ){

    capturedPhoto =
      canvas.toDataURL(
        'image/jpeg',
        QUALITY
      );

  }


  await stopPhotoCamera();


  const preview =
    document.getElementById(
      'photoPreview'
    );


  preview.src =
    capturedPhoto;


  preview.classList.remove(
    'hidden'
  );


  video.classList.add(
    'hidden'
  );


  document
    .getElementById(
      'captureButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'useButton'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'retakeButton'
    )
    .classList.remove(
      'hidden'
    );

}


/* ======================================================
 RETAKE PHOTO
====================================================== */

async function retakePhoto(){

  capturedPhoto =
    '';


  document
    .getElementById(
      'useButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'retakeButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'captureButton'
    )
    .classList.remove(
      'hidden'
    );


  await startPhotoCamera();

}


/* ======================================================
 SEND PHOTO
====================================================== */

function sendPhoto(){

  if (
    !capturedPhoto
  ){

    alert(
      'ยังไม่ได้ถ่ายภาพ'
    );

    return;

  }


  try{

    postBack(
      'PHOTO_RESULT',
      {
        dataUrl:
          capturedPhoto
      }
    );


  }catch(error){

    alert(
      'ส่งภาพกลับระบบไม่สำเร็จ\n\n'
      +
      (
        error.message
        ||
        error
      )
    );

    return;

  }


  setTimeout(
    () => {

      try{

        window.close();

      }catch(_){}

    },
    900
  );

}


/* ======================================================
 CLOSE
====================================================== */

async function closeCameraPage(){

  await stopScanner();

  await stopPhotoCamera();


  try{

    window.close();

  }catch(_){}

}


/* ======================================================
 CLEANUP
====================================================== */

window.addEventListener(
  'pagehide',
  () => {

    stopScanner();

    stopPhotoCamera();

  }
);

</script>
