<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#102a34"
>

<title>
  พกสุข Camera
</title>


<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


<style>

:root{
  --primary:#1c8190;
  --primary2:#1bb39d;
  --green:#16a575;
  --bg:#0d222b;
  --panel:#163b47;
  --panel2:#1d4a58;
  --text:#ffffff;
  --muted:#bdd2d9;
  --line:rgba(255,255,255,.1);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:
    linear-gradient(
      180deg,
      #102a34 0%,
      #0b1c23 100%
    );
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Thai",
    Tahoma,
    sans-serif;
}

body{
  min-height:100vh;
}

button{
  font:inherit;
  cursor:pointer;
}

main{
  width:min(720px,100%);
  margin:auto;
  padding:
    18px
    15px
    calc(
      22px
      +
      env(safe-area-inset-bottom)
    );
}

.hidden{
  display:none!important;
}

.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:6px;
  font-size:25px;
  font-weight:900;
}

.logo{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );
  box-shadow:
    0 10px 25px
    rgba(0,0,0,.2);
}

.subtitle{
  margin:10px 0 0;
  text-align:center;
  color:var(--muted);
  font-size:15px;
}

.card{
  margin-top:18px;
  padding:15px;
  background:
    rgba(22,59,71,.95);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:
    0 18px 45px
    rgba(0,0,0,.22);
}

.btn{
  width:100%;
  min-height:58px;
  margin-top:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  border:0;
  border-radius:17px;
  font-size:18px;
  font-weight:900;
}

.primary{
  color:white;
  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );
}

.success{
  color:white;
  background:var(--green);
}

.secondary{
  color:#18323c;
  background:#e7f0f3;
}

.status{
  margin-top:12px;
  padding:12px;
  text-align:center;
  color:var(--muted);
  background:
    rgba(255,255,255,.06);
  border-radius:14px;
}

.status.success{
  color:#dffbf2;
  background:
    rgba(22,165,117,.18);
}

.status.error{
  color:#ffd9dc;
  background:
    rgba(227,93,101,.18);
}

#reader{
  width:100%;
  min-height:360px;
  overflow:hidden;
  background:#07171d;
  border-radius:20px;
}

#reader video{
  object-fit:cover!important;
}

.camera{
  position:relative;
  width:100%;
  max-height:70vh;
  overflow:hidden;
  aspect-ratio:3/4;
  background:black;
  border-radius:20px;
}

.camera video,
.camera img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.guide{
  position:absolute;
  left:50%;
  top:50%;
  width:62%;
  height:68%;
  transform:
    translate(-50%,-50%);
  border:
    3px solid
    rgba(255,255,255,.85);
  border-radius:44%;
  box-shadow:
    0 0 0 999px
    rgba(0,0,0,.08);
  pointer-events:none;
}

.tip{
  margin-top:11px;
  color:var(--muted);
  text-align:center;
  font-size:13px;
}

svg{
  display:block;
}

</style>

</head>


<body>

<main>


<div class="brand">

  <div class="logo">

    <svg
      width="25"
      height="25"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
    </svg>

  </div>

  พกสุข Camera

</div>


<div
  id="subtitle"
  class="subtitle"
></div>


<section
  id="scannerPage"
  class="card hidden"
>

  <div id="reader"></div>

  <div
    id="scanStatus"
    class="status"
  >
    กำลังเตรียมกล้อง...
  </div>

  <div class="tip">
    นำ QR ให้อยู่กลางภาพและถือให้นิ่งสักครู่
  </div>

  <button
    class="btn primary"
    onclick="startScanner()"
  >
    เปิดกล้องสแกน QR
  </button>

  <button
    class="btn secondary"
    onclick="closeCameraPage()"
  >
    ปิด
  </button>

</section>


<section
  id="photoPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

    <img
      id="photoPreview"
      class="hidden"
    >

    <div class="guide"></div>

  </div>


  <button
    id="captureButton"
    class="btn primary"
    onclick="capturePhoto()"
  >
    ถ่ายภาพ
  </button>

  <button
    id="useButton"
    class="btn success hidden"
    onclick="sendPhoto()"
  >
    ใช้ภาพนี้
  </button>

  <button
    id="retakeButton"
    class="btn secondary hidden"
    onclick="retakePhoto()"
  >
    ถ่ายใหม่
  </button>

  <button
    class="btn secondary"
    onclick="closeCameraPage()"
  >
    ปิด
  </button>

</section>


</main>


<script>

/* ======================================================
 PARAMETERS
====================================================== */

const params =
  new URLSearchParams(
    location.search
  );


const MODE =
  params.get('mode')
  || 'scan';


const FACING =
  params.get('facing')
  || 'environment';


const SESSION =
  params.get('session')
  || '';


const RAW_PARENT_ORIGIN =
  params.get('parentOrigin')
  || '';


let PARENT_ORIGIN =
  '';


let scanner =
  null;


let stream =
  null;


let capturedPhoto =
  '';


let QR_LOCK =
  false;


try{

  const parsed =
    new URL(
      RAW_PARENT_ORIGIN
    );


  if (
    parsed.protocol
    === 'https:'
  ){

    PARENT_ORIGIN =
      parsed.origin;

  }

}catch(_){}


/* ======================================================
 INIT
====================================================== */

window.addEventListener(
  'load',
  init
);


async function init(){

  if (!SESSION){

    alert(
      'ไม่พบ Camera Session กรุณาเปิดกล้องจากระบบพกสุข'
    );

    return;

  }


  if (!PARENT_ORIGIN){

    alert(
      'ไม่พบ Parent Origin'
    );

    return;

  }


  if (
    MODE === 'photo'
  ){

    document
      .getElementById(
        'photoPage'
      )
      .classList
      .remove(
        'hidden'
      );


    document
      .getElementById(
        'subtitle'
      )
      .textContent =
      'ถ่ายภาพยืนยันสมาชิก';


    await startPhotoCamera();

    return;

  }


  document
    .getElementById(
      'scannerPage'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'subtitle'
    )
    .textContent =
    'สแกน QR ประจำตัวสมาชิก';


  await startScanner();

}


/* ======================================================
 POST BACK
====================================================== */

function postBack(
  type,
  payload
){

  if (!PARENT_ORIGIN){

    throw new Error(
      'ไม่พบ Parent Origin'
    );

  }


  if (!window.opener){

    throw new Error(
      'ไม่พบหน้าระบบพกสุขต้นทาง'
    );

  }


  const message =
    Object.assign(
      {

        source:
          'POKSOOK_GITHUB_CAMERA',

        session:
          SESSION,

        type:
          type

      },
      payload || {}
    );


  console.log(
    'POST TO PARENT:',
    message,
    PARENT_ORIGIN
  );


  window.opener.postMessage(
    message,
    PARENT_ORIGIN
  );

}


/* ======================================================
 SCANNER CLEANUP
====================================================== */

async function clearScanner(){

  if (!scanner){

    return;

  }


  try{

    if (
      scanner.isScanning
    ){

      await scanner.stop();

    }

  }catch(error){

    console.warn(
      'scanner stop:',
      error
    );

  }


  try{

    await scanner.clear();

  }catch(error){

    console.warn(
      'scanner clear:',
      error
    );

  }


  scanner =
    null;

}


/* ======================================================
 QR SUCCESS HANDLER
====================================================== */

async function handleQrSuccess(
  decodedText
){

  if (QR_LOCK){

    return;

  }


  const value =
    String(
      decodedText || ''
    ).trim();


  if (!value){

    return;

  }


  QR_LOCK =
    true;


  const status =
    document.getElementById(
      'scanStatus'
    );


  status.textContent =
    'อ่าน QR สำเร็จ กำลังเปิดข้อมูลสมาชิก...';


  status.className =
    'status success';


  console.log(
    'QR RESULT:',
    value
  );


  try{

    postBack(
      'QR_RESULT',
      {
        value:
          value
      }
    );

  }catch(error){

    console.error(
      'POST BACK FAILED:',
      error
    );


    QR_LOCK =
      false;


    status.textContent =
      'อ่าน QR ได้ แต่ส่งข้อมูลกลับระบบไม่สำเร็จ';


    status.className =
      'status error';


    alert(
      'อ่าน QR ได้แล้ว แต่ส่งข้อมูลกลับระบบพกสุขไม่สำเร็จ\n\n'
      +
      (
        error.message
        ||
        error
      )
    );


    return;

  }


  try{

    if (
      scanner
      &&
      scanner.isScanning
    ){

      await scanner.stop();

    }

  }catch(error){

    console.warn(
      'STOP AFTER SCAN:',
      error
    );

  }


  /*
    รอให้ postMessage ถูกส่งก่อนปิดหน้า
  */
  setTimeout(
    () => {

      try{

        window.close();

      }catch(_){}

    },
    900
  );

}


/* ======================================================
 QR SCANNER
====================================================== */

async function startScanner(){

  const status =
    document.getElementById(
      'scanStatus'
    );


  QR_LOCK =
    false;


  status.className =
    'status';


  status.textContent =
    'กำลังเปิดกล้อง...';


  await clearScanner();


  const config = {

    fps:
      12,

    /*
      ปรับพื้นที่อ่านตามขนาดจอ
      ช่วย iPhone/iPad อ่าน QR บนหน้าจอได้ดีขึ้น
    */
    qrbox:
      function(
        viewfinderWidth,
        viewfinderHeight
      ){

        const minEdge =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          );


        const size =
          Math.floor(
            minEdge
            *
            0.84
          );


        return {
          width:size,
          height:size
        };

      },

    /*
      ไม่บังคับ ratio แคบเกินไป
    */
    aspectRatio:
      1,

    disableFlip:
      false

  };


  const successCallback =
    async decodedText => {

      await handleQrSuccess(
        decodedText
      );

    };


  const failureCallback =
    () => {

      /*
        ไม่ต้องแสดง error
        เพราะ callback นี้เกิดทุก frame ที่อ่านไม่ได้
      */

    };


  try{

    /*
      iPhone / Android วิธีหลัก
    */
    scanner =
      new Html5Qrcode(
        'reader',
        {

          formatsToSupport:[
            Html5QrcodeSupportedFormats.QR_CODE
          ],

          experimentalFeatures:{
            useBarCodeDetectorIfSupported:false
          },

          verbose:false

        }
      );


    await scanner.start(

      {
        facingMode:
          'environment'
      },

      config,

      successCallback,

      failureCallback

    );


    status.textContent =
      'นำ QR เข้าในกรอบ';


  }catch(firstError){

    console.warn(
      'PRIMARY CAMERA FAILED:',
      firstError
    );


    /*
      fallback สำหรับบาง iPhone / iPad
    */
    try{

      await clearScanner();


      status.textContent =
        'กำลังเลือกกล้องหลัง...';


      const cameras =
        await Html5Qrcode
          .getCameras();


      if (
        !cameras
        ||
        !cameras.length
      ){

        throw new Error(
          'ไม่พบกล้องในอุปกรณ์'
        );

      }


      console.log(
        'CAMERAS:',
        cameras
      );


      let selected =
        cameras.find(
          camera => {

            const label =
              String(
                camera.label
                ||
                ''
              )
              .toLowerCase();


            return (
              label.includes('back')
              ||
              label.includes('rear')
              ||
              label.includes('environment')
              ||
              label.includes('wide')
            );

          }
        );


      if (!selected){

        selected =
          cameras[
            cameras.length - 1
          ];

      }


      scanner =
        new Html5Qrcode(
          'reader',
          {

            formatsToSupport:[
              Html5QrcodeSupportedFormats.QR_CODE
            ],

            experimentalFeatures:{
              useBarCodeDetectorIfSupported:false
            },

            verbose:false

          }
        );


      await scanner.start(

        selected.id,

        config,

        successCallback,

        failureCallback

      );


      status.textContent =
        'นำ QR เข้าในกรอบ';


    }catch(error){

      console.error(
        'SCANNER FAILED:',
        error
      );


      status.textContent =
        'เปิดระบบสแกนไม่สำเร็จ';


      status.className =
        'status error';


      alert(
        'ไม่สามารถเปิดระบบสแกน QR ได้\n\n'
        +
        (
          error.message
          ||
          error
        )
        +
        '\n\nกรุณาตรวจสอบสิทธิ์ Camera ของ Browser'
      );

    }

  }

}


/* ======================================================
 PHOTO CAMERA
====================================================== */

async function startPhotoCamera(){

  await stopPhotoCamera();


  try{

    if (
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices
        .getUserMedia
    ){

      throw new Error(
        'Browser นี้ไม่รองรับ Camera API'
      );

    }


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            facingMode:{
              ideal:FACING
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            },

            frameRate:{
              ideal:24,
              max:30
            }

          }

        });


    const video =
      document.getElementById(
        'video'
      );


    video.srcObject =
      stream;


    video.classList.remove(
      'hidden'
    );


    document
      .getElementById(
        'photoPreview'
      )
      .classList
      .add(
        'hidden'
      );


    await video.play();


  }catch(error){

    console.error(
      'PHOTO CAMERA ERROR:',
      error
    );


    alert(
      'เปิดกล้องไม่ได้\n\n'
      +
      (
        error.message
        ||
        error
      )
      +
      '\n\nกรุณาอนุญาต Camera ใน Browser'
    );

  }

}


/* ======================================================
 STOP PHOTO CAMERA
====================================================== */

async function stopPhotoCamera(){

  if (stream){

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    stream =
      null;

  }


  const video =
    document.getElementById(
      'video'
    );


  if (video){

    video.srcObject =
      null;

  }

}


/* ======================================================
 CAPTURE PHOTO
====================================================== */

async function capturePhoto(){

  const video =
    document.getElementById(
      'video'
    );


  if (
    !video
    ||
    !video.videoWidth
  ){

    alert(
      'กล้องยังไม่พร้อม กรุณารอสักครู่'
    );

    return;

  }


  /*
    ลดขนาดรูป Check-in
  */
  const MAX_SIDE =
    560;


  const QUALITY =
    .32;


  const scale =
    Math.min(
      1,
      MAX_SIDE /
      Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        video.videoWidth
        *
        scale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        video.videoHeight
        *
        scale
      )
    );


  const context =
    canvas.getContext(
      '2d',
      {
        alpha:false
      }
    );


  context.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    WebP ก่อน
  */
  capturedPhoto =
    canvas.toDataURL(
      'image/webp',
      QUALITY
    );


  /*
    Safari รุ่นที่ไม่รองรับ WebP encode
  */
  if (
    !capturedPhoto.startsWith(
      'data:image/webp'
    )
  ){

    capturedPhoto =
      canvas.toDataURL(
        'image/jpeg',
        QUALITY
      );

  }


  await stopPhotoCamera();


  const preview =
    document.getElementById(
      'photoPreview'
    );


  preview.src =
    capturedPhoto;


  preview.classList.remove(
    'hidden'
  );


  video.classList.add(
    'hidden'
  );


  document
    .getElementById(
      'captureButton'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'useButton'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'retakeButton'
    )
    .classList
    .remove(
      'hidden'
    );

}


/* ======================================================
 RETAKE
====================================================== */

async function retakePhoto(){

  capturedPhoto =
    '';


  document
    .getElementById(
      'useButton'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'retakeButton'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'captureButton'
    )
    .classList
    .remove(
      'hidden'
    );


  await startPhotoCamera();

}


/* ======================================================
 SEND PHOTO
====================================================== */

function sendPhoto(){

  if (!capturedPhoto){

    alert(
      'ยังไม่ได้ถ่ายภาพ'
    );

    return;

  }


  try{

    postBack(
      'PHOTO_RESULT',
      {
        dataUrl:
          capturedPhoto
      }
    );


  }catch(error){

    alert(
      'ส่งรูปกลับระบบไม่สำเร็จ\n\n'
      +
      (
        error.message
        ||
        error
      )
    );

    return;

  }


  setTimeout(
    () => {

      try{

        window.close();

      }catch(_){}

    },
    800
  );

}


/* ======================================================
 CLOSE
====================================================== */

async function closeCameraPage(){

  await clearScanner();

  await stopPhotoCamera();


  try{

    window.close();

  }catch(_){}

}


/* ======================================================
 PAGE CLEANUP
====================================================== */

window.addEventListener(
  'pagehide',
  () => {

    try{

      stopPhotoCamera();

    }catch(_){}

  }
);

</script>

</body>

</html>
