<!doctype html>

<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta
  name="theme-color"
  content="#087f7b">

<title>พกสุข Camera</title>

<script
  src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
</script>


<style>

:root{
  --primary:#087f7b;
  --mint:#e4f7f4;
  --bg:#f4f8f9;
  --text:#18383d;
  --muted:#718589;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;

  color:var(--text);
  background:var(--bg);
}

main{
  width:min(620px,100%);

  margin:auto;

  padding:
    calc(
      24px +
      env(safe-area-inset-top)
    )
    16px
    28px;

  text-align:center;
}

.logo{
  width:58px;
  height:58px;

  margin:
    0 auto 10px;

  display:grid;
  place-items:center;

  color:#087f7b;
  background:var(--mint);

  border-radius:20px;
}

h1{
  margin:
    0 0 5px;
}

.status{
  color:var(--muted);
}

.camera{
  position:relative;

  overflow:hidden;

  margin-top:18px;

  border-radius:24px;

  background:#111;
}

video{
  display:block;

  width:100%;

  aspect-ratio:4/3;

  object-fit:cover;
}

.qr-guide{
  position:absolute;

  top:50%;
  left:50%;

  width:58%;

  aspect-ratio:1;

  transform:
    translate(-50%,-50%);

  border:
    3px solid #fff;

  border-radius:20px;

  box-shadow:
    0 0 0 999px
    rgba(0,0,0,.28);
}

.face-guide{
  position:absolute;

  top:50%;
  left:50%;

  width:52%;
  height:72%;

  transform:
    translate(-50%,-50%);

  border:
    3px solid #fff;

  border-radius:48%;
}

button,
.file-button{
  width:100%;

  min-height:52px;

  margin-top:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  border-radius:15px;

  color:#fff;
  background:var(--primary);

  font-size:16px;
  font-weight:700;

  cursor:pointer;
}

.secondary{
  color:#087069;
  background:var(--mint);
}

.preview{
  width:100%;

  max-height:65vh;

  object-fit:contain;

  border-radius:20px;
}

.fallback{
  margin-top:15px;

  padding:16px;

  background:#fff;

  border-radius:18px;
}

input[type=file]{
  display:none;
}

.hidden{
  display:none!important;
}

</style>

</head>


<body>


<main>

<div class="logo">
  ♥
</div>

<h1 id="title">
  พกสุข Camera
</h1>

<p
  id="status"
  class="status">

  กดปุ่มเปิดกล้อง

</p>


<div
  id="cameraBox"
  class="camera">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <div
    id="qrGuide"
    class="qr-guide hidden">
  </div>


  <div
    id="faceGuide"
    class="face-guide hidden">
  </div>

</div>


<img
  id="preview"
  class="preview hidden">


<canvas
  id="canvas"
  hidden>
</canvas>


<button id="openButton">
  เปิดกล้อง
</button>


<button
  id="captureButton"
  class="hidden">

  ถ่ายภาพ

</button>


<button
  id="switchButton"
  class="secondary hidden">

  สลับกล้อง

</button>


<button
  id="retakeButton"
  class="secondary hidden">

  ถ่ายใหม่

</button>


<button
  id="useButton"
  class="hidden">

  ใช้ภาพนี้

</button>


<div
  id="fallback"
  class="fallback hidden">

  <p>
    หากกล้องสดใช้งานไม่ได้
    ให้ใช้กล้องของอุปกรณ์แทน
  </p>

  <label
    class="file-button"
    for="fileInput">

    เปิดกล้อง / เลือกรูป

  </label>


  <input
    id="fileInput"
    type="file"
    accept="image/*">

</div>


<form
  id="resultForm"
  method="post"
  hidden>

  <input
    id="formMode"
    name="mode">

  <input
    id="formAction"
    name="cameraAction">

  <input
    id="formSession"
    name="cameraSession">

  <input
    id="formValue"
    name="cameraValue">

  <input
    id="formData"
    name="cameraData">

</form>

</main>


<script>

function el(id){

  return document
    .getElementById(id);
}


const params =
  new URLSearchParams(
    location.search
  );


const cameraSession =
  params.get(
    'cameraSession'
  ) || '';


const mode =
  params.get('mode') ||
  'kiosk';


const action =
  params.get('action') ||
  'qr';


const returnUrl =
  params.get(
    'returnUrl'
  ) || '';


const video =
  el('video');


const canvas =
  el('canvas');


const ctx =
  canvas.getContext(
    '2d',
    {
      willReadFrequently:true
    }
  );


let stream = null;
let cameras = [];
let cameraIndex = 0;
let scanTimer = null;
let photoData = '';


if(action === 'qr'){

  el('title')
    .textContent =
    'สแกน QR สมาชิก';


  el('qrGuide')
    .classList
    .remove('hidden');


  el('fileInput')
    .setAttribute(
      'capture',
      'environment'
    );

}else{

  el('title')
    .textContent =
    'ถ่ายภาพยืนยัน';


  el('faceGuide')
    .classList
    .remove('hidden');


  el('fileInput')
    .setAttribute(
      'capture',
      'user'
    );
}


el('openButton')
  .onclick =
  openCamera;


el('captureButton')
  .onclick =
  takePhoto;


el('switchButton')
  .onclick =
  switchCamera;


el('retakeButton')
  .onclick =
  retake;


el('useButton')
  .onclick =
  function(){

    sendResult({
      data:
        photoData
    });
  };


el('fileInput')
  .onchange =
  handleFile;


/* =====================================================
   CAMERA
===================================================== */

async function openCamera(){

  if(
    window.self !==
    window.top
  ){

    setStatus(
      'กรุณาเปิดหน้ากล้องโดยตรง'
    );

    return;
  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices
      .getUserMedia
  ){

    showFallback(
      'Browser ไม่รองรับกล้องสด'
    );

    return;
  }


  const facing =
    action === 'photo'
      ? 'user'
      : 'environment';


  try{

    stopCamera();


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            facingMode:{
              ideal:facing
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }
          }
        });


    video.srcObject =
      stream;


    await video.play();


    cameras =
      (
        await navigator
          .mediaDevices
          .enumerateDevices()
      )
      .filter(
        function(device){

          return (
            device.kind ===
            'videoinput'
          );
        }
      );


    el('openButton')
      .classList
      .add('hidden');


    el('switchButton')
      .classList
      .toggle(
        'hidden',
        cameras.length < 2
      );


    if(action === 'photo'){

      el('captureButton')
        .classList
        .remove('hidden');


      setStatus(
        'จัดใบหน้าให้อยู่กลางกรอบ'
      );

    }else{

      setStatus(
        'นำ QR ไว้ในกรอบ'
      );


      startScanner();
    }


  }catch(error){

    console.error(error);


    showFallback(
      error.name ===
      'NotAllowedError'
        ?
        'ไม่ได้รับอนุญาตให้ใช้กล้อง'
        :
        'เปิดกล้องไม่ได้'
    );
  }
}


async function switchCamera(){

  if(cameras.length < 2){
    return;
  }


  cameraIndex =
    (
      cameraIndex + 1
    ) %
    cameras.length;


  stopScanner();

  stopCamera();


  try{

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            deviceId:{

              exact:
                cameras[
                  cameraIndex
                ].deviceId
            }
          }
        });


    video.srcObject =
      stream;


    await video.play();


    if(action === 'qr'){

      startScanner();
    }


  }catch(error){

    showFallback(
      'สลับกล้องไม่ได้'
    );
  }
}


/* =====================================================
   QR
===================================================== */

function startScanner(){

  stopScanner();


  scanTimer =
    setInterval(
      scanFrame,
      180
    );
}


function scanFrame(){

  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    return;
  }


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const image =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const qr =
    jsQR(
      image.data,
      image.width,
      image.height,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );


  if(!qr){
    return;
  }


  stopScanner();
  stopCamera();


  sendResult({
    value:
      qr.data
  });
}


/* =====================================================
   PHOTO
===================================================== */

function takePhoto(){

  if(!video.videoWidth){
    return;
  }


  photoData =
    compressImage(
      video,
      video.videoWidth,
      video.videoHeight
    );


  stopCamera();


  el('preview').src =
    photoData;


  el('preview')
    .classList
    .remove('hidden');


  el('cameraBox')
    .classList
    .add('hidden');


  el('captureButton')
    .classList
    .add('hidden');


  el('switchButton')
    .classList
    .add('hidden');


  el('retakeButton')
    .classList
    .remove('hidden');


  el('useButton')
    .classList
    .remove('hidden');


  setStatus(
    'ตรวจสอบภาพก่อนยืนยัน'
  );
}


function retake(){

  photoData = '';


  el('preview')
    .classList
    .add('hidden');


  el('cameraBox')
    .classList
    .remove('hidden');


  el('retakeButton')
    .classList
    .add('hidden');


  el('useButton')
    .classList
    .add('hidden');


  el('openButton')
    .classList
    .remove('hidden');


  setStatus(
    'กดเปิดกล้องเพื่อถ่ายใหม่'
  );
}


/* =====================================================
   FALLBACK FILE
===================================================== */

function showFallback(message){

  stopScanner();
  stopCamera();


  setStatus(message);


  el('fallback')
    .classList
    .remove('hidden');
}


function handleFile(event){

  const file =
    event.target.files &&
    event.target.files[0];


  if(!file){
    return;
  }


  const image =
    new Image();


  const objectUrl =
    URL.createObjectURL(
      file
    );


  image.onload =
    function(){

      if(action === 'qr'){

        canvas.width =
          image.width;


        canvas.height =
          image.height;


        ctx.drawImage(
          image,
          0,
          0
        );


        const pixels =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const qr =
          jsQR(
            pixels.data,
            pixels.width,
            pixels.height,
            {
              inversionAttempts:
                'attemptBoth'
            }
          );


        URL.revokeObjectURL(
          objectUrl
        );


        if(!qr){

          setStatus(
            'ไม่พบ QR ในภาพ'
          );

          return;
        }


        sendResult({
          value:
            qr.data
        });


        return;
      }


      photoData =
        compressImage(
          image,
          image.width,
          image.height
        );


      URL.revokeObjectURL(
        objectUrl
      );


      el('fallback')
        .classList
        .add('hidden');


      el('cameraBox')
        .classList
        .add('hidden');


      el('preview').src =
        photoData;


      el('preview')
        .classList
        .remove('hidden');


      el('retakeButton')
        .classList
        .remove('hidden');


      el('useButton')
        .classList
        .remove('hidden');
    };


  image.src =
    objectUrl;
}


/* =====================================================
   COMPRESS FACE
===================================================== */

function compressImage(
  source,
  originalWidth,
  originalHeight
){

  const maxSide =
    420;


  let width =
    originalWidth;


  let height =
    originalHeight;


  if(
    Math.max(
      width,
      height
    ) >
    maxSide
  ){

    const ratio =
      maxSide /
      Math.max(
        width,
        height
      );


    width =
      Math.round(
        width *
        ratio
      );


    height =
      Math.round(
        height *
        ratio
      );
  }


  canvas.width =
    width;


  canvas.height =
    height;


  ctx.drawImage(
    source,
    0,
    0,
    width,
    height
  );


  let result =
    canvas.toDataURL(
      'image/webp',
      .28
    );


  if(
    !result.startsWith(
      'data:image/webp'
    )
  ){

    result =
      canvas.toDataURL(
        'image/jpeg',
        .28
      );
  }


  return result;
}


/* =====================================================
   RETURN
===================================================== */

function sendResult(result){

  if(!returnUrl){

    setStatus(
      'ไม่พบ Return URL'
    );

    return;
  }


  stopScanner();
  stopCamera();


  el('resultForm').action =
    returnUrl;


  el('formMode').value =
    mode;


  el('formAction').value =
    action;


  el('formSession').value =
    cameraSession;


  if(action === 'qr'){

    el('formValue').value =
      result.value ||
      '';

  }else{

    el('formData').value =
      result.data ||
      '';
  }


  setStatus(
    'กำลังส่งข้อมูลกลับพกสุข...'
  );


  el('resultForm')
    .submit();
}


function setStatus(text){

  el('status')
    .textContent =
    text;
}


function stopCamera(){

  if(!stream){
    return;
  }


  stream
    .getTracks()
    .forEach(
      function(track){

        track.stop();
      }
    );


  stream = null;

  video.srcObject = null;
}


function stopScanner(){

  if(scanTimer){

    clearInterval(
      scanTimer
    );


    scanTimer = null;
  }
}


window.addEventListener(
  'beforeunload',
  function(){

    stopScanner();
    stopCamera();
  }
);

</script>

</body>

</html>
