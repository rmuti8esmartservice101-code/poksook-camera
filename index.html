<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#09242d"
>

<title>พกสุข Camera</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  color:white;
  background:linear-gradient(180deg,#123742,#061b22);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;
}

.hidden{display:none!important}

main{
  width:min(680px,100%);
  margin:auto;
  padding:
    18px 14px
    calc(25px + env(safe-area-inset-bottom));
}

.brand{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  font-size:27px;
  font-weight:900;
}

.logo{
  width:54px;
  height:54px;
  display:grid;
  place-items:center;
  border-radius:18px;
  background:linear-gradient(135deg,#17879b,#1bb99e);
}

.subtitle{
  margin:8px 0 15px;
  text-align:center;
  color:#bfd2d8;
}

.card{
  padding:14px;
  background:#123a46;
  border-radius:24px;
}

.camera{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  overflow:hidden;
  background:black;
  border-radius:20px;
}

video,img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  padding:30px;
  text-align:center;
  background:#09252e;
}

.placeholderIcon{
  width:88px;
  height:88px;
  display:grid;
  place-items:center;
  margin:auto auto 14px;
  font-size:43px;
  border-radius:28px;
  background:rgba(24,180,157,.13);
}

.frame{
  position:absolute;
  left:50%;
  top:50%;
  width:75%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.corner{
  position:absolute;
  width:55px;
  height:55px;
}

.tl{
  left:0;top:0;
  border-left:6px solid white;
  border-top:6px solid white;
}

.tr{
  right:0;top:0;
  border-right:6px solid white;
  border-top:6px solid white;
}

.bl{
  left:0;bottom:0;
  border-left:6px solid white;
  border-bottom:6px solid white;
}

.br{
  right:0;bottom:0;
  border-right:6px solid white;
  border-bottom:6px solid white;
}

.face{
  position:absolute;
  left:50%;
  top:50%;
  width:62%;
  height:68%;
  transform:translate(-50%,-50%);
  border:3px solid white;
  border-radius:45%;
}

.status{
  margin-top:10px;
  padding:12px;
  text-align:center;
  color:#c2d3d8;
  background:rgba(255,255,255,.06);
  border-radius:15px;
}

.status.ok{
  color:#d9fff2;
  background:rgba(19,168,119,.2);
}

.status.error{
  color:#ffd8dc;
  background:rgba(223,96,104,.2);
}

.btn{
  width:100%;
  min-height:58px;
  margin-top:9px;
  padding:11px 16px;
  border:0;
  border-radius:17px;
  font:inherit;
  font-size:18px;
  font-weight:900;
}

.primary{
  color:white;
  background:linear-gradient(135deg,#168b9b,#19b39d);
}

.green{
  color:white;
  background:#13a877;
}

.light{
  color:#17313d;
  background:#e8f1f3;
}

.info{
  margin-top:10px;
  text-align:center;
  color:#9eb7bf;
  font-size:12px;
}

canvas{display:none}
</style>

</head>

<body>

<main>

<div class="brand">
  <div class="logo">♡</div>
  พกสุข Camera
</div>

<div
  id="subtitle"
  class="subtitle"
></div>


<!-- QR SCANNER -->

<section
  id="scanPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="scanVideo"
      autoplay
      muted
      playsinline
    ></video>

    <div
      id="scanPlaceholder"
      class="placeholder"
    >
      <div>
        <div class="placeholderIcon">
          ▣
        </div>

        <h2>พร้อมสแกน QR</h2>

        <p>
          เปิดกล้องและนำ QR
          เข้าในกรอบ
        </p>
      </div>
    </div>

    <div
      id="scanFrame"
      class="frame hidden"
    >
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>

  </div>

  <canvas id="scanCanvas"></canvas>

  <div
    id="scanStatus"
    class="status"
  >
    กำลังเตรียมกล้อง...
  </div>

  <button
    id="scanBtn"
    class="btn primary hidden"
    onclick="startScanner(false)"
  >
    เปิดกล้องสแกน QR
  </button>

  <button
    class="btn light"
    onclick="returnHome()"
  >
    กลับระบบพกสุข
  </button>

  <div
    id="scanInfo"
    class="info"
  ></div>

</section>


<!-- PHOTO -->

<section
  id="photoPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="photoVideo"
      autoplay
      muted
      playsinline
    ></video>

    <img
      id="preview"
      class="hidden"
    >

    <div
      id="photoPlaceholder"
      class="placeholder"
    >
      <div>
        <div class="placeholderIcon">
          ◉
        </div>

        <h2>
          ถ่ายภาพยืนยัน
        </h2>

        <p>
          จัดใบหน้าให้อยู่กลางภาพ
        </p>
      </div>
    </div>

    <div
      id="face"
      class="face hidden"
    ></div>

  </div>

  <div
    id="photoStatus"
    class="status"
  >
    กำลังเตรียมกล้องหน้า...
  </div>

  <button
    id="openPhotoBtn"
    class="btn primary hidden"
    onclick="startPhoto(false)"
  >
    เปิดกล้องหน้า
  </button>

  <button
    id="captureBtn"
    class="btn primary hidden"
    onclick="capturePhoto()"
  >
    ถ่ายภาพ
  </button>

  <button
    id="useBtn"
    class="btn green hidden"
    onclick="sendPhoto()"
  >
    ใช้ภาพนี้
  </button>

  <button
    id="retakeBtn"
    class="btn light hidden"
    onclick="retakePhoto()"
  >
    ถ่ายใหม่
  </button>

  <button
    class="btn light"
    onclick="returnHome()"
  >
    กลับระบบพกสุข
  </button>

</section>

</main>


<script>

const PARAMS =
  new URLSearchParams(
    location.search
  );

const MODE =
  PARAMS.get('mode')
  || 'scan';

const APP_MODE =
  PARAMS.get('appMode')
  || 'kiosk';

const SESSION =
  PARAMS.get('session')
  || '';

const RETURN_URL =
  PARAMS.get('returnUrl')
  || '';

const CAMERA_PERMISSION_KEY =
  'poksook_camera_permission_ok';


let scanStream = null;
let photoStream = null;

let scanLoopId = null;

let scanning = false;
let qrFound = false;

let lastScanTime = 0;

let photoData = '';


window.addEventListener(
  'load',
  init
);


async function init(){
  if (
    !SESSION ||
    !RETURN_URL
  ) {
    alert(
      'Camera Session ไม่ครบ กรุณากลับไปเปิดจากระบบพกสุข'
    );

    return;
  }

  if (
    MODE === 'photo'
  ) {
    document
      .getElementById('photoPage')
      .classList
      .remove('hidden');

    document
      .getElementById('subtitle')
      .textContent =
      'ถ่ายภาพยืนยันสมาชิก';

    if (
      hasPermissionMemory()
    ) {
      const ok =
        await startPhoto(true);

      if (!ok) {
        showPhotoButton();
      }

    } else {
      showPhotoButton();
    }

    return;
  }

  document
    .getElementById('scanPage')
    .classList
    .remove('hidden');

  document
    .getElementById('subtitle')
    .textContent =
    'สแกน QR ประจำตัวสมาชิก';

  if (
    typeof jsQR
    !== 'function'
  ) {
    setScanError(
      'โหลดระบบอ่าน QR ไม่สำเร็จ'
    );

    return;
  }

  if (
    hasPermissionMemory()
  ) {
    const ok =
      await startScanner(true);

    if (!ok) {
      showScanButton();
    }

  } else {
    showScanButton();
  }
}


function hasPermissionMemory(){
  try {
    return (
      localStorage.getItem(
        CAMERA_PERMISSION_KEY
      )
      === '1'
    );

  } catch(error) {
    return false;
  }
}


function rememberPermission(){
  try {
    localStorage.setItem(
      CAMERA_PERMISSION_KEY,
      '1'
    );

  } catch(error) {}
}


function sleep(ms){
  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}


function getMedia(
  constraints,
  timeout=12000
){
  return Promise.race([
    navigator.mediaDevices
      .getUserMedia(
        constraints
      ),

    new Promise(
      (_,reject) =>
        setTimeout(
          () =>
            reject(
              new Error(
                'เปิดกล้องนานเกินไป'
              )
            ),
          timeout
        )
    )
  ]);
}


function waitVideo(
  video,
  timeout=6000
){
  return new Promise(
    resolve => {
      const start =
        Date.now();

      function check(){
        if (
          video.videoWidth > 0 &&
          video.videoHeight > 0
        ) {
          resolve(true);
          return;
        }

        if (
          Date.now() - start
          > timeout
        ) {
          resolve(false);
          return;
        }

        requestAnimationFrame(
          check
        );
      }

      check();
    }
  );
}


/* =========================================================
 SCAN
========================================================= */

function showScanButton(){
  document
    .getElementById('scanBtn')
    .classList
    .remove('hidden');

  document
    .getElementById('scanStatus')
    .textContent =
    'แตะเปิดกล้องสแกน QR';
}


function setScanError(message){
  const status =
    document
      .getElementById('scanStatus');

  status.className =
    'status error';

  status.textContent =
    message;

  showScanButton();
}


async function startScanner(
  silent=false
){
  const button =
    document
      .getElementById('scanBtn');

  button.disabled = true;

  const status =
    document
      .getElementById('scanStatus');

  status.className =
    'status';

  status.textContent =
    'กำลังเปิดกล้องหลัง...';

  await stopScanner();

  try {
    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      throw new Error(
        'Browser นี้ไม่รองรับ Camera'
      );
    }

    try {
      scanStream =
        await getMedia({
          audio:false,
          video:{
            facingMode:{
              ideal:'environment'
            },
            width:{
              ideal:1280
            },
            height:{
              ideal:720
            }
          }
        });

    } catch(firstError) {
      scanStream =
        await getMedia({
          audio:false,
          video:true
        });
    }

    rememberPermission();

    const video =
      document
        .getElementById('scanVideo');

    video.srcObject =
      scanStream;

    video.muted = true;
    video.playsInline = true;

    await video.play();

    const ready =
      await waitVideo(
        video,
        5000
      );

    if (!ready) {
      throw new Error(
        'กล้องเปิดแล้วแต่ยังไม่มีภาพ'
      );
    }

    document
      .getElementById('scanPlaceholder')
      .classList
      .add('hidden');

    document
      .getElementById('scanFrame')
      .classList
      .remove('hidden');

    button.classList.add('hidden');

    button.disabled = false;

    status.className =
      'status ok';

    status.textContent =
      'นำ QR เข้าในกรอบ';

    scanning = true;
    qrFound = false;
    lastScanTime = 0;

    scanLoop();

    return true;

  } catch(error) {
    await stopScanner();

    button.disabled = false;

    setScanError(
      'เปิดกล้องไม่สำเร็จ'
    );

    if (!silent) {
      alert(
        'เปิดกล้องไม่ได้\n\n'
        +
        (
          error.message
          ||
          error
        )
      );
    }

    return false;
  }
}


function scanLoop(timestamp=0){
  if (
    !scanning ||
    qrFound
  ) {
    return;
  }

  scanLoopId =
    requestAnimationFrame(
      scanLoop
    );

  if (
    timestamp - lastScanTime
    < 180
  ) {
    return;
  }

  lastScanTime =
    timestamp;

  const video =
    document
      .getElementById('scanVideo');

  if (
    !video.videoWidth ||
    video.readyState < 2
  ) {
    return;
  }

  decodeQr(video);
}


function decodeQr(video){
  const canvas =
    document
      .getElementById('scanCanvas');

  const ctx =
    canvas.getContext(
      '2d',
      {
        willReadFrequently:true
      }
    );

  const maxWidth =
    560;

  const scale =
    Math.min(
      1,
      maxWidth
      /
      video.videoWidth
    );

  const width =
    Math.max(
      1,
      Math.round(
        video.videoWidth
        *
        scale
      )
    );

  const height =
    Math.max(
      1,
      Math.round(
        video.videoHeight
        *
        scale
      )
    );

  canvas.width =
    width;

  canvas.height =
    height;

  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );

  const image =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );

  const result =
    jsQR(
      image.data,
      width,
      height,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );

  if (
    result &&
    result.data
  ) {
    handleQr(
      result.data
    );
  }
}


async function handleQr(value){
  if (qrFound) {
    return;
  }

  value =
    String(value || '')
      .trim();

  if (!value) {
    return;
  }

  qrFound = true;
  scanning = false;

  const status =
    document
      .getElementById('scanStatus');

  status.className =
    'status ok';

  status.textContent =
    'อ่าน QR สำเร็จ';

  await stopScanner();

  postBack({
    mode:
      APP_MODE,

    cameraAction:
      'qr',

    cameraSession:
      SESSION,

    cameraValue:
      value
  });
}


async function stopScanner(){
  scanning = false;

  if (scanLoopId) {
    cancelAnimationFrame(
      scanLoopId
    );

    scanLoopId = null;
  }

  if (scanStream) {
    scanStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    scanStream = null;
  }

  const video =
    document
      .getElementById('scanVideo');

  if (video) {
    try {
      video.pause();
    } catch(error) {}

    video.srcObject = null;
  }
}


/* =========================================================
 PHOTO
========================================================= */

function showPhotoButton(){
  document
    .getElementById('openPhotoBtn')
    .classList
    .remove('hidden');

  document
    .getElementById('photoStatus')
    .textContent =
    'แตะเพื่อเปิดกล้องหน้า';
}


async function startPhoto(
  silent=false
){
  const button =
    document
      .getElementById('openPhotoBtn');

  button.disabled = true;

  const status =
    document
      .getElementById('photoStatus');

  status.className =
    'status';

  status.textContent =
    'กำลังเปิดกล้องหน้า...';

  await stopPhoto();

  try {
    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      throw new Error(
        'Browser นี้ไม่รองรับ Camera'
      );
    }

    try {
      photoStream =
        await getMedia({
          audio:false,
          video:{
            facingMode:{
              ideal:'user'
            },
            width:{
              ideal:640
            },
            height:{
              ideal:854
            }
          }
        });

    } catch(firstError) {
      photoStream =
        await getMedia({
          audio:false,
          video:true
        });
    }

    rememberPermission();

    const video =
      document
        .getElementById('photoVideo');

    video.srcObject =
      photoStream;

    video.muted = true;
    video.playsInline = true;

    await video.play();

    const ready =
      await waitVideo(
        video,
        5000
      );

    if (!ready) {
      throw new Error(
        'กล้องเปิดแล้วแต่ยังไม่มีภาพ'
      );
    }

    document
      .getElementById('photoPlaceholder')
      .classList
      .add('hidden');

    document
      .getElementById('face')
      .classList
      .remove('hidden');

    button.classList.add('hidden');

    button.disabled = false;

    document
      .getElementById('captureBtn')
      .classList
      .remove('hidden');

    status.className =
      'status ok';

    status.textContent =
      'กล้องพร้อม ถ่ายภาพได้เลย';

    return true;

  } catch(error) {
    await stopPhoto();

    button.disabled = false;
    button.classList.remove('hidden');

    status.className =
      'status error';

    status.textContent =
      'เปิดกล้องไม่สำเร็จ';

    if (!silent) {
      alert(
        'เปิดกล้องไม่ได้\n\n'
        +
        (
          error.message
          ||
          error
        )
      );
    }

    return false;
  }
}


async function stopPhoto(){
  if (photoStream) {
    photoStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    photoStream = null;
  }

  const video =
    document
      .getElementById('photoVideo');

  if (video) {
    try {
      video.pause();
    } catch(error) {}

    video.srcObject = null;
  }
}


async function capturePhoto(){
  const video =
    document
      .getElementById('photoVideo');

  if (!video.videoWidth) {
    alert(
      'กล้องยังไม่พร้อม'
    );

    return;
  }

  /*
   * เล็กและเร็ว
   */
  const maxSide =
    400;

  const quality =
    .24;

  const scale =
    Math.min(
      1,
      maxSide
      /
      Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );

  const canvas =
    document.createElement(
      'canvas'
    );

  canvas.width =
    Math.max(
      1,
      Math.round(
        video.videoWidth
        *
        scale
      )
    );

  canvas.height =
    Math.max(
      1,
      Math.round(
        video.videoHeight
        *
        scale
      )
    );

  canvas
    .getContext(
      '2d',
      {
        alpha:false
      }
    )
    .drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

  photoData =
    canvas.toDataURL(
      'image/webp',
      quality
    );

  if (
    !photoData.startsWith(
      'data:image/webp'
    )
  ) {
    photoData =
      canvas.toDataURL(
        'image/jpeg',
        quality
      );
  }

  await stopPhoto();

  const preview =
    document
      .getElementById('preview');

  preview.src =
    photoData;

  preview
    .classList
    .remove('hidden');

  document
    .getElementById('photoPlaceholder')
    .classList
    .add('hidden');

  document
    .getElementById('face')
    .classList
    .add('hidden');

  document
    .getElementById('captureBtn')
    .classList
    .add('hidden');

  document
    .getElementById('useBtn')
    .classList
    .remove('hidden');

  document
    .getElementById('retakeBtn')
    .classList
    .remove('hidden');

  document
    .getElementById('photoStatus')
    .textContent =
    'ตรวจสอบภาพก่อนยืนยัน';
}


async function retakePhoto(){
  photoData = '';

  document
    .getElementById('preview')
    .classList
    .add('hidden');

  document
    .getElementById('useBtn')
    .classList
    .add('hidden');

  document
    .getElementById('retakeBtn')
    .classList
    .add('hidden');

  document
    .getElementById('photoPlaceholder')
    .classList
    .remove('hidden');

  const ok =
    await startPhoto(true);

  if (!ok) {
    showPhotoButton();
  }
}


function sendPhoto(){
  if (!photoData) {
    alert(
      'ยังไม่ได้ถ่ายภาพ'
    );

    return;
  }

  document
    .getElementById('useBtn')
    .disabled =
    true;

  document
    .getElementById('photoStatus')
    .textContent =
    'กำลังกลับเข้าสู่ระบบพกสุข...';

  postBack({
    mode:
      APP_MODE,

    cameraAction:
      'photo',

    cameraSession:
      SESSION,

    cameraData:
      photoData
  });
}


/* =========================================================
 RETURN TO APPS SCRIPT
========================================================= */

function postBack(fields){
  const form =
    document.createElement(
      'form'
    );

  form.method =
    'POST';

  form.action =
    RETURN_URL;

  form.target =
    '_self';

  Object.keys(fields)
    .forEach(key => {
      const input =
        document.createElement(
          'input'
        );

      input.type =
        'hidden';

      input.name =
        key;

      input.value =
        fields[key];

      form.appendChild(
        input
      );
    });

  document.body
    .appendChild(form);

  form.submit();
}


async function returnHome(){
  await stopScanner();
  await stopPhoto();

  location.replace(
    RETURN_URL
    +
    '?mode='
    +
    encodeURIComponent(
      APP_MODE
    )
  );
}


window.addEventListener(
  'pagehide',
  () => {
    stopScanner();
    stopPhoto();
  }
);

</script>

</body>
</html>
