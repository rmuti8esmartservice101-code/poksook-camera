<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#09242d"
>

<title>
  พกสุข Camera
</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;

  color:white;

  background:
    linear-gradient(
      180deg,
      #123743,
      #071c23
    );

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Thai",
    sans-serif;
}

.hidden{
  display:none!important;
}

main{
  width:min(680px,100%);
  margin:auto;

  padding:
    18px 14px
    calc(
      25px +
      env(safe-area-inset-bottom)
    );
}

.brand{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;

  font-size:27px;
  font-weight:900;
}

.logo{
  width:56px;
  height:56px;

  display:grid;
  place-items:center;

  border-radius:19px;

  font-size:30px;

  background:
    linear-gradient(
      135deg,
      #168b9b,
      #19b49e
    );
}

.subtitle{
  margin:
    8px 0 16px;

  color:#bdd1d7;
  text-align:center;
}

.card{
  padding:14px;

  background:#123b47;

  border-radius:24px;
}

.camera{
  position:relative;

  width:100%;

  aspect-ratio:3/4;

  overflow:hidden;

  background:#000;

  border-radius:20px;
}

.camera video,
.camera img{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;
}

.placeholder{
  position:absolute;
  inset:0;
  z-index:3;

  display:grid;
  place-items:center;

  padding:30px;

  background:#0a252e;

  text-align:center;
}

.placeholderIcon{
  width:88px;
  height:88px;

  display:grid;
  place-items:center;

  margin:
    auto auto 14px;

  font-size:43px;

  border-radius:28px;

  background:
    rgba(24,180,157,.14);
}

.frame{
  position:absolute;
  z-index:5;

  left:50%;
  top:50%;

  width:75%;

  aspect-ratio:1;

  transform:
    translate(-50%,-50%);

  pointer-events:none;
}

.corner{
  position:absolute;

  width:55px;
  height:55px;
}

.tl{
  left:0;
  top:0;

  border-left:
    6px solid white;

  border-top:
    6px solid white;
}

.tr{
  right:0;
  top:0;

  border-right:
    6px solid white;

  border-top:
    6px solid white;
}

.bl{
  left:0;
  bottom:0;

  border-left:
    6px solid white;

  border-bottom:
    6px solid white;
}

.br{
  right:0;
  bottom:0;

  border-right:
    6px solid white;

  border-bottom:
    6px solid white;
}

.face{
  position:absolute;
  z-index:5;

  left:50%;
  top:50%;

  width:62%;
  height:68%;

  transform:
    translate(-50%,-50%);

  border:
    3px solid white;

  border-radius:45%;
}

.status{
  margin-top:10px;
  padding:12px;

  color:#c2d4d9;

  text-align:center;

  background:
    rgba(255,255,255,.06);

  border-radius:15px;
}

.status.ok{
  color:#dafff2;

  background:
    rgba(19,168,119,.20);
}

.status.error{
  color:#ffd9dd;

  background:
    rgba(220,90,104,.20);
}

.nativeBox{
  margin-top:10px;
  padding:15px;

  text-align:center;

  background:
    rgba(255,255,255,.06);

  border-radius:17px;
}

.nativeBox strong{
  display:block;
  margin-bottom:5px;
}

.btn{
  width:100%;
  min-height:59px;

  margin-top:9px;
  padding:11px 16px;

  border:0;
  border-radius:17px;

  font:inherit;
  font-size:18px;
  font-weight:900;
}

.primary{
  color:white;

  background:
    linear-gradient(
      135deg,
      #168b9b,
      #19b39d
    );
}

.green{
  color:white;
  background:#13a877;
}

.light{
  color:#17313d;
  background:#e8f1f3;
}

.fileButton{
  display:block;

  width:100%;
  min-height:59px;

  margin-top:9px;
  padding:17px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #168b9b,
      #19b39d
    );

  border-radius:17px;

  font-size:18px;
  font-weight:900;

  text-align:center;
}

.fileButton input{
  display:none;
}

.info{
  margin-top:10px;

  color:#9eb7bf;

  text-align:center;
  font-size:12px;
}

canvas{
  display:none;
}

</style>

</head>


<body>

<main>

<div class="brand">

  <div class="logo">
    ♡
  </div>

  พกสุข Camera

</div>

<div
  id="subtitle"
  class="subtitle"
></div>


<!-- QR -->

<section
  id="scanPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="scanVideo"
      autoplay
      muted
      playsinline
    ></video>

    <img
      id="qrPreview"
      class="hidden"
      alt=""
    >

    <div
      id="scanPlaceholder"
      class="placeholder"
    >

      <div>

        <div class="placeholderIcon">
          ▣
        </div>

        <h2>
          สแกน QR สมาชิก
        </h2>

        <p id="scanHelp">
          กำลังตรวจสอบระบบกล้อง...
        </p>

      </div>

    </div>

    <div
      id="scanFrame"
      class="frame hidden"
    >

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

    </div>

  </div>


  <canvas
    id="scanCanvas"
  ></canvas>


  <div
    id="scanStatus"
    class="status"
  >
    กำลังเตรียมระบบ...
  </div>


  <!-- LIVE -->

  <div
    id="liveScanControls"
    class="hidden"
  >

    <button
      id="liveScanBtn"
      class="btn primary"
      onclick="startScanner()"
    >
      เปิดกล้องสแกนสด
    </button>

  </div>


  <!-- NATIVE -->

  <div
    id="nativeScanControls"
    class="nativeBox hidden"
  >

    <strong>
      ใช้กล้อง iPhone
    </strong>

    <div class="info">
      ถ่ายรูป QR ให้เห็น QR ชัดเจนเต็มภาพ
    </div>

    <label class="fileButton">

      ถ่ายรูป QR

      <input
        id="qrFileInput"
        type="file"
        accept="image/*"
        capture="environment"
      >

    </label>

    <label class="fileButton">

      เลือกรูป QR จากเครื่อง

      <input
        id="qrGalleryInput"
        type="file"
        accept="image/*"
      >

    </label>

  </div>


  <button
    class="btn light"
    onclick="returnHome()"
  >
    กลับระบบพกสุข
  </button>

</section>


<!-- PHOTO -->

<section
  id="photoPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="photoVideo"
      autoplay
      muted
      playsinline
    ></video>

    <img
      id="photoPreview"
      class="hidden"
      alt=""
    >

    <div
      id="photoPlaceholder"
      class="placeholder"
    >

      <div>

        <div class="placeholderIcon">
          ◉
        </div>

        <h2>
          ถ่ายภาพเช็กอิน
        </h2>

        <p id="photoHelp">
          กำลังตรวจสอบระบบกล้อง...
        </p>

      </div>

    </div>

    <div
      id="faceGuide"
      class="face hidden"
    ></div>

  </div>


  <div
    id="photoStatus"
    class="status"
  >
    กำลังเตรียมระบบ...
  </div>


  <!-- LIVE PHOTO -->

  <div
    id="livePhotoControls"
    class="hidden"
  >

    <button
      id="openLivePhotoBtn"
      class="btn primary"
      onclick="startPhotoLive()"
    >
      เปิดกล้องหน้า
    </button>

    <button
      id="captureLiveBtn"
      class="btn primary hidden"
      onclick="captureLivePhoto()"
    >
      ถ่ายภาพ
    </button>

  </div>


  <!-- NATIVE PHOTO -->

  <div
    id="nativePhotoControls"
    class="nativeBox hidden"
  >

    <strong>
      ใช้กล้อง iPhone
    </strong>

    <div class="info">
      ระบบจะเปิดกล้องของโทรศัพท์โดยตรง
    </div>

    <label class="fileButton">

      ถ่ายภาพเช็กอิน

      <input
        id="photoFileInput"
        type="file"
        accept="image/*"
        capture="user"
      >

    </label>

    <label class="fileButton">

      เลือกรูปจากเครื่อง

      <input
        id="photoGalleryInput"
        type="file"
        accept="image/*"
      >

    </label>

  </div>


  <!-- PREVIEW ACTION -->

  <button
    id="usePhotoBtn"
    class="btn green hidden"
    onclick="sendPhoto()"
  >
    ใช้ภาพนี้
  </button>

  <button
    id="retakePhotoBtn"
    class="btn light hidden"
    onclick="resetPhoto()"
  >
    ถ่ายใหม่
  </button>

  <button
    class="btn light"
    onclick="returnHome()"
  >
    กลับระบบพกสุข
  </button>

</section>

</main>


<script>

/* =====================================================
 PARAMS
===================================================== */

const PARAMS =
  new URLSearchParams(
    location.search
  );

const MODE =
  PARAMS.get('mode')
  || 'scan';

const APP_MODE =
  PARAMS.get('appMode')
  || 'kiosk';

const SESSION =
  PARAMS.get('session')
  || '';

const RETURN_URL =
  PARAMS.get('returnUrl')
  || '';

const UA =
  navigator.userAgent
  || '';

const IS_LINE =
  /Line\//i.test(UA)
  ||
  /LIFF/i.test(UA);

const IS_IOS =
  /iPhone|iPad|iPod/i.test(
    UA
  );

const IS_IN_APP =
  IS_LINE;


/* =====================================================
 STATE
===================================================== */

let scanStream = null;

let photoStream = null;

let scanLoopId = null;

let scanning = false;

let qrFound = false;

let lastScanTime = 0;

let photoData = '';


/* =====================================================
 INIT
===================================================== */

window.addEventListener(
  'load',
  init
);


async function init(){
  if (
    !SESSION
    ||
    !RETURN_URL
  ) {
    alert(
      'Camera Session ไม่ครบ กรุณากลับไปเปิดจากระบบพกสุข'
    );

    return;
  }

  setupInputs();

  if (
    MODE === 'photo'
  ) {
    document
      .getElementById(
        'photoPage'
      )
      .classList
      .remove('hidden');

    document
      .getElementById(
        'subtitle'
      )
      .textContent =
      'ถ่ายภาพยืนยันสมาชิก';

    choosePhotoMode();

    return;
  }

  document
    .getElementById(
      'scanPage'
    )
    .classList
    .remove('hidden');

  document
    .getElementById(
      'subtitle'
    )
    .textContent =
    'สแกน QR ประจำตัวสมาชิก';

  chooseScanMode();
}


/* =====================================================
 DETECTION
===================================================== */

function chooseScanMode(){
  if (
    IS_IN_APP
    ||
    !navigator.mediaDevices
    ||
    !navigator.mediaDevices
      .getUserMedia
  ) {
    showNativeScan(
      IS_LINE
        ? 'เปิดผ่าน LINE — ใช้กล้อง iPhone สำหรับถ่าย QR'
        : 'Browser นี้ใช้กล้องสดไม่ได้'
    );

    return;
  }

  showLiveScan();
}


function choosePhotoMode(){
  if (
    IS_IN_APP
    ||
    !navigator.mediaDevices
    ||
    !navigator.mediaDevices
      .getUserMedia
  ) {
    showNativePhoto(
      IS_LINE
        ? 'เปิดผ่าน LINE — ใช้กล้อง iPhone สำหรับถ่ายภาพ'
        : 'Browser นี้ใช้กล้องสดไม่ได้'
    );

    return;
  }

  showLivePhoto();
}


/* =====================================================
 UI MODE
===================================================== */

function showLiveScan(){
  document
    .getElementById(
      'liveScanControls'
    )
    .classList
    .remove('hidden');

  document
    .getElementById(
      'nativeScanControls'
    )
    .classList
    .add('hidden');

  document
    .getElementById(
      'scanStatus'
    )
    .className =
    'status ok';

  document
    .getElementById(
      'scanStatus'
    )
    .textContent =
    'พร้อมเปิดกล้องสแกนสด';

  document
    .getElementById(
      'scanHelp'
    )
    .textContent =
    'แตะปุ่มด้านล่างเพื่อเปิดกล้อง';
}


function showNativeScan(message){
  stopScanner();

  document
    .getElementById(
      'liveScanControls'
    )
    .classList
    .add('hidden');

  document
    .getElementById(
      'nativeScanControls'
    )
    .classList
    .remove('hidden');

  document
    .getElementById(
      'scanStatus'
    )
    .className =
    'status ok';

  document
    .getElementById(
      'scanStatus'
    )
    .textContent =
    message;

  document
    .getElementById(
      'scanHelp'
    )
    .textContent =
    'ถ่ายรูป QR แล้วระบบจะอ่าน QR จากภาพ';
}


function showLivePhoto(){
  document
    .getElementById(
      'livePhotoControls'
    )
    .classList
    .remove('hidden');

  document
    .getElementById(
      'nativePhotoControls'
    )
    .classList
    .add('hidden');

  document
    .getElementById(
      'photoStatus'
    )
    .className =
    'status ok';

  document
    .getElementById(
      'photoStatus'
    )
    .textContent =
    'พร้อมเปิดกล้องหน้า';

  document
    .getElementById(
      'photoHelp'
    )
    .textContent =
    'แตะปุ่มด้านล่างเพื่อเปิดกล้องหน้า';
}


function showNativePhoto(message){
  stopPhoto();

  document
    .getElementById(
      'livePhotoControls'
    )
    .classList
    .add('hidden');

  document
    .getElementById(
      'nativePhotoControls'
    )
    .classList
    .remove('hidden');

  document
    .getElementById(
      'photoStatus'
    )
    .className =
    'status ok';

  document
    .getElementById(
      'photoStatus'
    )
    .textContent =
    message;

  document
    .getElementById(
      'photoHelp'
    )
    .textContent =
    'แตะ “ถ่ายภาพเช็กอิน” เพื่อเปิดกล้อง iPhone';
}


/* =====================================================
 INPUT HANDLERS
===================================================== */

function setupInputs(){
  document
    .getElementById(
      'qrFileInput'
    )
    .addEventListener(
      'change',
      event => {
        const file =
          event.target.files[0];

        if (file) {
          decodeQrFile(file);
        }
      }
    );

  document
    .getElementById(
      'qrGalleryInput'
    )
    .addEventListener(
      'change',
      event => {
        const file =
          event.target.files[0];

        if (file) {
          decodeQrFile(file);
        }
      }
    );

  document
    .getElementById(
      'photoFileInput'
    )
    .addEventListener(
      'change',
      event => {
        const file =
          event.target.files[0];

        if (file) {
          processPhotoFile(file);
        }
      }
    );

  document
    .getElementById(
      'photoGalleryInput'
    )
    .addEventListener(
      'change',
      event => {
        const file =
          event.target.files[0];

        if (file) {
          processPhotoFile(file);
        }
      }
    );
}


/* =====================================================
 LIVE QR
===================================================== */

async function startScanner(){
  const status =
    document
      .getElementById(
        'scanStatus'
      );

  status.className =
    'status';

  status.textContent =
    'กำลังเปิดกล้องหลัง...';

  await stopScanner();

  try {
    scanStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:false,

          video:{
            facingMode:{
              ideal:
                'environment'
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }
          }
        });

    const video =
      document
        .getElementById(
          'scanVideo'
        );

    video.srcObject =
      scanStream;

    video.muted = true;

    video.playsInline = true;

    await video.play();

    await waitVideo(
      video
    );

    document
      .getElementById(
        'scanPlaceholder'
      )
      .classList
      .add('hidden');

    document
      .getElementById(
        'scanFrame'
      )
      .classList
      .remove('hidden');

    status.className =
      'status ok';

    status.textContent =
      'นำ QR เข้าในกรอบ';

    scanning = true;

    qrFound = false;

    lastScanTime = 0;

    scanLoop();

  } catch(error) {
    /*
     * สำคัญ:
     * ถ้า Live Camera ถูก block
     * fallback ไป Native ทันที
     */
    showNativeScan(
      'กล้องสดถูก Browser บล็อก — เปลี่ยนเป็นกล้อง Native แล้ว'
    );
  }
}


function scanLoop(timestamp=0){
  if (
    !scanning
    ||
    qrFound
  ) {
    return;
  }

  scanLoopId =
    requestAnimationFrame(
      scanLoop
    );

  if (
    timestamp
    -
    lastScanTime
    <
    180
  ) {
    return;
  }

  lastScanTime =
    timestamp;

  const video =
    document
      .getElementById(
        'scanVideo'
      );

  if (
    !video.videoWidth
    ||
    video.readyState < 2
  ) {
    return;
  }

  const canvas =
    document
      .getElementById(
        'scanCanvas'
      );

  decodeQrFromSource(
    video,
    canvas
  );
}


async function stopScanner(){
  scanning = false;

  if (
    scanLoopId
  ) {
    cancelAnimationFrame(
      scanLoopId
    );

    scanLoopId = null;
  }

  if (
    scanStream
  ) {
    scanStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    scanStream = null;
  }

  const video =
    document
      .getElementById(
        'scanVideo'
      );

  if (video) {
    try {
      video.pause();
    } catch(error) {}

    video.srcObject =
      null;
  }
}


/* =====================================================
 QR FROM PHOTO
===================================================== */

function decodeQrFile(file){
  const status =
    document
      .getElementById(
        'scanStatus'
      );

  status.className =
    'status';

  status.textContent =
    'กำลังอ่าน QR จากภาพ...';

  const reader =
    new FileReader();

  reader.onload =
    () => {
      const image =
        new Image();

      image.onload =
        () => {
          const preview =
            document
              .getElementById(
                'qrPreview'
              );

          preview.src =
            reader.result;

          preview
            .classList
            .remove('hidden');

          document
            .getElementById(
              'scanPlaceholder'
            )
            .classList
            .add('hidden');

          const canvas =
            document
              .getElementById(
                'scanCanvas'
              );

          const result =
            decodeQrFromSource(
              image,
              canvas
            );

          if (!result) {
            status.className =
              'status error';

            status.textContent =
              'อ่าน QR ไม่สำเร็จ กรุณาถ่ายใหม่ให้ QR ชัดและเต็มภาพ';
          }
        };

      image.onerror =
        () => {
          status.className =
            'status error';

          status.textContent =
            'อ่านรูปไม่ได้';
        };

      image.src =
        reader.result;
    };

  reader.readAsDataURL(
    file
  );
}


function decodeQrFromSource(
  source,
  canvas
){
  if (
    typeof jsQR
    !== 'function'
  ) {
    alert(
      'ระบบอ่าน QR โหลดไม่สำเร็จ'
    );

    return false;
  }

  const sourceWidth =
    source.videoWidth
    ||
    source.naturalWidth
    ||
    source.width;

  const sourceHeight =
    source.videoHeight
    ||
    source.naturalHeight
    ||
    source.height;

  if (
    !sourceWidth
    ||
    !sourceHeight
  ) {
    return false;
  }

  /*
   * ขยายได้ถึง 1200 สำหรับ QR จากภาพ
   * เพื่อให้ QR เล็กในภาพยังอ่านได้
   */
  const maxSide =
    1200;

  const scale =
    Math.min(
      1,
      maxSide
      /
      Math.max(
        sourceWidth,
        sourceHeight
      )
    );

  const width =
    Math.max(
      1,
      Math.round(
        sourceWidth
        *
        scale
      )
    );

  const height =
    Math.max(
      1,
      Math.round(
        sourceHeight
        *
        scale
      )
    );

  canvas.width =
    width;

  canvas.height =
    height;

  const context =
    canvas.getContext(
      '2d',
      {
        willReadFrequently:true
      }
    );

  context.drawImage(
    source,
    0,
    0,
    width,
    height
  );

  const imageData =
    context.getImageData(
      0,
      0,
      width,
      height
    );

  let result =
    jsQR(
      imageData.data,
      width,
      height,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );

  /*
   * ถ้าไม่เจอ QR
   * ลอง crop ส่วนกลางอีกครั้ง
   */
  if (!result) {
    const cropSize =
      Math.round(
        Math.min(
          width,
          height
        )
        *
        .88
      );

    const x =
      Math.round(
        (width - cropSize)
        /
        2
      );

    const y =
      Math.round(
        (height - cropSize)
        /
        2
      );

    const cropped =
      context.getImageData(
        x,
        y,
        cropSize,
        cropSize
      );

    result =
      jsQR(
        cropped.data,
        cropSize,
        cropSize,
        {
          inversionAttempts:
            'attemptBoth'
        }
      );
  }

  if (
    result
    &&
    result.data
  ) {
    handleQr(
      result.data
    );

    return true;
  }

  return false;
}


async function handleQr(value){
  if (qrFound) {
    return;
  }

  value =
    String(
      value || ''
    )
    .trim();

  if (!value) {
    return;
  }

  qrFound = true;

  scanning = false;

  await stopScanner();

  const status =
    document
      .getElementById(
        'scanStatus'
      );

  status.className =
    'status ok';

  status.textContent =
    'อ่าน QR สำเร็จ กำลังกลับระบบพกสุข...';

  postBack({
    mode:
      APP_MODE,

    cameraAction:
      'qr',

    cameraSession:
      SESSION,

    cameraValue:
      value
  });
}


/* =====================================================
 LIVE PHOTO
===================================================== */

async function startPhotoLive(){
  const status =
    document
      .getElementById(
        'photoStatus'
      );

  status.className =
    'status';

  status.textContent =
    'กำลังเปิดกล้องหน้า...';

  await stopPhoto();

  try {
    photoStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:false,

          video:{
            facingMode:{
              ideal:'user'
            },

            width:{
              ideal:720
            },

            height:{
              ideal:960
            }
          }
        });

    const video =
      document
        .getElementById(
          'photoVideo'
        );

    video.srcObject =
      photoStream;

    video.muted = true;

    video.playsInline = true;

    await video.play();

    await waitVideo(
      video
    );

    document
      .getElementById(
        'photoPlaceholder'
      )
      .classList
      .add('hidden');

    document
      .getElementById(
        'faceGuide'
      )
      .classList
      .remove('hidden');

    document
      .getElementById(
        'openLivePhotoBtn'
      )
      .classList
      .add('hidden');

    document
      .getElementById(
        'captureLiveBtn'
      )
      .classList
      .remove('hidden');

    status.className =
      'status ok';

    status.textContent =
      'กล้องพร้อม ถ่ายภาพได้เลย';

  } catch(error) {
    /*
     * fallback
     */
    showNativePhoto(
      'กล้องสดถูก Browser บล็อก — เปลี่ยนเป็นกล้อง Native แล้ว'
    );
  }
}


async function captureLivePhoto(){
  const video =
    document
      .getElementById(
        'photoVideo'
      );

  if (
    !video.videoWidth
  ) {
    alert(
      'กล้องยังไม่พร้อม'
    );

    return;
  }

  photoData =
    compressSourceToDataUrl(
      video,
      video.videoWidth,
      video.videoHeight
    );

  await stopPhoto();

  showPhotoPreview(
    photoData
  );
}


async function stopPhoto(){
  if (
    photoStream
  ) {
    photoStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    photoStream = null;
  }

  const video =
    document
      .getElementById(
        'photoVideo'
      );

  if (video) {
    try {
      video.pause();
    } catch(error) {}

    video.srcObject =
      null;
  }
}


/* =====================================================
 NATIVE PHOTO
===================================================== */

function processPhotoFile(file){
  const status =
    document
      .getElementById(
        'photoStatus'
      );

  status.className =
    'status';

  status.textContent =
    'กำลังย่อภาพ...';

  const reader =
    new FileReader();

  reader.onload =
    () => {
      const image =
        new Image();

      image.onload =
        () => {
          photoData =
            compressSourceToDataUrl(
              image,
              image.naturalWidth,
              image.naturalHeight
            );

          showPhotoPreview(
            photoData
          );
        };

      image.onerror =
        () => {
          status.className =
            'status error';

          status.textContent =
            'อ่านรูปไม่ได้';
        };

      image.src =
        reader.result;
    };

  reader.readAsDataURL(
    file
  );
}


function compressSourceToDataUrl(
  source,
  sourceWidth,
  sourceHeight
){
  /*
   * ขนาดเล็กเพื่อส่งเร็วมาก
   */
  const MAX_SIDE = 420;

  const QUALITY = .26;

  const scale =
    Math.min(
      1,
      MAX_SIDE
      /
      Math.max(
        sourceWidth,
        sourceHeight
      )
    );

  const canvas =
    document.createElement(
      'canvas'
    );

  canvas.width =
    Math.max(
      1,
      Math.round(
        sourceWidth
        *
        scale
      )
    );

  canvas.height =
    Math.max(
      1,
      Math.round(
        sourceHeight
        *
        scale
      )
    );

  canvas
    .getContext(
      '2d',
      {
        alpha:false
      }
    )
    .drawImage(
      source,
      0,
      0,
      canvas.width,
      canvas.height
    );

  let result =
    canvas.toDataURL(
      'image/webp',
      QUALITY
    );

  if (
    !result.startsWith(
      'data:image/webp'
    )
  ) {
    result =
      canvas.toDataURL(
        'image/jpeg',
        QUALITY
      );
  }

  return result;
}

    )

    .add('hidden');

  document

    .classList
    .add('hidden');

  document
    .getElementById(
      'nativePhotoControls'
    )
    .classList
    .add('hidden');

  document
    .getElementById(

    )
    .classList
    .remove('hidden');

  document
    .getElementById(

function resetPhoto(){
  photoData = '';

  document
    .getElementById(
      'photoPreview'
    )
    .classList
    .add('hidden');

  document
    .getElementById(
      'usePhotoBtn'
    )
    .classList
    .add('hidden');

      'retakePhotoBtn'
    )

    .add('hidden');

function sendPhoto(){
  if (!photoData) {
    alert(
      'ยังไม่ได้ถ่ายภาพ'
    );

    return;
  }

  document
    .getElementById(
      'usePhotoBtn'
    )
    .disabled = true;

  const status =
    document
      .getElementById(
        'photoStatus'
      );

  status.className =
    'status ok';

  status.textContent =
    'กำลังกลับระบบพกสุข...';

  postBack({
    mode:
      APP_MODE,

    cameraAction:
      'photo',

    cameraSession:
      SESSION,

    cameraData:
      photoData
  });
}


/* =====================================================
 VIDEO READY
===================================================== */

function waitVideo(
  video,
  timeout=6000
){
  return new Promise(
    (resolve,reject) => {

      const start =
        Date.now();

      function check(){
        if (
          video.videoWidth > 0
          &&
          video.videoHeight > 0
        ) {
          resolve(true);
          return;
        }

        if (
          Date.now() - start
          >
          timeout
        ) {
          reject(
            new Error(
              'Camera timeout'
            )
          );

          return;
        }

        requestAnimationFrame(
          check
        );
      }

      check();
    }
  );
}


/* =====================================================
 RETURN TO APPS SCRIPT
===================================================== */

function postBack(fields){
  const form =
    document.createElement(
      'form'
    );

  form.method =
    'POST';

  form.action =
    RETURN_URL;

  form.target =
    '_self';

  Object.keys(fields)
    .forEach(key => {

      const input =
        document.createElement(
          'input'
        );

      input.type =
        'hidden';

      input.name =
        key;

      input.value =
        fields[key];

      form.appendChild(
        input
      );
    });

  document.body
    .appendChild(form);

  form.submit();
}


async function returnHome(){
  await stopScanner();
  await stopPhoto();

  location.replace(
    RETURN_URL
    +
    '?mode='
    +
    encodeURIComponent(
      APP_MODE
    )
  );
}


window.addEventListener(
  'pagehide',
  () => {
    stopScanner();
    stopPhoto();
  }
);
