<!doctype html>

<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>
  พกสุข Camera
</title>


<script
  src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
</script>


<style>

:root{
  --primary:#087f7b;
  --bg:#f3f8fa;
  --text:#16373c;
}


*{
  box-sizing:border-box;
}


body{

  margin:0;

  background:
    var(--bg);

  color:
    var(--text);

  font-family:
    system-ui,
    -apple-system,
    sans-serif;
}


main{

  width:min(
    720px,
    100%
  );

  margin:auto;

  padding:
    calc(
      18px +
      env(safe-area-inset-top)
    )
    16px
    calc(
      20px +
      env(safe-area-inset-bottom)
    );

  text-align:center;
}


.videoBox{

  position:relative;

  width:100%;

  margin:18px 0;

  overflow:hidden;

  border-radius:22px;

  background:#111;
}


video{

  width:100%;

  min-height:300px;

  max-height:65vh;

  object-fit:cover;

  display:block;
}


.faceGuide{

  position:absolute;

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%);

  width:58%;

  aspect-ratio:3/4;

  border:
    3px solid
    rgba(255,255,255,.85);

  border-radius:45%;

  pointer-events:none;
}


button{

  width:100%;

  min-height:52px;

  border:0;

  border-radius:15px;

  font-size:17px;

  font-weight:700;

  margin:
    5px 0;

  background:
    var(--primary);

  color:white;
}


.secondary{

  color:#096a66;

  background:#dff5f2;
}


.danger{

  color:#9d3940;

  background:#fde9eb;
}


.hidden{
  display:none !important;
}


.message{

  color:#637d82;

  margin:10px;
}


img.preview{

  width:100%;

  max-height:65vh;

  object-fit:contain;

  border-radius:20px;

  background:#111;
}

</style>

</head>


<body>

<main>

  <h2 id="title">
    พกสุข Camera
  </h2>

  <p
    id="message"
    class="message">

    กดปุ่มเพื่อเปิดกล้อง

  </p>


  <div
    id="videoBox"
    class="videoBox">

    <video
      id="video"
      playsinline
      muted>
    </video>

    <div
      id="faceGuide"
      class="faceGuide hidden">
    </div>

  </div>


  <img
    id="preview"
    class="preview hidden">


  <canvas
    id="canvas"
    hidden>
  </canvas>


  <button
    id="openBtn">

    เปิดกล้อง

  </button>


  <button
    id="captureBtn"
    class="hidden">

    ถ่ายภาพ

  </button>


  <button
    id="switchBtn"
    class="secondary hidden">

    สลับกล้อง

  </button>


  <button
    id="retakeBtn"
    class="secondary hidden">

    ถ่ายใหม่

  </button>


  <button
    id="useBtn"
    class="hidden">

    ใช้ภาพนี้

  </button>


  <div
    id="fallback"
    class="hidden">

    <p>
      ใช้กล้องของเครื่องแทน
    </p>

    <input
      id="fileInput"
      type="file"
      accept="image/*">

  </div>


  <form
    id="form"
    method="post"
    hidden>

    <input
      id="fMode"
      name="mode">

    <input
      id="fAction"
      name="cameraAction">

    <input
      id="fSession"
      name="cameraSession">

    <input
      id="fValue"
      name="cameraValue">

    <input
      id="fData"
      name="cameraData">

  </form>

</main>


<script>

const q =
  new URLSearchParams(
    location.search
  );


const session =
  q.get(
    'cameraSession'
  ) || '';


const mode =
  q.get('mode') ||
  'kiosk';


const action =
  q.get('action') ||
  'qr';


const returnUrl =
  q.get('returnUrl') ||
  '';


const video =
  document.getElementById(
    'video'
  );


const canvas =
  document.getElementById(
    'canvas'
  );


const ctx =
  canvas.getContext(
    '2d',
    {
      willReadFrequently:true
    }
  );


let stream = null;

let cameras = [];

let cameraIndex = 0;

let scanTimer = null;

let capturedData = '';


title.textContent =
  action === 'photo'
    ? 'ถ่ายภาพยืนยัน'
    : 'สแกน QR สมาชิก';


if(
  action === 'photo'
){

  faceGuide.classList
    .remove('hidden');
}


fileInput.setAttribute(
  'capture',
  action === 'photo'
    ? 'user'
    : 'environment'
);


/* ไม่ขอ permission ตอนโหลดหน้า */

openBtn.onclick =
  startCamera;


captureBtn.onclick =
  capturePhoto;


switchBtn.onclick =
  switchCamera;


retakeBtn.onclick =
  retake;


useBtn.onclick =
  () => {

    sendResult({
      data:
        capturedData
    });
  };


fileInput.onchange =
  fallbackImage;


/* =====================================
   CAMERA
===================================== */

async function startCamera(){

  if(
    !window.isSecureContext
  ){

    fallbackMode(
      'กล้องต้องเปิดผ่าน HTTPS'
    );

    return;
  }


  if(
    !navigator
      .mediaDevices
      ?.getUserMedia
  ){

    fallbackMode(
      'Browser นี้ไม่รองรับกล้องสด'
    );

    return;
  }


  message.textContent =
    'กำลังเปิดกล้อง...';


  const facing =
    action === 'photo'
      ? 'user'
      : 'environment';


  const attempts = [

    {
      video:{
        facingMode:{
          ideal:facing
        },
        width:{
          ideal:1280
        },
        height:{
          ideal:720
        }
      }
    },

    {
      video:{
        facingMode:{
          ideal:facing
        }
      }
    },

    {
      video:true
    }
  ];


  let lastError;


  for(
    const constraints
    of attempts
  ){

    try{

      stopCamera();


      stream =
        await navigator
          .mediaDevices
          .getUserMedia(
            constraints
          );


      break;
    }

    catch(err){

      lastError = err;
    }
  }


  if(!stream){

    cameraError(
      lastError
    );

    return;
  }


  video.srcObject =
    stream;


  await video.play();


  await loadCameras();


  openBtn.classList
    .add('hidden');


  switchBtn.classList
    .toggle(
      'hidden',
      cameras.length < 2
    );


  if(
    action === 'photo'
  ){

    captureBtn.classList
      .remove('hidden');


    message.textContent =
      'จัดใบหน้าให้อยู่กลางกรอบ';
  }


  else{

    message.textContent =
      'นำ QR มาไว้ในภาพ';


    startQR();
  }
}


async function loadCameras(){

  try{

    cameras =
      (
        await navigator
          .mediaDevices
          .enumerateDevices()
      )
      .filter(
        d =>
          d.kind ===
          'videoinput'
      );
  }

  catch(_){
    cameras = [];
  }
}


async function switchCamera(){

  if(
    cameras.length < 2
  ){
    return;
  }


  cameraIndex =
    (
      cameraIndex + 1
    ) %
    cameras.length;


  stopCamera();


  try{

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            deviceId:{
              exact:
                cameras[
                  cameraIndex
                ].deviceId
            }
          }
        });


    video.srcObject =
      stream;


    await video.play();


    if(
      action === 'qr'
    ){

      startQR();
    }
  }

  catch(err){

    cameraError(err);
  }
}


/* =====================================
   QR SCAN
===================================== */

function startQR(){

  stopScan();


  /*
   ไม่ Scan ทุก frame
   Scan ทุก 180ms
  */
  scanTimer =
    setInterval(
      readQR,
      180
    );
}


function readQR(){

  if(
    !video.videoWidth ||
    !video.videoHeight
  ){
    return;
  }


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const img =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const result =
    jsQR(
      img.data,
      img.width,
      img.height,
      {
        inversionAttempts:
          'dontInvert'
      }
    );


  if(!result){
    return;
  }


  stopScan();

  stopCamera();


  sendResult({
    value:
      result.data
  });
}


/* =====================================
   PHOTO
===================================== */

function capturePhoto(){

  if(
    !video.videoWidth
  ){
    return;
  }


  capturedData =
    compressSource(
      video,
      video.videoWidth,
      video.videoHeight,
      540,
      .30
    );


  preview.src =
    capturedData;


  preview.classList
    .remove('hidden');


  videoBox.classList
    .add('hidden');


  captureBtn.classList
    .add('hidden');


  switchBtn.classList
    .add('hidden');


  retakeBtn.classList
    .remove('hidden');


  useBtn.classList
    .remove('hidden');


  stopCamera();


  message.textContent =
    'ตรวจสอบภาพก่อนใช้';
}


function retake(){

  capturedData = '';


  preview.classList
    .add('hidden');


  videoBox.classList
    .remove('hidden');


  retakeBtn.classList
    .add('hidden');


  useBtn.classList
    .add('hidden');


  openBtn.classList
    .remove('hidden');


  message.textContent =
    'กดเปิดกล้องเพื่อถ่ายใหม่';
}


/* =====================================
   FALLBACK
===================================== */

function fallbackMode(
  text
){

  stopCamera();

  stopScan();


  message.textContent =
    text;


  fallback.classList
    .remove('hidden');


  /*
   Native camera
  */
  fileInput.setAttribute(
    'capture',
    action === 'photo'
      ? 'user'
      : 'environment'
  );
}


function fallbackImage(e){

  const file =
    e.target.files?.[0];


  if(!file){
    return;
  }


  const img =
    new Image();


  const url =
    URL.createObjectURL(
      file
    );


  img.onload =
    () => {

      if(
        action === 'qr'
      ){

        canvas.width =
          img.width;


        canvas.height =
          img.height;


        ctx.drawImage(
          img,
          0,
          0
        );


        const pixels =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const qr =
          jsQR(
            pixels.data,
            pixels.width,
            pixels.height
          );


        URL.revokeObjectURL(
          url
        );


        if(!qr){

          message.textContent =
            'ไม่พบ QR ในภาพ';

          return;
        }


        sendResult({
          value:
            qr.data
        });
      }


      else{

        capturedData =
          compressSource(
            img,
            img.width,
            img.height,
            540,
            .30
          );


        URL.revokeObjectURL(
          url
        );


        preview.src =
          capturedData;


        preview.classList
          .remove('hidden');


        videoBox.classList
          .add('hidden');


        fallback.classList
          .add('hidden');


        retakeBtn.classList
          .remove('hidden');


        useBtn.classList
          .remove('hidden');


        message.textContent =
          'ตรวจสอบภาพก่อนใช้';
      }
    };


  img.src =
    url;
}


/* =====================================
   IMAGE COMPRESS
===================================== */

function compressSource(
  source,
  width,
  height,
  maxSide,
  quality
){

  let w =
    width;

  let h =
    height;


  if(
    Math.max(w,h) >
    maxSide
  ){

    const ratio =
      maxSide /
      Math.max(w,h);


    w =
      Math.round(
        w * ratio
      );


    h =
      Math.round(
        h * ratio
      );
  }


  canvas.width = w;
  canvas.height = h;


  ctx.drawImage(
    source,
    0,
    0,
    w,
    h
  );


  let data =
    canvas.toDataURL(
      'image/webp',
      quality
    );


  /*
   Browser ไม่รองรับ WebP
  */
  if(
    !data.startsWith(
      'data:image/webp'
    )
  ){

    data =
      canvas.toDataURL(
        'image/jpeg',
        quality
      );
  }


  return data;
}


/* =====================================
   RETURN TO APPS SCRIPT
===================================== */

function sendResult(
  result
){

  if(
    !returnUrl
  ){

    message.textContent =
      'ไม่พบ Return URL';

    return;
  }


  form.action =
    returnUrl;


  fMode.value =
    mode;


  fAction.value =
    action;


  fSession.value =
    session;


  if(
    action === 'qr'
  ){

    fValue.value =
      result.value || '';
  }


  else{

    fData.value =
      result.data || '';
  }


  message.textContent =
    'กำลังส่งข้อมูล...';


  form.submit();
}


/* =====================================
   ERROR / CLEANUP
===================================== */

function cameraError(err){

  let text =
    'เปิดกล้องไม่ได้';


  switch(
    err?.name
  ){

    case 'NotAllowedError':

    case 'SecurityError':

      text =
        'ไม่ได้รับอนุญาตให้ใช้กล้อง';

      break;


    case 'NotFoundError':

      text =
        'ไม่พบกล้อง';

      break;


    case 'NotReadableError':

      text =
        'กล้องอาจกำลังถูก App อื่นใช้งาน';

      break;


    case 'OverconstrainedError':

      text =
        'อุปกรณ์ไม่รองรับการตั้งค่ากล้องนี้';

      break;
  }


  fallbackMode(text);
}


function stopCamera(){

  if(!stream){
    return;
  }


  stream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );


  stream = null;
}


function stopScan(){

  if(scanTimer){

    clearInterval(
      scanTimer
    );

    scanTimer = null;
  }
}


window.addEventListener(
  'beforeunload',
  () => {

    stopScan();

    stopCamera();
  }
);

</script>

</body>
</html>
