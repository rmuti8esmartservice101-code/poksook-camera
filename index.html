<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>
  พกสุข Camera
</title>

<script
  src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
</script>


<style>

:root {
  --primary:#087f7b;
  --bg:#f3f8fa;
  --text:#16373c;
  --muted:#667e84;
}

* {
  box-sizing:border-box;
}

html,
body {
  margin:0;
  min-height:100%;
}

body {
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);
}

main {
  width:min(720px,100%);
  margin:auto;

  padding:
    calc(
      18px +
      env(safe-area-inset-top)
    )
    16px
    calc(
      20px +
      env(safe-area-inset-bottom)
    );

  text-align:center;
}

.video-box {
  position:relative;

  width:100%;

  overflow:hidden;

  margin:18px 0;

  border-radius:22px;

  background:#111;
}

video {
  display:block;

  width:100%;

  min-height:300px;
  max-height:68vh;

  object-fit:cover;
}

.face-guide {
  position:absolute;

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%);

  width:58%;

  aspect-ratio:3/4;

  border:
    3px solid
    rgba(255,255,255,.85);

  border-radius:44%;

  pointer-events:none;
}

button {
  width:100%;

  min-height:52px;

  margin:5px 0;

  border:0;
  border-radius:15px;

  padding:12px;

  font-size:17px;
  font-weight:700;

  color:#fff;
  background:var(--primary);
}

.secondary {
  color:#086b66;
  background:#dff5f2;
}

.message {
  color:var(--muted);
}

.hidden {
  display:none !important;
}

.preview {
  width:100%;
  max-height:68vh;

  object-fit:contain;

  border-radius:20px;

  background:#111;
}

.native {
  margin-top:16px;

  padding:16px;

  border-radius:16px;

  background:#fff;
}

</style>

</head>


<body>


<main>

  <h2 id="title">
    พกสุข Camera
  </h2>


  <p
    id="message"
    class="message">

    กดปุ่มเพื่อเปิดกล้อง

  </p>


  <div
    id="videoBox"
    class="video-box">

    <video
      id="video"
      playsinline
      muted>
    </video>


    <div
      id="faceGuide"
      class="face-guide hidden">
    </div>

  </div>


  <img
    id="preview"
    class="preview hidden">


  <canvas
    id="canvas"
    hidden>
  </canvas>


  <button id="openButton">
    เปิดกล้อง
  </button>


  <button
    id="captureButton"
    class="hidden">

    ถ่ายภาพ

  </button>


  <button
    id="switchButton"
    class="secondary hidden">

    สลับกล้อง

  </button>


  <button
    id="retakeButton"
    class="secondary hidden">

    ถ่ายใหม่

  </button>


  <button
    id="useButton"
    class="hidden">

    ใช้ภาพนี้

  </button>


  <div
    id="nativeFallback"
    class="native hidden">

    <p>
      ใช้กล้องของอุปกรณ์แทน
    </p>

    <input
      id="fileInput"
      type="file"
      accept="image/*">

  </div>


  <form
    id="returnForm"
    method="post"
    hidden>

    <input
      id="formMode"
      name="mode">

    <input
      id="formAction"
      name="cameraAction">

    <input
      id="formSession"
      name="cameraSession">

    <input
      id="formValue"
      name="cameraValue">

    <input
      id="formData"
      name="cameraData">

  </form>

</main>


<script>

function el(id) {
  return document.getElementById(id);
}


const params =
  new URLSearchParams(
    location.search
  );


const cameraSession =
  params.get(
    'cameraSession'
  ) ||
  '';


const mode =
  params.get('mode') ||
  'kiosk';


const action =
  params.get('action') ||
  'qr';


const returnUrl =
  params.get('returnUrl') ||
  '';


const video =
  el('video');

const canvas =
  el('canvas');

const context =
  canvas.getContext(
    '2d',
    {
      willReadFrequently:true
    }
  );


let stream = null;

let cameras = [];

let cameraIndex = 0;

let scanTimer = null;

let capturedImage = '';


el('title').textContent =
  action === 'photo'
    ? 'ถ่ายภาพยืนยัน'
    : 'สแกน QR สมาชิก';


if (
  action === 'photo'
) {

  el('faceGuide')
    .classList
    .remove('hidden');
}


el('fileInput')
  .setAttribute(
    'capture',
    action === 'photo'
      ? 'user'
      : 'environment'
  );


el('openButton')
  .addEventListener(
    'click',
    startCamera
  );


el('captureButton')
  .addEventListener(
    'click',
    capturePhoto
  );


el('switchButton')
  .addEventListener(
    'click',
    switchCamera
  );


el('retakeButton')
  .addEventListener(
    'click',
    retakePhoto
  );


el('useButton')
  .addEventListener(
    'click',
    function() {

      submitResult({
        data:
          capturedImage
      });
    }
  );


el('fileInput')
  .addEventListener(
    'change',
    handleNativeImage
  );


async function startCamera() {

  if (
    !window.isSecureContext
  ) {

    showFallback(
      'กล้องต้องใช้งานผ่าน HTTPS'
    );

    return;
  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices
      .getUserMedia
  ) {

    showFallback(
      'Browser นี้ไม่รองรับกล้องสด'
    );

    return;
  }


  el('message')
    .textContent =
    'กำลังเปิดกล้อง...';


  const facing =
    action === 'photo'
      ? 'user'
      : 'environment';


  const attempts = [

    {
      video: {
        facingMode: {
          ideal: facing
        },
        width: {
          ideal:1280
        },
        height: {
          ideal:720
        }
      }
    },

    {
      video: {
        facingMode: {
          ideal:facing
        }
      }
    },

    {
      video:true
    }
  ];


  let lastError = null;


  for (
    const constraints
    of attempts
  ) {

    try {

      stopCamera();


      stream =
        await navigator
          .mediaDevices
          .getUserMedia(
            constraints
          );


      break;

    } catch (error) {

      lastError =
        error;
    }
  }


  if (!stream) {

    handleCameraError(
      lastError
    );

    return;
  }


  video.srcObject =
    stream;


  await video.play();


  await loadCameras();


  el('openButton')
    .classList
    .add('hidden');


  el('switchButton')
    .classList
    .toggle(
      'hidden',
      cameras.length < 2
    );


  if (
    action === 'photo'
  ) {

    el('captureButton')
      .classList
      .remove('hidden');


    el('message')
      .textContent =
      'จัดใบหน้าให้อยู่กลางกรอบ';

  } else {

    el('message')
      .textContent =
      'นำ QR มาไว้ในภาพ';


    startQrScan();
  }
}


async function loadCameras() {

  try {

    const devices =
      await navigator
        .mediaDevices
        .enumerateDevices();


    cameras =
      devices.filter(
        function(device) {

          return (
            device.kind ===
            'videoinput'
          );
        }
      );

  } catch (_) {

    cameras = [];
  }
}


async function switchCamera() {

  if (
    cameras.length < 2
  ) {
    return;
  }


  cameraIndex =
    (
      cameraIndex + 1
    ) %
    cameras.length;


  stopCamera();


  try {

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            deviceId: {

              exact:
                cameras[
                  cameraIndex
                ].deviceId
            }
          }
        });


    video.srcObject =
      stream;


    await video.play();


    if (
      action === 'qr'
    ) {

      startQrScan();
    }

  } catch (error) {

    handleCameraError(
      error
    );
  }
}


/* QR */

function startQrScan() {

  stopQrScan();


  scanTimer =
    setInterval(
      readQrFrame,
      180
    );
}


function readQrFrame() {

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {
    return;
  }


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  context.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const pixels =
    context.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const qr =
    jsQR(
      pixels.data,
      pixels.width,
      pixels.height,
      {
        inversionAttempts:
          'dontInvert'
      }
    );


  if (!qr) {
    return;
  }


  stopQrScan();

  stopCamera();


  submitResult({
    value:
      qr.data
  });
}


/* PHOTO */

function capturePhoto() {

  if (
    !video.videoWidth
  ) {
    return;
  }


  capturedImage =
    compressSource(
      video,
      video.videoWidth,
      video.videoHeight,
      540,
      .30
    );


  showPhotoPreview();
}


function showPhotoPreview() {

  stopCamera();


  el('preview').src =
    capturedImage;


  el('preview')
    .classList
    .remove('hidden');


  el('videoBox')
    .classList
    .add('hidden');


  el('captureButton')
    .classList
    .add('hidden');


  el('switchButton')
    .classList
    .add('hidden');


  el('retakeButton')
    .classList
    .remove('hidden');


  el('useButton')
    .classList
    .remove('hidden');


  el('message')
    .textContent =
    'ตรวจสอบภาพก่อนใช้';
}


function retakePhoto() {

  capturedImage = '';


  el('preview')
    .classList
    .add('hidden');


  el('videoBox')
    .classList
    .remove('hidden');


  el('retakeButton')
    .classList
    .add('hidden');


  el('useButton')
    .classList
    .add('hidden');


  el('openButton')
    .classList
    .remove('hidden');


  el('message')
    .textContent =
    'กดเปิดกล้องเพื่อถ่ายใหม่';
}


/* NATIVE FALLBACK */

function showFallback(message) {

  stopQrScan();

  stopCamera();


  el('message')
    .textContent =
    message ||
    'ไม่สามารถเปิดกล้องสดได้';


  el('nativeFallback')
    .classList
    .remove('hidden');
}


function handleNativeImage(event) {

  const file =
    event.target.files &&
    event.target.files[0];


  if (!file) {
    return;
  }


  const image =
    new Image();


  const objectUrl =
    URL.createObjectURL(
      file
    );


  image.onload =
    function() {

      if (
        action === 'qr'
      ) {

        canvas.width =
          image.width;


        canvas.height =
          image.height;


        context.drawImage(
          image,
          0,
          0
        );


        const pixels =
          context.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const qr =
          jsQR(
            pixels.data,
            pixels.width,
            pixels.height
          );


        URL.revokeObjectURL(
          objectUrl
        );


        if (!qr) {

          el('message')
            .textContent =
            'ไม่พบ QR ในภาพ';

          return;
        }


        submitResult({
          value:
            qr.data
        });

        return;
      }


      capturedImage =
        compressSource(
          image,
          image.width,
          image.height,
          540,
          .30
        );


      URL.revokeObjectURL(
        objectUrl
      );


      el('nativeFallback')
        .classList
        .add('hidden');


      showPhotoPreview();
    };


  image.src =
    objectUrl;
}


function compressSource(
  source,
  originalWidth,
  originalHeight,
  maxSide,
  quality
) {

  let width =
    originalWidth;


  let height =
    originalHeight;


  if (
    Math.max(
      width,
      height
    ) >
    maxSide
  ) {

    const ratio =
      maxSide /
      Math.max(
        width,
        height
      );


    width =
      Math.round(
        width * ratio
      );


    height =
      Math.round(
        height * ratio
      );
  }


  canvas.width =
    width;


  canvas.height =
    height;


  context.drawImage(
    source,
    0,
    0,
    width,
    height
  );


  let data =
    canvas.toDataURL(
      'image/webp',
      quality
    );


  if (
    !data.startsWith(
      'data:image/webp'
    )
  ) {

    data =
      canvas.toDataURL(
        'image/jpeg',
        quality
      );
  }


  return data;
}


/* RETURN */

function submitResult(result) {

  if (!returnUrl) {

    el('message')
      .textContent =
      'ไม่พบ Return URL';

    return;
  }


  const form =
    el('returnForm');


  form.action =
    returnUrl;


  el('formMode').value =
    mode;


  el('formAction').value =
    action;


  el('formSession').value =
    cameraSession;


  if (
    action === 'qr'
  ) {

    el('formValue').value =
      result.value ||
      '';

  } else {

    el('formData').value =
      result.data ||
      '';
  }


  el('message')
    .textContent =
    'กำลังส่งข้อมูลกลับพกสุข...';


  form.submit();
}


/* ERROR */

function handleCameraError(
  error
) {

  let message =
    'เปิดกล้องไม่ได้';


  switch (
    error &&
    error.name
  ) {

    case 'NotAllowedError':
    case 'SecurityError':

      message =
        'ไม่ได้รับอนุญาตให้ใช้กล้อง';

      break;


    case 'NotFoundError':

      message =
        'ไม่พบกล้องในอุปกรณ์';

      break;


    case 'NotReadableError':

      message =
        'กล้องอาจกำลังถูก App อื่นใช้งาน';

      break;


    case 'OverconstrainedError':

      message =
        'อุปกรณ์ไม่รองรับการตั้งค่ากล้องนี้';

      break;
  }


  showFallback(
    message
  );
}


function stopCamera() {

  if (!stream) {
    return;
  }


  stream
    .getTracks()
    .forEach(
      function(track) {

        track.stop();
      }
    );


  stream = null;
}


function stopQrScan() {

  if (
    scanTimer
  ) {

    clearInterval(
      scanTimer
    );


    scanTimer = null;
  }
}


window.addEventListener(
  'beforeunload',
  function() {

    stopQrScan();

    stopCamera();
  }
);

</script>

</body>
</html>
