<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#0b2630"
>

<title>พกสุข Camera</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;

  color:#fff;

  background:
    linear-gradient(
      180deg,
      #102f39,
      #071c23
    );

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Thai",
    sans-serif;
}

.hidden{
  display:none!important;
}

main{
  width:min(700px,100%);
  margin:auto;

  padding:
    17px
    14px
    calc(
      20px +
      env(safe-area-inset-bottom)
    );
}

.brand{
  text-align:center;
  font-size:25px;
  font-weight:900;
}

.subtitle{
  margin-top:6px;
  color:#bad0d7;
  text-align:center;
}

.card{
  margin-top:17px;
  padding:14px;

  background:#123945;

  border-radius:23px;
}

.camera{
  position:relative;

  width:100%;
  aspect-ratio:3/4;

  overflow:hidden;

  background:#000;

  border-radius:20px;
}

.camera video,
.camera img{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;
}

.placeholder{
  position:absolute;
  inset:0;
  z-index:3;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:25px;

  text-align:center;

  background:#0b252d;
}

.placeholderIcon{
  width:82px;
  height:82px;

  display:grid;
  place-items:center;

  margin-bottom:12px;

  font-size:40px;

  border-radius:27px;

  background:
    rgba(25,180,157,.14);
}

.placeholder h2{
  margin:0 0 7px;
}

.placeholder p{
  margin:0;
  color:#bad0d7;
}

.frame{
  position:absolute;
  z-index:5;

  left:50%;
  top:50%;

  width:78%;
  aspect-ratio:1;

  transform:
    translate(-50%,-50%);
}

.corner{
  position:absolute;
  width:55px;
  height:55px;
}

.tl{
  left:0;
  top:0;
  border-left:6px solid #fff;
  border-top:6px solid #fff;
}

.tr{
  right:0;
  top:0;
  border-right:6px solid #fff;
  border-top:6px solid #fff;
}

.bl{
  left:0;
  bottom:0;
  border-left:6px solid #fff;
  border-bottom:6px solid #fff;
}

.br{
  right:0;
  bottom:0;
  border-right:6px solid #fff;
  border-bottom:6px solid #fff;
}

.face{
  position:absolute;
  z-index:5;

  left:50%;
  top:50%;

  width:62%;
  height:68%;

  transform:
    translate(-50%,-50%);

  border:3px solid #fff;

  border-radius:45%;
}

.status{
  margin-top:10px;
  padding:12px;

  color:#bad0d7;
  text-align:center;

  background:
    rgba(255,255,255,.06);

  border-radius:14px;
}

.status.ok{
  color:#dbfff3;
  background:
    rgba(20,170,119,.2);
}

.status.error{
  color:#ffdadd;
  background:
    rgba(223,96,104,.2);
}

.btn{
  width:100%;
  min-height:58px;

  margin-top:9px;
  padding:11px 16px;

  border:0;
  border-radius:17px;

  font:inherit;
  font-size:18px;
  font-weight:900;
}

.primary{
  color:white;

  background:
    linear-gradient(
      135deg,
      #168b9b,
      #19b39d
    );
}

.green{
  color:white;
  background:#13a877;
}

.light{
  color:#17313d;
  background:#e8f1f3;
}

.info{
  margin-top:8px;
  color:#8eabb4;
  text-align:center;
  font-size:11px;
}

canvas{
  display:none;
}

</style>

</head>


<body>

<main>

<div class="brand">
  ♡ พกสุข Camera
</div>

<div
  id="subtitle"
  class="subtitle"
></div>


<!-- QR SCANNER -->

<section
  id="scanPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="scanVideo"
      autoplay
      muted
      playsinline
    ></video>


    <div
      id="scanPlaceholder"
      class="placeholder"
    >

      <div class="placeholderIcon">
        ◉
      </div>

      <h2>
        พร้อมสแกน QR
      </h2>

      <p>
        แตะปุ่มด้านล่างเพื่อเปิดกล้องหลัง
      </p>

    </div>


    <div
      id="scanFrame"
      class="frame hidden"
    >
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>

  </div>


  <canvas id="scanCanvas"></canvas>


  <div
    id="scanStatus"
    class="status"
  >
    แตะ “เปิดกล้องสแกน QR”
  </div>


  <button
    id="scanBtn"
    class="btn primary"
    onclick="startScanner()"
  >
    เปิดกล้องสแกน QR
  </button>


  <button
    class="btn light"
    onclick="returnHome()"
  >
    กลับระบบพกสุข
  </button>


  <div
    id="scanInfo"
    class="info"
  ></div>

</section>


<!-- PHOTO -->

<section
  id="photoPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="photoVideo"
      autoplay
      muted
      playsinline
    ></video>


    <img
      id="preview"
      class="hidden"
    >


    <div
      id="photoPlaceholder"
      class="placeholder"
    >

      <div class="placeholderIcon">
        ◉
      </div>

      <h2>
        ถ่ายภาพยืนยัน
      </h2>

      <p>
        แตะปุ่มด้านล่างเพื่อเปิดกล้องหน้า
      </p>

    </div>


    <div
      id="face"
      class="face hidden"
    ></div>

  </div>


  <button
    id="openPhotoBtn"
    class="btn primary"
    onclick="startPhoto()"
  >
    เปิดกล้องหน้า
  </button>


  <button
    id="captureBtn"
    class="btn primary hidden"
    onclick="capturePhoto()"
  >
    ถ่ายภาพ
  </button>


  <button
    id="useBtn"
    class="btn green hidden"
    onclick="sendPhoto()"
  >
    ใช้ภาพนี้
  </button>


  <button
    id="retakeBtn"
    class="btn light hidden"
    onclick="retakePhoto()"
  >
    ถ่ายใหม่
  </button>


  <button
    class="btn light"
    onclick="returnHome()"
  >
    กลับระบบพกสุข
  </button>


  <div
    id="photoInfo"
    class="info"
  ></div>

</section>

</main>


<script>

const PARAMS =
  new URLSearchParams(
    location.search
  );


const MODE =
  PARAMS.get('mode')
  || 'scan';


const APP_MODE =
  PARAMS.get('appMode')
  || 'kiosk';


const SESSION =
  PARAMS.get('session')
  || '';


const RETURN_URL =
  PARAMS.get('returnUrl')
  || '';


let scanStream = null;
let photoStream = null;

let scanLoopId = null;

let scanning = false;
let qrFound = false;

let lastScanTime = 0;

let photoData = '';


window.addEventListener(
  'load',
  init
);


function init(){

  if (
    !SESSION ||
    !RETURN_URL
  ) {

    alert(
      'Camera Session ไม่ครบ กรุณาเปิดจากระบบพกสุข'
    );

    return;
  }


  if (
    MODE === 'photo'
  ) {

    document
      .getElementById(
        'photoPage'
      )
      .classList.remove(
        'hidden'
      );


    document
      .getElementById(
        'subtitle'
      )
      .textContent =
      'ถ่ายภาพยืนยันสมาชิก';


    return;
  }


  if (
    typeof jsQR
    !== 'function'
  ) {

    alert(
      'โหลดระบบอ่าน QR ไม่สำเร็จ'
    );

    return;
  }


  document
    .getElementById(
      'scanPage'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'subtitle'
    )
    .textContent =
    'สแกน QR ประจำตัวสมาชิก';
}


function sleep(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}


function getMedia(
  constraints,
  timeout=12000
){

  return Promise.race([

    navigator.mediaDevices
      .getUserMedia(
        constraints
      ),

    new Promise(
      (_, reject) =>

        setTimeout(
          () =>
            reject(
              new Error(
                'เปิดกล้องนานเกินไป'
              )
            ),
          timeout
        )

    )

  ]);
}


function waitVideo(
  video,
  timeout=6000
){

  return new Promise(
    resolve => {

      const started =
        Date.now();


      function check(){

        if (
          video.videoWidth > 0 &&
          video.videoHeight > 0
        ) {

          resolve(true);
          return;

        }


        if (
          Date.now() - started
          > timeout
        ) {

          resolve(false);
          return;

        }


        requestAnimationFrame(
          check
        );
      }


      check();

    }
  );
}


/* =========================================================
   SCANNER
========================================================= */

async function startScanner(){

  const button =
    document.getElementById(
      'scanBtn'
    );


  const status =
    document.getElementById(
      'scanStatus'
    );


  button.disabled = true;

  status.className =
    'status';

  status.textContent =
    'กำลังเปิดกล้องหลัง...';


  await stopScanner();


  qrFound = false;


  const video =
    document.getElementById(
      'scanVideo'
    );


  try {

    if (
      !navigator.mediaDevices?.getUserMedia
    ) {

      throw new Error(
        'Browser ไม่รองรับ Camera'
      );

    }


    try {

      scanStream =
        await getMedia({

          audio: false,

          video: {
            facingMode:
              'environment',

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          }

        });


    } catch (_) {

      scanStream =
        await getMedia({
          audio: false,
          video: true
        });

    }


    video.srcObject =
      scanStream;

    video.muted =
      true;

    video.playsInline =
      true;


    await video.play();


    let ready =
      await waitVideo(
        video,
        5000
      );


    if (!ready) {

      const stream =
        scanStream;


      try {
        video.pause();
      } catch (_) {}


      video.srcObject =
        null;


      await sleep(300);


      video.srcObject =
        stream;


      await video.play();


      ready =
        await waitVideo(
          video,
          5000
        );

    }


    if (!ready) {

      throw new Error(
        'กล้องเปิดแล้วแต่ไม่มีภาพ'
      );

    }


    document
      .getElementById(
        'scanPlaceholder'
      )
      .classList.add(
        'hidden'
      );


    document
      .getElementById(
        'scanFrame'
      )
      .classList.remove(
        'hidden'
      );


    status.textContent =
      'นำ QR เข้าในกรอบ';


    document
      .getElementById(
        'scanInfo'
      )
      .textContent =
      'Camera ready • '
      +
      video.videoWidth
      +
      ' × '
      +
      video.videoHeight;


    button.disabled =
      false;

    button.textContent =
      'สแกนใหม่';


    scanning =
      true;

    lastScanTime =
      0;


    scanLoop();


  } catch (error) {

    await stopScanner();


    status.className =
      'status error';


    status.textContent =
      'เปิดกล้องไม่สำเร็จ';


    button.disabled =
      false;

    button.textContent =
      'ลองเปิดกล้องใหม่';


    alert(
      'เปิดกล้องไม่ได้\n\n'
      +
      (
        error.message || error
      )
    );

  }
}


function scanLoop(timestamp=0){

  if (
    !scanning ||
    qrFound
  ) {
    return;
  }


  scanLoopId =
    requestAnimationFrame(
      scanLoop
    );


  /*
   * อ่านเพียงประมาณ 6 ครั้ง/วินาที
   * ลด CPU iPhone
   */
  if (
    timestamp - lastScanTime
    < 160
  ) {
    return;
  }


  lastScanTime =
    timestamp;


  const video =
    document.getElementById(
      'scanVideo'
    );


  if (
    !video.videoWidth ||
    video.readyState < 2
  ) {
    return;
  }


  decodeQr(video);
}


function decodeQr(video){

  const canvas =
    document.getElementById(
      'scanCanvas'
    );


  const ctx =
    canvas.getContext(
      '2d',
      {
        willReadFrequently:true
      }
    );


  /*
   * ใช้ภาพกว้างไม่เกิน 640px
   * ช่วยลด CPU / RAM มากกว่ารุ่นก่อน
   */
  const maxWidth =
    640;


  const scale =
    Math.min(
      1,
      maxWidth /
      video.videoWidth
    );


  const width =
    Math.max(
      1,
      Math.round(
        video.videoWidth
        *
        scale
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        video.videoHeight
        *
        scale
      )
    );


  canvas.width =
    width;

  canvas.height =
    height;


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  const image =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  const result =
    jsQR(
      image.data,
      width,
      height,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );


  if (
    result?.data
  ) {

    handleQr(
      result.data
    );

  }
}


async function handleQr(value){

  if (qrFound) {
    return;
  }


  value =
    String(
      value || ''
    ).trim();


  if (!value) {
    return;
  }


  qrFound = true;
  scanning = false;


  const status =
    document.getElementById(
      'scanStatus'
    );


  status.className =
    'status ok';


  status.textContent =
    'อ่าน QR สำเร็จ กำลังกลับพกสุข...';


  await stopScanner();


  postBack({

    mode:
      APP_MODE,

    cameraAction:
      'qr',

    cameraSession:
      SESSION,

    cameraValue:
      value

  });
}


async function stopScanner(){

  scanning =
    false;


  if (
    scanLoopId
  ) {

    cancelAnimationFrame(
      scanLoopId
    );

    scanLoopId =
      null;

  }


  if (
    scanStream
  ) {

    scanStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    scanStream =
      null;

  }


  const video =
    document.getElementById(
      'scanVideo'
    );


  if (video) {

    try {
      video.pause();
    } catch (_) {}


    video.srcObject =
      null;

  }
}


/* =========================================================
   PHOTO
========================================================= */

async function startPhoto(){

  const button =
    document.getElementById(
      'openPhotoBtn'
    );


  button.disabled =
    true;


  document
    .getElementById(
      'photoInfo'
    )
    .textContent =
    'กำลังเปิดกล้องหน้า...';


  await stopPhoto();


  const video =
    document.getElementById(
      'photoVideo'
    );


  try {

    try {

      photoStream =
        await getMedia({

          audio:false,

          video:{
            facingMode:'user',

            width:{
              ideal:720
            },

            height:{
              ideal:960
            }

          }

        });


    } catch (_) {

      photoStream =
        await getMedia({
          audio:false,
          video:true
        });

    }


    video.srcObject =
      photoStream;

    video.muted =
      true;

    video.playsInline =
      true;


    await video.play();


    let ready =
      await waitVideo(
        video,
        5000
      );


    if (!ready) {

      const stream =
        photoStream;


      video.srcObject =
        null;


      await sleep(300);


      video.srcObject =
        stream;


      await video.play();


      ready =
        await waitVideo(
          video,
          5000
        );

    }


    if (!ready) {

      throw new Error(
        'กล้องเปิดแล้วแต่ไม่มีภาพ'
      );

    }


    document
      .getElementById(
        'photoPlaceholder'
      )
      .classList.add(
        'hidden'
      );


    document
      .getElementById(
        'face'
      )
      .classList.remove(
        'hidden'
      );


    button.classList.add(
      'hidden'
    );


    document
      .getElementById(
        'captureBtn'
      )
      .classList.remove(
        'hidden'
      );


    document
      .getElementById(
        'photoInfo'
      )
      .textContent =
      'Camera ready';


  } catch (error) {

    await stopPhoto();


    button.disabled =
      false;


    alert(
      'เปิดกล้องไม่ได้\n\n'
      +
      (
        error.message || error
      )
    );

  }
}


async function stopPhoto(){

  if (
    photoStream
  ) {

    photoStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    photoStream =
      null;

  }


  const video =
    document.getElementById(
      'photoVideo'
    );


  if (video) {

    try {
      video.pause();
    } catch (_) {}


    video.srcObject =
      null;

  }
}


async function capturePhoto(){

  const video =
    document.getElementById(
      'photoVideo'
    );


  if (!video.videoWidth) {

    alert(
      'กล้องยังไม่พร้อม'
    );

    return;
  }


  /*
   * ลดจาก 560 → 480px
   * ช่วยให้ POST กลับ Apps Script เร็วขึ้น
   */
  const maxSide =
    480;


  const quality =
    .28;


  const scale =
    Math.min(
      1,
      maxSide /
      Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        video.videoWidth * scale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        video.videoHeight * scale
      )
    );


  canvas
    .getContext(
      '2d',
      {alpha:false}
    )
    .drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


  photoData =
    canvas.toDataURL(
      'image/webp',
      quality
    );


  if (
    !photoData.startsWith(
      'data:image/webp'
    )
  ) {

    photoData =
      canvas.toDataURL(
        'image/jpeg',
        quality
      );

  }


  await stopPhoto();


  const preview =
    document.getElementById(
      'preview'
    );


  preview.src =
    photoData;


  preview.classList.remove(
    'hidden'
  );


  document
    .getElementById(
      'face'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'captureBtn'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'useBtn'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'retakeBtn'
    )
    .classList.remove(
      'hidden'
    );
}


function retakePhoto(){

  photoData = '';


  document
    .getElementById(
      'preview'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'useBtn'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'retakeBtn'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'openPhotoBtn'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'openPhotoBtn'
    )
    .disabled =
    false;


  document
    .getElementById(
      'photoPlaceholder'
    )
    .classList.remove(
      'hidden'
    );
}


function sendPhoto(){

  if (!photoData) {

    alert(
      'ยังไม่ได้ถ่ายภาพ'
    );

    return;
  }


  postBack({

    mode:
      APP_MODE,

    cameraAction:
      'photo',

    cameraSession:
      SESSION,

    cameraData:
      photoData

  });
}


/* =========================================================
   POST BACK
========================================================= */

function postBack(fields){

  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';

  form.action =
    RETURN_URL;

  form.target =
    '_self';


  Object.keys(fields)
    .forEach(key => {

      const input =
        document.createElement(
          'input'
        );


      input.type =
        'hidden';

      input.name =
        key;

      input.value =
        fields[key];


      form.appendChild(
        input
      );

    });


  document.body
    .appendChild(form);


  form.submit();
}


async function returnHome(){

  await stopScanner();
  await stopPhoto();


  window.location.replace(
    RETURN_URL
    +
    '?mode='
    +
    encodeURIComponent(
      APP_MODE
    )
  );
}


window.addEventListener(
  'pagehide',
  () => {

    stopScanner();
    stopPhoto();

  }
