<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#0a252e"
>

<title>พกสุข Camera</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>

:root{
  --p:#168c9c;
  --p2:#19b39d;
  --green:#13aa77;
  --red:#df6068;
  --bg:#081d24;
  --panel:#113945;
  --text:#fff;
  --muted:#bed1d7;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:
    linear-gradient(
      180deg,
      #102d37,
      var(--bg)
    );
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Thai",
    sans-serif;
}

.hidden{
  display:none!important;
}

main{
  width:min(720px,100%);
  margin:auto;
  padding:
    18px
    14px
    calc(
      22px +
      env(safe-area-inset-bottom)
    );
}

.brand{
  text-align:center;
  font-size:26px;
  font-weight:900;
}

.subtitle{
  margin-top:8px;
  text-align:center;
  color:var(--muted);
}

.card{
  margin-top:18px;
  padding:14px;
  background:var(--panel);
  border-radius:24px;
}

.camera{
  position:relative;
  overflow:hidden;
  width:100%;
  aspect-ratio:3/4;
  background:#000;
  border-radius:21px;
}

.camera video,
.camera img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder{
  position:absolute;
  inset:0;
  z-index:3;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:25px;
  text-align:center;
  background:
    linear-gradient(
      180deg,
      #081d24,
      #0b2730
    );
}

.placeholderIcon{
  width:85px;
  height:85px;
  display:grid;
  place-items:center;
  margin-bottom:15px;
  border-radius:27px;
  background:
    rgba(25,179,157,.14);
  font-size:42px;
}

.placeholder h2{
  margin:0 0 7px;
}

.placeholder p{
  margin:0;
  color:var(--muted);
}

.frame{
  position:absolute;
  z-index:5;
  left:50%;
  top:50%;
  width:78%;
  aspect-ratio:1;
  transform:
    translate(-50%,-50%);
  pointer-events:none;
}

.c{
  position:absolute;
  width:57px;
  height:57px;
}

.tl{
  left:0;
  top:0;
  border-left:6px solid white;
  border-top:6px solid white;
}

.tr{
  right:0;
  top:0;
  border-right:6px solid white;
  border-top:6px solid white;
}

.bl{
  left:0;
  bottom:0;
  border-left:6px solid white;
  border-bottom:6px solid white;
}

.br{
  right:0;
  bottom:0;
  border-right:6px solid white;
  border-bottom:6px solid white;
}

.face{
  position:absolute;
  z-index:5;
  left:50%;
  top:50%;
  width:62%;
  height:68%;
  transform:
    translate(-50%,-50%);
  border:3px solid white;
  border-radius:45%;
}

.status{
  margin-top:11px;
  padding:12px;
  text-align:center;
  color:var(--muted);
  background:
    rgba(255,255,255,.06);
  border-radius:14px;
}

.status.ok{
  color:#dcfff4;
  background:
    rgba(19,170,119,.2);
}

.status.error{
  color:#ffd9dc;
  background:
    rgba(223,96,104,.2);
}

.btn{
  width:100%;
  min-height:59px;
  margin-top:10px;
  padding:11px 16px;
  border:0;
  border-radius:17px;
  font:inherit;
  font-size:18px;
  font-weight:900;
}

.primary{
  color:white;
  background:
    linear-gradient(
      135deg,
      var(--p),
      var(--p2)
    );
}

.green{
  color:white;
  background:var(--green);
}

.light{
  color:#17313d;
  background:#e8f1f3;
}

.info{
  margin-top:9px;
  color:#91afb8;
  text-align:center;
  font-size:11px;
}

canvas{
  display:none;
}

</style>

</head>


<body>

<main>

<div class="brand">
  ♡ พกสุข Camera
</div>

<div
  id="subtitle"
  class="subtitle"
></div>


<!-- SCANNER -->

<section
  id="scanPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="scanVideo"
      autoplay
      muted
      playsinline
    ></video>

    <div
      id="scanPlaceholder"
      class="placeholder"
    >

      <div class="placeholderIcon">
        ◉
      </div>

      <h2>
        พร้อมสแกน QR
      </h2>

      <p>
        แตะปุ่มด้านล่างเพื่อเปิดกล้องหลัง
      </p>

    </div>


    <div
      id="frame"
      class="frame hidden"
    >
      <div class="c tl"></div>
      <div class="c tr"></div>
      <div class="c bl"></div>
      <div class="c br"></div>
    </div>

  </div>


  <canvas id="canvas"></canvas>


  <div
    id="scanStatus"
    class="status"
  >
    แตะ “เปิดกล้องสแกน QR”
  </div>


  <button
    id="scanButton"
    class="btn primary"
    onclick="startScanner()"
  >
    เปิดกล้องสแกน QR
  </button>


  <button
    class="btn light"
    onclick="returnHome()"
  >
    กลับระบบพกสุข
  </button>


  <div
    id="scanInfo"
    class="info"
  ></div>

</section>


<!-- PHOTO -->

<section
  id="photoPage"
  class="card hidden"
>

  <div class="camera">

    <video
      id="photoVideo"
      autoplay
      muted
      playsinline
    ></video>


    <img
      id="preview"
      class="hidden"
    >


    <div
      id="photoPlaceholder"
      class="placeholder"
    >

      <div class="placeholderIcon">
        ◉
      </div>

      <h2>
        ถ่ายภาพยืนยัน
      </h2>

      <p>
        แตะปุ่มด้านล่างเพื่อเปิดกล้องหน้า
      </p>

    </div>


    <div
      id="face"
      class="face hidden"
    ></div>

  </div>


  <button
    id="openPhoto"
    class="btn primary"
    onclick="startPhoto()"
  >
    เปิดกล้องหน้า
  </button>


  <button
    id="capture"
    class="btn primary hidden"
    onclick="capturePhoto()"
  >
    ถ่ายภาพ
  </button>


  <button
    id="usePhoto"
    class="btn green hidden"
    onclick="sendPhoto()"
  >
    ใช้ภาพนี้
  </button>


  <button
    id="retake"
    class="btn light hidden"
    onclick="retakePhoto()"
  >
    ถ่ายใหม่
  </button>


  <button
    class="btn light"
    onclick="returnHome()"
  >
    กลับระบบพกสุข
  </button>


  <div
    id="photoInfo"
    class="info"
  ></div>

</section>

</main>


<script>

const P =
  new URLSearchParams(
    location.search
  );


const MODE =
  P.get('mode')
  || 'scan';


const APP_MODE =
  P.get('appMode')
  || 'kiosk';


const SESSION =
  P.get('session')
  || '';


const RETURN_URL =
  P.get('returnUrl')
  || '';


let scanStream =
  null;


let photoStream =
  null;


let loop =
  null;


let scanning =
  false;


let found =
  false;


let last =
  0;


let photoData =
  '';


window.addEventListener(
  'load',
  init
);


function init(){

  if (
    !SESSION
    ||
    !RETURN_URL
  ){

    alert(
      'Camera Session ไม่ครบ'
    );

    return;

  }


  if (
    MODE === 'photo'
  ){

    document
      .getElementById(
        'photoPage'
      )
      .classList.remove(
        'hidden'
      );


    document
      .getElementById(
        'subtitle'
      )
      .textContent =
      'ถ่ายภาพยืนยันสมาชิก';


    return;

  }


  if (
    typeof jsQR
    !== 'function'
  ){

    alert(
      'โหลดระบบอ่าน QR ไม่สำเร็จ'
    );

    return;

  }


  document
    .getElementById(
      'scanPage'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'subtitle'
    )
    .textContent =
    'สแกน QR ประจำตัวสมาชิก';

}


function sleep(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


function media(
  constraints,
  timeout=12000
){

  return Promise.race([

    navigator.mediaDevices
      .getUserMedia(
        constraints
      ),

    new Promise(
      (_,reject) =>
        setTimeout(
          () =>
            reject(
              new Error(
                'เปิดกล้องนานเกินไป'
              )
            ),
          timeout
        )
    )

  ]);

}


function waitVideo(
  video,
  timeout=6000
){

  return new Promise(
    resolve => {

      const start =
        Date.now();


      const check =
        () => {

          if (
            video.videoWidth > 0
            &&
            video.videoHeight > 0
          ){

            resolve(true);

            return;

          }


          if (
            Date.now() - start
            > timeout
          ){

            resolve(false);

            return;

          }


          requestAnimationFrame(
            check
          );

        };


      check();

    }
  );

}


/* =========================================================
 SCANNER
========================================================= */

async function startScanner(){

  const button =
    document.getElementById(
      'scanButton'
    );


  const status =
    document.getElementById(
      'scanStatus'
    );


  button.disabled =
    true;


  status.className =
    'status';


  status.textContent =
    'กำลังขอสิทธิ์กล้อง...';


  await stopScanner();


  found =
    false;


  const video =
    document.getElementById(
      'scanVideo'
    );


  try{

    if (
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices
        .getUserMedia
    ){

      throw new Error(
        'Browser ไม่รองรับ Camera'
      );

    }


    try{

      scanStream =
        await media({

          audio:false,

          video:{
            facingMode:
              'environment'
          }

        });


    }catch(_){

      scanStream =
        await media({

          audio:false,

          video:true

        });

    }


    video.srcObject =
      scanStream;


    video.muted =
      true;


    video.playsInline =
      true;


    await video.play();


    let ready =
      await waitVideo(
        video,
        5000
      );


    if (!ready){

      const stream =
        scanStream;


      try{
        video.pause();
      }catch(_){}


      video.srcObject =
        null;


      await sleep(350);


      video.srcObject =
        stream;


      await video.play();


      ready =
        await waitVideo(
          video,
          5000
        );

    }


    if (!ready){

      throw new Error(
        'กล้องเปิดแล้วแต่ไม่มีภาพ'
      );

    }


    document
      .getElementById(
        'scanPlaceholder'
      )
      .classList.add(
        'hidden'
      );


    document
      .getElementById(
        'frame'
      )
      .classList.remove(
        'hidden'
      );


    status.textContent =
      'นำ QR เข้าในกรอบ';


    document
      .getElementById(
        'scanInfo'
      )
      .textContent =
      'Camera ready • '
      +
      video.videoWidth
      +
      ' × '
      +
      video.videoHeight;


    button.textContent =
      'สแกนใหม่';


    button.disabled =
      false;


    scanning =
      true;


    last =
      0;


    scanLoop();


  }catch(error){

    await stopScanner();


    status.className =
      'status error';


    status.textContent =
      'เปิดกล้องไม่สำเร็จ';


    button.textContent =
      'ลองเปิดกล้องใหม่';


    button.disabled =
      false;


    alert(
      'เปิดกล้องไม่ได้\n\n'
      +
      (
        error.message
        ||
        error
      )
    );

  }

}


function scanLoop(time=0){

  if (
    !scanning
    ||
    found
  ){

    return;

  }


  loop =
    requestAnimationFrame(
      scanLoop
    );


  if (
    time - last
    < 120
  ){

    return;

  }


  last =
    time;


  const video =
    document.getElementById(
      'scanVideo'
    );


  if (
    !video.videoWidth
  ){

    return;

  }


  const canvas =
    document.getElementById(
      'canvas'
    );


  const ctx =
    canvas.getContext(
      '2d',
      {
        willReadFrequently:true
      }
    );


  const ratio =
    Math.min(
      1,
      900 /
      video.videoWidth
    );


  const width =
    Math.round(
      video.videoWidth
      *
      ratio
    );


  const height =
    Math.round(
      video.videoHeight
      *
      ratio
    );


  canvas.width =
    width;


  canvas.height =
    height;


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  const image =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  const result =
    jsQR(
      image.data,
      width,
      height,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );


  if (
    result
    &&
    result.data
  ){

    qrFound(
      result.data
    );

  }

}


async function qrFound(value){

  if (found){

    return;

  }


  value =
    String(
      value || ''
    ).trim();


  if (!value){

    return;

  }


  found =
    true;


  scanning =
    false;


  const status =
    document.getElementById(
      'scanStatus'
    );


  status.className =
    'status ok';


  status.textContent =
    'อ่าน QR สำเร็จ กำลังกลับพกสุข...';


  await stopScanner();


  post({

    mode:
      APP_MODE,

    cameraAction:
      'qr',

    cameraSession:
      SESSION,

    cameraValue:
      value

  });

}


async function stopScanner(){

  scanning =
    false;


  if (loop){

    cancelAnimationFrame(loop);

    loop =
      null;

  }


  if (scanStream){

    scanStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    scanStream =
      null;

  }


  const video =
    document.getElementById(
      'scanVideo'
    );


  if (video){

    try{
      video.pause();
    }catch(_){}


    video.srcObject =
      null;

  }

}


/* =========================================================
 PHOTO
========================================================= */

async function startPhoto(){

  const button =
    document.getElementById(
      'openPhoto'
    );


  button.disabled =
    true;


  document
    .getElementById(
      'photoInfo'
    )
    .textContent =
    'กำลังเปิดกล้องหน้า...';


  await stopPhoto();


  const video =
    document.getElementById(
      'photoVideo'
    );


  try{

    try{

      photoStream =
        await media({

          audio:false,

          video:{
            facingMode:'user'
          }

        });


    }catch(_){

      photoStream =
        await media({

          audio:false,

          video:true

        });

    }


    video.srcObject =
      photoStream;


    video.muted =
      true;


    video.playsInline =
      true;


    await video.play();


    let ready =
      await waitVideo(
        video,
        5000
      );


    if (!ready){

      const stream =
        photoStream;


      video.srcObject =
        null;


      await sleep(350);


      video.srcObject =
        stream;


      await video.play();


      ready =
        await waitVideo(
          video,
          5000
        );

    }


    if (!ready){

      throw new Error(
        'กล้องเปิดแล้วแต่ไม่มีภาพ'
      );

    }


    document
      .getElementById(
        'photoPlaceholder'
      )
      .classList.add(
        'hidden'
      );


    document
      .getElementById(
        'face'
      )
      .classList.remove(
        'hidden'
      );


    button.classList.add(
      'hidden'
    );


    document
      .getElementById(
        'capture'
      )
      .classList.remove(
        'hidden'
      );


    document
      .getElementById(
        'photoInfo'
      )
      .textContent =
      'Camera ready';


  }catch(error){

    await stopPhoto();


    button.disabled =
      false;


    alert(
      'เปิดกล้องไม่ได้\n\n'
      +
      (
        error.message
        ||
        error
      )
    );

  }

}


async function stopPhoto(){

  if (photoStream){

    photoStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    photoStream =
      null;

  }


  const video =
    document.getElementById(
      'photoVideo'
    );


  if (video){

    try{
      video.pause();
    }catch(_){}


    video.srcObject =
      null;

  }

}


async function capturePhoto(){

  const video =
    document.getElementById(
      'photoVideo'
    );


  if (
    !video.videoWidth
  ){

    alert(
      'กล้องยังไม่พร้อม'
    );

    return;

  }


  const maxSide =
    560;


  const quality =
    .32;


  const scale =
    Math.min(
      1,
      maxSide /
      Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    Math.round(
      video.videoWidth
      *
      scale
    );


  canvas.height =
    Math.round(
      video.videoHeight
      *
      scale
    );


  canvas
    .getContext('2d')
    .drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


  photoData =
    canvas.toDataURL(
      'image/webp',
      quality
    );


  if (
    !photoData.startsWith(
      'data:image/webp'
    )
  ){

    photoData =
      canvas.toDataURL(
        'image/jpeg',
        quality
      );

  }


  await stopPhoto();


  document
    .getElementById(
      'preview'
    )
    .src =
    photoData;


  document
    .getElementById(
      'preview'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'face'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'capture'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'usePhoto'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'retake'
    )
    .classList.remove(
      'hidden'
    );

}


function retakePhoto(){

  photoData =
    '';


  document
    .getElementById(
      'preview'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'usePhoto'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'retake'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'openPhoto'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'openPhoto'
    )
    .disabled =
    false;


  document
    .getElementById(
      'photoPlaceholder'
    )
    .classList.remove(
      'hidden'
    );

}


function sendPhoto(){

  if (!photoData){

    alert(
      'ยังไม่ได้ถ่ายภาพ'
    );

    return;

  }


  post({

    mode:
      APP_MODE,

    cameraAction:
      'photo',

    cameraSession:
      SESSION,

    cameraData:
      photoData

  });

}


/* =========================================================
 POST BACK
========================================================= */

function post(fields){

  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';


  form.action =
    RETURN_URL;


  form.target =
    '_self';


  Object.keys(fields)
    .forEach(key => {

      const input =
        document.createElement(
          'input'
        );


      input.type =
        'hidden';


      input.name =
        key;


      input.value =
        fields[key];


      form.appendChild(
        input
      );

    });


  document.body
    .appendChild(form);


  form.submit();

}


async function returnHome(){

  await stopScanner();

  await stopPhoto();


  window.location.href =
    RETURN_URL
    +
    '?mode='
    +
    encodeURIComponent(
      APP_MODE
    );

}


window.addEventListener(
  'pagehide',
  () => {

    stopScanner();
    stopPhoto();

  }
);

</script>

</body>
</html>
