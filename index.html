<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0c252e"
  >

  <title>พกสุข Camera</title>

  <!-- QR Decoder -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    :root{
      --bg:#081c23;
      --bg2:#0d2b35;
      --panel:#113946;
      --panel2:#194b59;

      --primary:#13899b;
      --primary2:#18b59d;
      --success:#10a974;
      --danger:#e45d66;

      --text:#ffffff;
      --muted:#b9ced5;
      --line:rgba(255,255,255,.10);

      --radius:26px;

      --shadow:
        0 20px 50px
        rgba(0,0,0,.24);
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;
      background:
        linear-gradient(
          180deg,
          var(--bg2),
          var(--bg)
        );
      color:var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        Tahoma,
        sans-serif;
    }

    body{
      min-height:100vh;
    }

    button{
      font:inherit;
      cursor:pointer;
    }

    .hidden{
      display:none !important;
    }

    main{
      width:min(720px,100%);
      margin:auto;
      padding:
        18px
        15px
        calc(
          24px +
          env(safe-area-inset-bottom)
        );
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin-top:5px;
      font-size:27px;
      font-weight:900;
      letter-spacing:-.3px;
    }

    .brand-logo{
      width:54px;
      height:54px;
      display:grid;
      place-items:center;
      border-radius:18px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary2)
        );

      box-shadow:
        0 12px 28px
        rgba(18,170,153,.18);
    }

    .subtitle{
      margin-top:11px;
      color:var(--muted);
      text-align:center;
      font-size:16px;
    }

    .card{
      margin-top:20px;
      padding:16px;
      background:
        rgba(17,57,70,.96);
      border:
        1px solid
        var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }

    /* ==================================================
       CAMERA AREA
    ================================================== */

    .camera-box{
      position:relative;
      width:100%;
      overflow:hidden;
      aspect-ratio:3/4;
      background:#000;
      border-radius:23px;
    }

    .camera-box video,
    .camera-box img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      background:#000;
    }

    .camera-placeholder{
      position:absolute;
      inset:0;
      z-index:2;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:13px;

      padding:25px;

      text-align:center;

      background:
        linear-gradient(
          180deg,
          #071a20,
          #0a232b
        );
    }

    .camera-placeholder-icon{
      width:84px;
      height:84px;
      display:grid;
      place-items:center;
      color:#d6f6f0;
      border-radius:27px;

      background:
        rgba(28,160,151,.15);
    }

    .camera-placeholder-title{
      font-size:20px;
      font-weight:900;
    }

    .camera-placeholder-text{
      max-width:340px;
      color:var(--muted);
      font-size:14px;
      line-height:1.55;
    }

    /* ==================================================
       QR FRAME
    ================================================== */

    .scan-overlay{
      position:absolute;
      inset:0;
      z-index:4;
      pointer-events:none;
    }

    .scan-frame{
      position:absolute;
      left:50%;
      top:50%;

      width:78%;
      aspect-ratio:1/1;

      transform:
        translate(-50%,-50%);
    }

    .corner{
      position:absolute;
      width:58px;
      height:58px;
    }

    .corner.tl{
      top:0;
      left:0;
      border-top:6px solid white;
      border-left:6px solid white;
    }

    .corner.tr{
      top:0;
      right:0;
      border-top:6px solid white;
      border-right:6px solid white;
    }

    .corner.bl{
      bottom:0;
      left:0;
      border-bottom:6px solid white;
      border-left:6px solid white;
    }

    .corner.br{
      right:0;
      bottom:0;
      border-right:6px solid white;
      border-bottom:6px solid white;
    }

    .scan-line{
      position:absolute;

      left:7%;
      right:7%;
      top:50%;

      height:2px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #6dffe0,
          transparent
        );

      box-shadow:
        0 0 14px
        rgba(109,255,224,.9);

      animation:
        scanLine 2.1s
        ease-in-out
        infinite;
    }

    @keyframes scanLine{
      0%{
        transform:
          translateY(-110px);
      }

      50%{
        transform:
          translateY(110px);
      }

      100%{
        transform:
          translateY(-110px);
      }
    }

    /* ==================================================
       FACE GUIDE
    ================================================== */

    .face-guide{
      position:absolute;
      z-index:4;

      left:50%;
      top:50%;

      width:62%;
      height:68%;

      transform:
        translate(-50%,-50%);

      border:
        3px solid
        rgba(255,255,255,.86);

      border-radius:45%;

      pointer-events:none;
    }

    /* ==================================================
       STATUS
    ================================================== */

    .status{
      margin-top:13px;
      padding:13px 14px;

      color:var(--muted);
      text-align:center;

      background:
        rgba(255,255,255,.06);

      border-radius:15px;

      font-size:16px;
    }

    .status.success{
      color:#dcfff3;

      background:
        rgba(16,169,116,.20);
    }

    .status.error{
      color:#ffdadd;

      background:
        rgba(228,93,102,.20);
    }

    .status.loading{
      color:#dff8ff;

      background:
        rgba(19,137,155,.18);
    }

    .tip{
      margin:
        11px
        5px
        2px;

      color:var(--muted);

      text-align:center;

      font-size:13px;

      line-height:1.55;
    }

    /* ==================================================
       BUTTONS
    ================================================== */

    .btn{
      width:100%;
      min-height:60px;

      margin-top:11px;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;

      padding:12px 18px;

      border:0;
      border-radius:18px;

      font-size:18px;
      font-weight:900;

      transition:
        transform .14s ease,
        opacity .14s ease;
    }

    .btn:active{
      transform:scale(.985);
    }

    .btn:disabled{
      opacity:.50;
      cursor:not-allowed;
    }

    .primary{
      color:white;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary2)
        );
    }

    .success{
      color:white;
      background:var(--success);
    }

    .secondary{
      color:#17323d;
      background:#e9f1f3;
    }

    .danger{
      color:white;
      background:var(--danger);
    }

    .button-row{
      display:grid;
      grid-template-columns:
        1fr 1fr;
      gap:9px;
      margin-top:5px;
    }

    .button-row .btn{
      margin-top:7px;
    }

    /* ==================================================
       DEBUG / INFORMATION
    ================================================== */

    .camera-info{
      margin-top:10px;
      color:#8eb0bb;
      text-align:center;
      font-size:11px;
      line-height:1.4;
    }

    canvas{
      display:none;
    }

    svg{
      display:block;
    }

    @media(max-width:520px){

      main{
        padding:
          14px
          12px
          calc(
            20px +
            env(safe-area-inset-bottom)
          );
      }

      .brand{
        font-size:24px;
      }

      .brand-logo{
        width:49px;
        height:49px;
      }

      .card{
        padding:13px;
        border-radius:23px;
      }

      .corner{
        width:50px;
        height:50px;
      }

    }
  </style>
</head>

<body>

<main>

  <div class="brand">

    <div class="brand-logo">

      <svg
        width="29"
        height="29"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
      </svg>

    </div>

    พกสุข Camera

  </div>


  <div
    id="subtitle"
    class="subtitle"
  ></div>


  <!-- ==================================================
       QR SCANNER
  ================================================== -->

  <section
    id="scannerPage"
    class="card hidden"
  >

    <div class="camera-box">

      <video
        id="scanVideo"
        autoplay
        muted
        playsinline
      ></video>


      <div
        id="scannerPlaceholder"
        class="camera-placeholder"
      >

        <div class="camera-placeholder-icon">

          <svg
            width="38"
            height="38"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M14.5 4 16 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3l1.5-3Z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>

        </div>

        <div class="camera-placeholder-title">
          พร้อมสแกน QR
        </div>

        <div class="camera-placeholder-text">
          แตะปุ่มด้านล่างเพื่อเปิดกล้องหลัง
          ระบบจะขอสิทธิ์ Camera จาก iPhone/iPad
        </div>

      </div>


      <div
        id="scanOverlay"
        class="scan-overlay hidden"
      >

        <div class="scan-frame">

          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>

          <div class="scan-line"></div>

        </div>

      </div>

    </div>


    <canvas id="scanCanvas"></canvas>


    <div
      id="scanStatus"
      class="status"
    >
      แตะ “เปิดกล้องสแกน QR” เพื่อเริ่ม
    </div>


    <div class="tip">
      QR ควรอยู่กลางกรอบ • ถือโทรศัพท์ให้นิ่ง •
      หากสแกนจากจออื่นให้เพิ่มความสว่างของหน้าจอ
    </div>


    <button
      id="openScannerBtn"
      class="btn primary"
      onclick="startScanner()"
    >

      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M14.5 4 16 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3l1.5-3Z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>

      <span id="openScannerText">
        เปิดกล้องสแกน QR
      </span>

    </button>


    <button
      class="btn secondary"
      onclick="returnHome()"
    >
      กลับระบบพกสุข
    </button>


    <div
      id="scannerInfo"
      class="camera-info"
    ></div>

  </section>


  <!-- ==================================================
       PHOTO CAMERA
  ================================================== -->

  <section
    id="photoPage"
    class="card hidden"
  >

    <div class="camera-box">

      <video
        id="photoVideo"
        autoplay
        muted
        playsinline
      ></video>


      <img
        id="photoPreview"
        class="hidden"
        alt="ภาพที่ถ่าย"
      >


      <div
        id="photoPlaceholder"
        class="camera-placeholder"
      >

        <div class="camera-placeholder-icon">

          <svg
            width="38"
            height="38"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M14.5 4 16 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3l1.5-3Z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>

        </div>

        <div class="camera-placeholder-title">
          ถ่ายภาพยืนยัน
        </div>

        <div class="camera-placeholder-text">
          แตะปุ่ม “เปิดกล้องหน้า”
          เพื่อถ่ายภาพยืนยันการเข้าร่วมกิจกรรม
        </div>

      </div>


      <div
        id="faceGuide"
        class="face-guide hidden"
      ></div>

    </div>


    <button
      id="openPhotoBtn"
      class="btn primary"
      onclick="startPhotoCamera()"
    >
      เปิดกล้องหน้า
    </button>


    <button
      id="captureBtn"
      class="btn primary hidden"
      onclick="capturePhoto()"
    >
      ถ่ายภาพ
    </button>


    <button
      id="useBtn"
      class="btn success hidden"
      onclick="sendPhoto()"
    >
      ใช้ภาพนี้
    </button>


    <button
      id="retakeBtn"
      class="btn secondary hidden"
      onclick="retakePhoto()"
    >
      ถ่ายใหม่
    </button>


    <button
      class="btn secondary"
      onclick="returnHome()"
    >
      กลับระบบพกสุข
    </button>


    <div
      id="photoInfo"
      class="camera-info"
    ></div>

  </section>

</main>


<script>

/* =========================================================
   PARAMETERS
========================================================= */

const PARAMS =
  new URLSearchParams(
    window.location.search
  );


const MODE =
  PARAMS.get('mode')
  || 'scan';


const FACING =
  PARAMS.get('facing')
  || 'environment';


const SESSION =
  PARAMS.get('session')
  || '';


const RETURN_URL =
  PARAMS.get('returnUrl')
  || '';


/* =========================================================
   STATE
========================================================= */

let scanStream =
  null;


let photoStream =
  null;


let scanLoopId =
  null;


let scanning =
  false;


let qrFound =
  false;


let lastScanAt =
  0;


let capturedPhoto =
  '';


/* =========================================================
   INIT
========================================================= */

window.addEventListener(
  'load',
  init
);


async function init(){

  if (!SESSION){

    alert(
      'ไม่พบ Camera Session\nกรุณาเปิดกล้องจากระบบพกสุข'
    );

    return;

  }


  if (!RETURN_URL){

    alert(
      'ไม่พบ Return URL\nกรุณาเปิดกล้องจากระบบพกสุข'
    );

    return;

  }


  if (
    MODE === 'scan'
    &&
    typeof window.jsQR
    !== 'function'
  ){

    alert(
      'โหลดระบบอ่าน QR ไม่สำเร็จ\nกรุณาตรวจสอบอินเทอร์เน็ตแล้วเปิดใหม่'
    );

    return;

  }


  if (
    MODE === 'photo'
  ){

    document
      .getElementById(
        'photoPage'
      )
      .classList.remove(
        'hidden'
      );


    document
      .getElementById(
        'subtitle'
      )
      .textContent =
      'ถ่ายภาพยืนยันสมาชิก';


    /*
      สำคัญ:
      iPhone/iPad ไม่เปิดกล้องอัตโนมัติ
      ให้ผู้ใช้กดปุ่มเอง
    */
    return;

  }


  document
    .getElementById(
      'scannerPage'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'subtitle'
    )
    .textContent =
    'สแกน QR ประจำตัวสมาชิก';

}


/* =========================================================
   HELPER
========================================================= */

function sleep(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


function setScanStatus(
  text,
  type=''
){

  const element =
    document.getElementById(
      'scanStatus'
    );


  element.textContent =
    text;


  element.className =
    'status'
    +
    (
      type
        ? ' ' + type
        : ''
    );

}


function setPhotoInfo(text){

  const element =
    document.getElementById(
      'photoInfo'
    );


  if (element){

    element.textContent =
      text || '';

  }

}


/* =========================================================
   CAMERA PERMISSION / DEVICE
========================================================= */

async function listVideoDevices(){

  if (
    !navigator.mediaDevices
    ||
    !navigator.mediaDevices
      .enumerateDevices
  ){

    return [];

  }


  const devices =
    await navigator.mediaDevices
      .enumerateDevices();


  return devices.filter(
    device =>
      device.kind
      === 'videoinput'
  );

}


function findRearCamera(
  cameras
){

  if (
    !Array.isArray(cameras)
    ||
    !cameras.length
  ){

    return null;

  }


  const rear =
    cameras.find(
      camera => {

        const label =
          String(
            camera.label
            || ''
          )
          .toLowerCase();


        return (
          label.includes('back')
          ||
          label.includes('rear')
          ||
          label.includes('environment')
          ||
          label.includes('wide')
        );

      }
    );


  if (rear){

    return rear;

  }


  /*
    iPhone ส่วนใหญ่
    กล้องหลังอยู่ท้ายรายการ
  */
  return cameras[
    cameras.length - 1
  ];

}


/* =========================================================
   WAIT FOR VIDEO
========================================================= */

function waitForVideoFrame(
  video,
  timeoutMs=5000
){

  return new Promise(
    resolve => {

      const started =
        Date.now();


      const check =
        () => {

          if (
            video.readyState >= 2
            &&
            video.videoWidth > 0
            &&
            video.videoHeight > 0
          ){

            resolve(true);

            return;

          }


          if (
            Date.now()
            -
            started
            >
            timeoutMs
          ){

            resolve(false);

            return;

          }


          requestAnimationFrame(
            check
          );

        };


      check();

    }
  );

}


/* =========================================================
   OPEN CAMERA WITH TIMEOUT
========================================================= */

function getUserMediaWithTimeout(
  constraints,
  timeoutMs=12000
){

  return Promise.race([

    navigator.mediaDevices
      .getUserMedia(
        constraints
      ),

    new Promise(
      (_,reject) => {

        setTimeout(
          () => {

            reject(
              new Error(
                'เปิดกล้องนานเกินไป'
              )
            );

          },
          timeoutMs
        );

      }
    )

  ]);

}


/* =========================================================
   QR SCANNER
========================================================= */

async function startScanner(){

  const button =
    document.getElementById(
      'openScannerBtn'
    );


  const buttonText =
    document.getElementById(
      'openScannerText'
    );


  button.disabled =
    true;


  setScanStatus(
    'กำลังขอสิทธิ์เปิดกล้อง...',
    'loading'
  );


  await stopScanner();


  qrFound =
    false;


  const video =
    document.getElementById(
      'scanVideo'
    );


  try{

    if (
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices
        .getUserMedia
    ){

      throw new Error(
        'Browser นี้ไม่รองรับ Camera API'
      );

    }


    /*
      STEP 1:
      พยายามเปิดกล้องหลังแบบ simple constraint
      เหมาะกับ iPhone มากกว่าการใส่ constraint เยอะ
    */
    try{

      scanStream =
        await getUserMediaWithTimeout({

          audio:false,

          video:{
            facingMode:
              'environment'
          }

        });


    }catch(firstError){

      console.warn(
        'Environment camera failed:',
        firstError
      );


      setScanStatus(
        'กำลังค้นหากล้องหลัง...',
        'loading'
      );


      /*
        STEP 2:
        ขอ permission ด้วย video:true
        แล้วอ่านรายการกล้อง
      */
      let temporaryStream =
        null;


      try{

        temporaryStream =
          await getUserMediaWithTimeout({

            audio:false,

            video:true

          });


        temporaryStream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


      }catch(permissionError){

        console.warn(
          permissionError
        );

      }


      const cameras =
        await listVideoDevices();


      if (
        !cameras.length
      ){

        throw new Error(
          'ไม่พบกล้องในอุปกรณ์'
        );

      }


      const selected =
        findRearCamera(
          cameras
        );


      if (
        !selected
        ||
        !selected.deviceId
      ){

        throw new Error(
          'ไม่สามารถเลือกกล้องหลังได้'
        );

      }


      scanStream =
        await getUserMediaWithTimeout({

          audio:false,

          video:{

            deviceId:{
              exact:
                selected.deviceId
            }

          }

        });

    }


    /*
      STEP 3:
      ต่อ stream เข้า video
    */
    video.srcObject =
      scanStream;


    video.muted =
      true;


    video.playsInline =
      true;


    try{

      await video.play();

    }catch(playError){

      console.warn(
        'video.play first attempt:',
        playError
      );

    }


    let ready =
      await waitForVideoFrame(
        video,
        4500
      );


    /*
      STEP 4:
      iOS workaround
      stream เปิดแต่ video ดำ
      detach/reattach
    */
    if (!ready){

      const originalStream =
        scanStream;


      try{
        video.pause();
      }catch(_){}


      video.srcObject =
        null;


      await sleep(
        350
      );


      video.srcObject =
        originalStream;


      try{

        await video.play();

      }catch(error){

        console.warn(
          'video re-play:',
          error
        );

      }


      ready =
        await waitForVideoFrame(
          video,
          5000
        );

    }


    /*
      STEP 5:
      ถ้ายังดำ ลอง stop แล้วเปิดแบบ video:true
    */
    if (!ready){

      await stopScanner();


      setScanStatus(
        'กำลังลองเปิดกล้องอีกครั้ง...',
        'loading'
      );


      scanStream =
        await getUserMediaWithTimeout({

          audio:false,

          video:true

        });


      video.srcObject =
        scanStream;


      video.muted =
        true;


      video.playsInline =
        true;


      await video.play();


      ready =
        await waitForVideoFrame(
          video,
          5000
        );

    }


    if (!ready){

      throw new Error(
        'กล้องเปิดแล้วแต่ไม่มีภาพ กรุณาลองใหม่'
      );

    }


    /*
      CAMERA READY
    */
    document
      .getElementById(
        'scannerPlaceholder'
      )
      .classList.add(
        'hidden'
      );


    document
      .getElementById(
        'scanOverlay'
      )
      .classList.remove(
        'hidden'
      );


    setScanStatus(
      'นำ QR เข้าในกรอบ'
    );


    document
      .getElementById(
        'scannerInfo'
      )
      .textContent =
      'Camera ready • '
      +
      video.videoWidth
      +
      ' × '
      +
      video.videoHeight;


    buttonText.textContent =
      'สแกนใหม่';


    button.disabled =
      false;


    scanning =
      true;


    lastScanAt =
      0;


    scanLoop();


  }catch(error){

    console.error(
      'CAMERA ERROR:',
      error
    );


    await stopScanner();


    document
      .getElementById(
        'scannerPlaceholder'
      )
      .classList.remove(
        'hidden'
      );


    document
      .getElementById(
        'scanOverlay'
      )
      .classList.add(
        'hidden'
      );


    setScanStatus(
      'เปิดกล้องไม่สำเร็จ',
      'error'
    );


    buttonText.textContent =
      'ลองเปิดกล้องใหม่';


    button.disabled =
      false;


    alert(
      'เปิดกล้องไม่ได้\n\n'
      +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
      +
      '\n\n'
      +
      'กรุณาตรวจสอบสิทธิ์ Camera ของ Browser แล้วกด “ลองเปิดกล้องใหม่”'
    );

  }

}


/* =========================================================
   SCAN LOOP
========================================================= */

function scanLoop(
  timestamp=0
){

  if (
    !scanning
    ||
    qrFound
  ){

    return;

  }


  scanLoopId =
    requestAnimationFrame(
      scanLoop
    );


  /*
    ~8 scans / sec
  */
  if (
    timestamp
    -
    lastScanAt
    <
    120
  ){

    return;

  }


  lastScanAt =
    timestamp;


  const video =
    document.getElementById(
      'scanVideo'
    );


  if (
    !video
    ||
    video.readyState < 2
    ||
    !video.videoWidth
    ||
    !video.videoHeight
  ){

    return;

  }


  try{

    decodeQrFrame(
      video
    );

  }catch(error){

    console.warn(
      'QR decode:',
      error
    );

  }

}


/* =========================================================
   QR DECODE
========================================================= */

function decodeQrFrame(
  video
){

  const canvas =
    document.getElementById(
      'scanCanvas'
    );


  const ctx =
    canvas.getContext(
      '2d',
      {
        willReadFrequently:true
      }
    );


  /*
    ลด resolution เพื่อไม่ให้ iPhone ประมวลผลหนักเกินไป
  */
  const maxWidth =
    900;


  const ratio =
    Math.min(
      1,
      maxWidth
      /
      video.videoWidth
    );


  const width =
    Math.max(
      1,
      Math.round(
        video.videoWidth
        *
        ratio
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        video.videoHeight
        *
        ratio
      )
    );


  canvas.width =
    width;


  canvas.height =
    height;


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  /*
    PASS 1:
    อ่านภาพเต็ม
  */
  const fullImage =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  let result =
    jsQR(
      fullImage.data,
      width,
      height,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );


  if (
    result
    &&
    result.data
  ){

    handleQrSuccess(
      result.data
    );

    return;

  }


  /*
    PASS 2:
    อ่านเฉพาะกลางภาพ
  */
  const cropSize =
    Math.floor(
      Math.min(
        width,
        height
      )
      *
      .84
    );


  const sx =
    Math.max(
      0,
      Math.floor(
        (
          width - cropSize
        )
        /
        2
      )
    );


  const sy =
    Math.max(
      0,
      Math.floor(
        (
          height - cropSize
        )
        /
        2
      )
    );


  const crop =
    ctx.getImageData(
      sx,
      sy,
      cropSize,
      cropSize
    );


  result =
    jsQR(
      crop.data,
      cropSize,
      cropSize,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );


  if (
    result
    &&
    result.data
  ){

    handleQrSuccess(
      result.data
    );

  }

}


/* =========================================================
   QR SUCCESS
========================================================= */

async function handleQrSuccess(
  value
){

  if (qrFound){

    return;

  }


  value =
    String(
      value || ''
    ).trim();


  if (!value){

    return;

  }


  qrFound =
    true;


  scanning =
    false;


  setScanStatus(
    'อ่าน QR สำเร็จ กำลังกลับระบบพกสุข...',
    'success'
  );


  if (
    navigator.vibrate
  ){

    try{

      navigator.vibrate(
        100
      );

    }catch(_){}

  }


  await stopScanner();


  /*
    ส่งผลกลับ Apps Script
    ผ่าน POST

    ไม่ใช้ window.opener
    ไม่ใช้ postMessage
  */
  postBack({

    cameraAction:
      'qr',

    cameraSession:
      SESSION,

    cameraValue:
      value

  });

}


/* =========================================================
   STOP SCANNER
========================================================= */

async function stopScanner(){

  scanning =
    false;


  if (
    scanLoopId
  ){

    cancelAnimationFrame(
      scanLoopId
    );


    scanLoopId =
      null;

  }


  if (
    scanStream
  ){

    scanStream
      .getTracks()
      .forEach(
        track => {

          try{
            track.stop();
          }catch(_){}

        }
      );


    scanStream =
      null;

  }


  const video =
    document.getElementById(
      'scanVideo'
    );


  if (video){

    try{
      video.pause();
    }catch(_){}


    video.srcObject =
      null;

  }

}


/* =========================================================
   PHOTO CAMERA
========================================================= */

async function startPhotoCamera(){

  const openButton =
    document.getElementById(
      'openPhotoBtn'
    );


  openButton.disabled =
    true;


  setPhotoInfo(
    'กำลังขอสิทธิ์เปิดกล้องหน้า...'
  );


  await stopPhotoCamera();


  const video =
    document.getElementById(
      'photoVideo'
    );


  try{

    if (
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices
        .getUserMedia
    ){

      throw new Error(
        'Browser นี้ไม่รองรับ Camera API'
      );

    }


    /*
      simple constraint ก่อน
    */
    try{

      photoStream =
        await getUserMediaWithTimeout({

          audio:false,

          video:{
            facingMode:
              FACING === 'environment'
                ? 'environment'
                : 'user'
          }

        });


    }catch(firstError){

      console.warn(
        'Photo preferred camera failed:',
        firstError
      );


      /*
        fallback
      */
      photoStream =
        await getUserMediaWithTimeout({

          audio:false,

          video:true

        });

    }


    video.srcObject =
      photoStream;


    video.muted =
      true;


    video.playsInline =
      true;


    await video.play();


    let ready =
      await waitForVideoFrame(
        video,
        4500
      );


    /*
      iOS black video workaround
    */
    if (!ready){

      const originalStream =
        photoStream;


      try{
        video.pause();
      }catch(_){}


      video.srcObject =
        null;


      await sleep(
        350
      );


      video.srcObject =
        originalStream;


      await video.play();


      ready =
        await waitForVideoFrame(
          video,
          5000
        );

    }


    if (!ready){

      throw new Error(
        'กล้องเปิดแล้วแต่ไม่มีภาพ กรุณาลองใหม่'
      );

    }


    document
      .getElementById(
        'photoPlaceholder'
      )
      .classList.add(
        'hidden'
      );


    document
      .getElementById(
        'faceGuide'
      )
      .classList.remove(
        'hidden'
      );


    document
      .getElementById(
        'openPhotoBtn'
      )
      .classList.add(
        'hidden'
      );


    document
      .getElementById(
        'captureBtn'
      )
      .classList.remove(
        'hidden'
      );


    document
      .getElementById(
        'photoPreview'
      )
      .classList.add(
        'hidden'
      );


    document
      .getElementById(
        'photoInfo'
      )
      .textContent =
      'Camera ready • '
      +
      video.videoWidth
      +
      ' × '
      +
      video.videoHeight;


  }catch(error){

    console.error(
      'PHOTO CAMERA ERROR:',
      error
    );


    await stopPhotoCamera();


    openButton.disabled =
      false;


    setPhotoInfo(
      'เปิดกล้องไม่สำเร็จ'
    );


    alert(
      'เปิดกล้องไม่ได้\n\n'
      +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
      +
      '\n\nกรุณาตรวจสอบสิทธิ์ Camera แล้วลองใหม่'
    );

  }

}

/* =========================================================
   CAPTURE PHOTO
========================================================= */

async function capturePhoto(){

  const video =
    document.getElementById(
      'photoVideo'
    );


  if (
    !video
    ||
    !video.videoWidth
    ||
    !video.videoHeight
  ){

    alert(
      'กล้องยังไม่พร้อม กรุณารอสักครู่'
    );

    return;

  }


  /*
    Check-in image:
    max side 560px
    quality .32
  */
  const MAX_SIDE =
    560;


  const QUALITY =
    .32;


  const scale =
    Math.min(
      1,
      MAX_SIDE
      /
      Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        video.videoWidth
        *
        scale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        video.videoHeight
        *
        scale
      )
    );


  const ctx =
    canvas.getContext(
      '2d',
      {
        alpha:false
      }
    );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    WebP ก่อน
  */
  capturedPhoto =
    canvas.toDataURL(
      'image/webp',
      QUALITY
    );


  /*
    JPEG fallback
  */
  if (
    !capturedPhoto.startsWith(
      'data:image/webp'
    )
  ){

    capturedPhoto =
      canvas.toDataURL(
        'image/jpeg',
        QUALITY
      );

  }


  await stopPhotoCamera();


  const preview =
    document.getElementById(
      'photoPreview'
    );


  preview.src =
    capturedPhoto;


  preview.classList.remove(
    'hidden'
  );


  video.classList.add(
    'hidden'
  );


  document
    .getElementById(
      'faceGuide'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'captureBtn'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'useBtn'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'retakeBtn'
    )
    .classList.remove(
      'hidden'
    );


  setPhotoInfo(
    'ตรวจสอบภาพ แล้วกด “ใช้ภาพนี้”'
  );

}

async function sendPhoto(){

  if (!capturedPhoto){

    alert(
      'ยังไม่ได้ถ่ายภาพ'
    );

    return;

  }


  await stopPhotoCamera();


  setPhotoInfo(

  /*
    ส่ง Base64 ใน POST body
    ไม่ใส่ใน URL

  postBack({

    cameraSession:

    cameraData:
      capturedPhoto

/* =========================================================
   POST BACK TO GOOGLE APPS SCRIPT
========================================================= */

function postBack(fields){

  if (!RETURN_URL){

    alert(
      'ไม่พบ Return URL'
    );

    return;

  }


  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';


  form.action =
    RETURN_URL;


  /*
    สำคัญ:
    navigate ในหน้าเดิม
  */
  form.target =
    '_self';


  form.style.display =
    'none';


  Object.keys(
    fields || {}
  )
  .forEach(key => {

    const input =
      document.createElement(
        'input'
      );


    input.type =
      'hidden';


    input.name =
      key;


    input.value =
      fields[key];


    form.appendChild(
      input
    );

  });


  document.body.appendChild(
    form
  );


  form.submit();

}


/* =========================================================
   RETURN WITHOUT RESULT
========================================================= */

async function returnHome(){

  await stopScanner();

  await stopPhotoCamera();


  if (!RETURN_URL){

    history.back();

    return;

  }


  window.location.replace(
    RETURN_URL
  );

}
